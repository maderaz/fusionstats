<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/data-source.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity — Fusion Stats</title>
  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9A%9B%EF%B8%8F</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme before first paint so dark mode never flashes light.
    try { if (localStorage.getItem('fusionstats_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch {}
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #F5F5FA;
      --bg-alt: #EDEDF4;
      --surface: #FFFFFF;
      --stroke: #E5E5E5;
      --stroke-light: #EFEFF3;
      --text: #0E0E14;
      --text-body: #70747A;
      --text-secondary: #9BA3AF;
      --accent: #8429FF;
      --accent-end: #6C00FF;
      --accent-light: #A37FFF;
      --accent-bg: rgba(132, 41, 255, 0.08);
      --hover: rgba(132, 41, 255, 0.035);
      --green: #16a34a;
      --green-ink: #15803d;
      --green-bg: rgba(22, 163, 74, 0.10);
      --red: #dc2626;
      --red-ink: #c81e1e;
      --red-bg: rgba(220, 38, 38, 0.08);
      --amber: #b45309;
      --amber-bg: rgba(217, 119, 6, 0.10);
      --amber-stroke: rgba(217, 119, 6, 0.28);
      --tip-bg: #16161E;
      --tip-fg: #FFFFFF;
      --shadow: 0 1px 2px rgba(20, 20, 40, 0.04);
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0F0F14;
      --bg-alt: #1A1A24;
      --surface: #16161E;
      --stroke: #2A2A3A;
      --stroke-light: #21212C;
      --text: #E8E8F0;
      --text-body: #9A9AB0;
      --text-secondary: #7A7A92;
      --accent: #A37FFF;
      --accent-end: #8429FF;
      --accent-light: #B89AFF;
      --accent-bg: rgba(132, 41, 255, 0.16);
      --hover: rgba(163, 127, 255, 0.05);
      --green: #22c55e;
      --green-ink: #4ade80;
      --green-bg: rgba(34, 197, 94, 0.12);
      --red: #ef4444;
      --red-ink: #f87171;
      --red-bg: rgba(239, 68, 68, 0.12);
      --amber: #f59e0b;
      --amber-bg: rgba(245, 158, 11, 0.12);
      --amber-stroke: rgba(245, 158, 11, 0.30);
      --tip-bg: #F2F2F7;
      --tip-fg: #0F0F14;
      --shadow: none;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      transition: background 0.2s, color 0.2s;
    }

    /* Everything below sizes itself to the content column, not the window:
       the sidebar from nav.js takes 220px on desktop and none on mobile. */
    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 32px 72px;
      container-type: inline-size;
    }

    .num-bold {
      font-family: var(--mono);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.66rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-body);
    }

    /* ---------- Header ---------- */
    .page-head {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px 24px;
      margin-bottom: 20px;
    }
    .page-head h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.2;
    }
    .page-head p {
      margin-top: 4px;
      font-size: 0.875rem;
      color: var(--text-body);
    }
    .head-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 30px;
      padding: 0 12px;
      border: 1px solid var(--stroke);
      border-radius: 999px;
      background: var(--surface);
      font-size: 0.72rem;
      color: var(--text-body);
      white-space: nowrap;
    }
    #lastUpdated:empty { display: none; }
    #lastUpdated .ago { color: var(--accent); font-weight: 500; }
    #lastUpdated .next { color: var(--text-secondary); }
    #lastUpdated .next::before { content: '\00b7'; margin: 0 6px; }

    .theme-toggle {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: var(--surface);
      color: var(--text-body);
      font-size: 0.9rem;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, border-color 0.15s;
    }
    .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }

    /* ---------- Info tips (one floating bubble, see script) ---------- */
    .info-tip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      font-size: 0.72rem;
      font-weight: 400;
      line-height: 1;
      color: var(--text-secondary);
      cursor: help;
      vertical-align: middle;
      text-transform: none;
      letter-spacing: 0;
      border-radius: 50%;
      outline: none;
      transition: color 0.15s;
    }
    .info-tip:hover, .info-tip:focus-visible { color: var(--accent); }
    .tip-bubble {
      position: fixed;
      z-index: 200;
      max-width: 260px;
      padding: 8px 11px;
      border-radius: 9px;
      background: var(--tip-bg);
      color: var(--tip-fg);
      font-family: 'Poppins', -apple-system, sans-serif;
      font-size: 0.7rem;
      line-height: 1.5;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      pointer-events: none;
      opacity: 0;
      transform: translateY(3px);
      transition: opacity 0.12s, transform 0.12s;
    }
    .tip-bubble.show { opacity: 1; transform: none; }

    /* ---------- Overview: net inflow + daily net flow ---------- */
    .overview {
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr);
      margin-bottom: 16px;
    }
    .kpis { padding: 16px 20px 12px; }
    .stats-row { display: grid; margin-top: 8px; }
    .stat-card {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-top: 1px solid var(--stroke-light);
    }
    .stat-card:first-child { border-top: none; }
    .stat-card .label {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-body);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stat-card .value {
      font-size: 1.22rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .flow-chart {
      padding: 16px 20px 12px;
      border-left: 1px solid var(--stroke-light);
      min-width: 0;
    }
    .flow-chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .flow-chart-range {
      font-size: 0.68rem;
      color: var(--text-secondary);
    }
    .flow-chart-bars {
      position: relative;
      display: flex;
      align-items: stretch;
      gap: 2px;
      height: 112px;
    }
    .flow-chart-bars::before {                  /* zero line */
      content: '';
      position: absolute;
      left: 0; right: 0; top: 50%;
      height: 1px;
      background: var(--stroke);
    }
    .flow-bar-slot {
      position: relative;
      flex: 1;
      border-radius: 4px;
      transition: background 0.12s;
    }
    .flow-bar-slot:hover { background: var(--hover); }
    .flow-bar {
      position: absolute;
      left: 16%;
      right: 16%;
      min-height: 2px;
    }
    .flow-bar.positive { background: var(--green); bottom: 50%; border-radius: 3px 3px 1px 1px; }
    .flow-bar.negative { background: var(--red); top: 50%; border-radius: 1px 1px 3px 3px; }
    .flow-bar-slot .flow-bar-tooltip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 9px;
      border-radius: 8px;
      background: var(--tip-bg);
      color: var(--tip-fg);
      font-size: 0.68rem;
      line-height: 1.4;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      visibility: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
      transition: opacity 0.1s;
    }
    .flow-bar-tooltip strong { font-family: var(--mono); font-weight: 500; }
    .flow-bar-slot:nth-child(-n+4) .flow-bar-tooltip { left: 0; transform: none; text-align: left; }
    .flow-bar-slot:nth-last-child(-n+4) .flow-bar-tooltip { left: auto; right: 0; transform: none; text-align: right; }
    .flow-bar-slot:hover .flow-bar-tooltip { opacity: 1; visibility: visible; }
    .flow-chart-axis {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.66rem;
      color: var(--text-secondary);
    }

    /* ---------- Events ---------- */
    .activity-card { overflow: clip; }
    .card-head { padding: 16px 20px 0; }
    .card-head h2 {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .activity-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 20px 16px;
      border-bottom: 1px solid var(--stroke);
    }
    .filter-group {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      height: 32px;
      padding-left: 11px;
      border: 1px solid var(--stroke);
      border-radius: 9px;
      background: var(--surface);
      cursor: pointer;
      min-width: 0;
      transition: border-color 0.15s, background 0.15s;
    }
    .filter-group:hover { border-color: var(--text-secondary); }
    .filter-group:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
    .filter-label {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-body);
      white-space: nowrap;
    }
    .activity-filters select {
      field-sizing: content;
      min-width: 0;
      max-width: 15rem;
      height: 100%;
      padding: 0 26px 0 6px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%239BA3AF' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 10px center;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
      outline: none;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--surface);
      text-align: left;
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-body);
      padding: 10px 12px;
      border-bottom: 1px solid var(--stroke);
      white-space: nowrap;
    }
    td {
      padding: 9px 12px;
      font-size: 0.8rem;
      color: var(--text-body);
      border-bottom: 1px solid var(--stroke-light);
      white-space: nowrap;
      vertical-align: middle;
    }
    th:first-child, td:first-child { padding-left: 20px; }
    th:last-child, td:last-child { padding-right: 20px; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.1s; }
    tbody tr:hover td { background: var(--hover); }

    .col-num { text-align: right; white-space: nowrap; }
    td.col-num.num-bold { color: var(--text); font-size: 0.78rem; }
    .sym { color: var(--text-secondary); font-weight: 400; font-size: 0.92em; }
    .usd-cell { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .usd-value {
      font-family: var(--mono);
      font-size: 0.74rem;
      color: var(--text-body);
      white-space: nowrap;
    }

    .badge-deposit, .badge-withdraw {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 7px;
      border-radius: 6px;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s;
    }
    .badge-deposit { color: var(--green-ink); background: var(--green-bg); }
    .badge-deposit:hover { background: rgba(22, 163, 74, 0.2); }
    .badge-withdraw { color: var(--red-ink); background: var(--red-bg); }
    .badge-withdraw:hover { background: rgba(220, 38, 38, 0.18); }

    /* Synthetic-flow markers */
    .synth-badge {
      display: inline-flex;
      align-items: center;
      height: 18px;
      margin-left: 6px;
      padding: 0 6px;
      border-radius: 5px;
      border: 1px solid var(--amber-stroke);
      background: var(--amber-bg);
      color: var(--amber);
      font-family: var(--mono);
      font-size: 0.6rem;
      font-weight: 500;
      text-transform: lowercase;
      cursor: help;
      vertical-align: middle;
    }
    tr.row-synthetic td,
    .mobile-event.row-synthetic { opacity: 0.6; }
    tr.row-synthetic:hover td,
    .mobile-event.row-synthetic:hover { opacity: 1; }

    /* The product column takes whatever width is left and truncates. */
    .vault-name {
      width: 100%;
      max-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .product-link {
      color: var(--text);
      text-decoration: none;
      transition: color 0.15s;
    }
    .product-link:hover { color: var(--accent); }

    .addr-link {
      font-family: var(--mono);
      font-size: 0.74rem;
      color: var(--accent);
      text-decoration: none;
    }
    .addr-link:hover { text-decoration: underline; text-underline-offset: 2px; }

    .debank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #FF6B00;
      color: #fff;
      font-size: 0.56rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .debank:hover { transform: scale(1.08); box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.18); }

    .loading-msg {
      padding: 56px 20px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }
    .loading-msg strong { color: var(--text-body); font-weight: 600; }
    .error-msg {
      margin-top: 16px;
      padding: 18px 20px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--red);
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 14px;
    }
    .error-msg small { color: var(--text-secondary); }

    /* Event cards replace the table when the column is narrow. */
    .mobile-events { display: none; }
    .mobile-event {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--stroke-light);
    }
    .mobile-event:last-child { border-bottom: none; }
    .mobile-event-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .mobile-event-badges { display: inline-flex; align-items: center; gap: 0; min-width: 0; }
    .mobile-event-when { font-size: 0.7rem; color: var(--text-secondary); white-space: nowrap; }
    .mobile-event-amount {
      font-family: var(--mono);
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .mobile-event-usd {
      font-family: var(--mono);
      font-size: 0.76rem;
      color: var(--text-body);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .mobile-event-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.74rem;
    }
    .mobile-event-product {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-body);
    }
    .mobile-event-who { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .mobile-event-user { font-size: 0.7rem; }
    .mobile-event .debank { width: 16px; height: 16px; font-size: 0.5rem; }

    @container (max-width: 900px) {
      /* Tighter cells; a long product name wraps to a second line rather
         than being cut to a few letters. */
      th, td { padding-left: 9px; padding-right: 9px; }
      th:first-child, td:first-child { padding-left: 16px; }
      th:last-child, td:last-child { padding-right: 16px; }
      td { font-size: 0.76rem; }
      .vault-name { white-space: normal; }
      .vault-name .product-link {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
        line-height: 1.3;
      }
      .card-head { padding: 14px 16px 0; }
      .activity-filters { padding: 12px 16px 14px; }
    }

    @container (max-width: 820px) {
      .overview { grid-template-columns: 200px minmax(0, 1fr); }
      .kpis, .flow-chart { padding-left: 16px; padding-right: 16px; }
      .stat-card .value { font-size: 1.08rem; }
    }

    @container (max-width: 700px) {
      /* Table → cards */
      .activity-card table { display: none; }
      .mobile-events { display: block; }

      /* Net inflow strip above the chart */
      .overview { grid-template-columns: minmax(0, 1fr); }
      .kpis { padding: 14px 16px 12px; border-bottom: 1px solid var(--stroke-light); }
      .stats-row { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 10px; }
      .stat-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        padding: 0 0 0 12px;
        border-top: none;
        border-left: 1px solid var(--stroke-light);
      }
      .stat-card:first-child { padding-left: 0; border-left: none; }
      .stat-card .label { font-size: 0.64rem; }
      .stat-card .value { font-size: 1rem; }
      .flow-chart { border-left: none; padding: 14px 16px 10px; }
      .flow-chart-bars { height: 92px; gap: 1px; }
      .flow-bar { left: 12%; right: 12%; }

      /* Filters: a tidy grid, label above value */
      .card-head { padding: 14px 16px 0; }
      .activity-filters {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
        gap: 8px;
        padding: 12px 16px 14px;
      }
      /* The select covers the whole pill so a tap anywhere opens it; the
         label sits on top and lets taps through, except on its ⓘ. */
      .filter-group {
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: 0;
        height: 46px;
        padding: 7px 10px 0;
      }
      .filter-label { position: relative; z-index: 1; pointer-events: none; font-size: 0.58rem; }
      .filter-label .info-tip { pointer-events: auto; }
      .activity-filters select {
        position: absolute;
        inset: 0;
        field-sizing: fixed;
        width: 100%;
        max-width: none;
        height: 100%;
        padding: 17px 26px 0 10px;
        border-radius: 9px;
        font-size: 0.8rem;
      }
    }

    @media (max-width: 900px) {
      .container { padding: 8px 20px 48px; }
    }
    @media (max-width: 480px) {
      .container { padding: 4px 16px 40px; }
      .page-head { gap: 12px; margin-bottom: 16px; }
      .page-head h1 { font-size: 1.35rem; }
      .page-head p { font-size: 0.8rem; }
      .page-head h1 { padding-right: 40px; }
      .meta-pill { height: 28px; padding: 0 10px; font-size: 0.68rem; }
      .theme-toggle { position: absolute; top: -2px; right: 0; width: 30px; height: 30px; }
    }
  </style>
  <script defer src="/track.js"></script>
  <script src="/nav.js"></script>
</head>
<body>
  <div class="container">
    <header class="page-head">
      <div>
        <h1>Vault Activity</h1>
        <p>Deposit &amp; withdrawal events across all Fusion vaults</p>
      </div>
      <div class="head-meta">
        <span id="lastUpdated" class="meta-pill"></span>
        <span id="vaultCount" class="meta-pill" style="display:none"></span>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">&#9790;</button>
      </div>
    </header>

    <section id="overview" class="overview card" style="display:none">
      <div class="kpis">
        <div class="eyebrow">Net inflow <span class="info-tip" tabindex="0" data-tip="Deposits minus withdrawals (synthetic flow excluded), re-priced at today's per-symbol price so the headline tracks USD-denominated TVL change instead of drifting with intra-window ETH/BTC moves.">&#9432;</span></div>
        <div id="statsRow" class="stats-row"></div>
      </div>
      <div id="flowChart" class="flow-chart" style="display:none">
        <div class="flow-chart-header">
          <span class="flow-chart-title eyebrow">Daily net flow</span>
          <span class="flow-chart-range">last <span id="flowRangeLabel">30d</span></span>
        </div>
        <div class="flow-chart-bars" id="flowChartBars"></div>
        <div class="flow-chart-axis">
          <span id="flowChartStart"></span>
          <span id="flowChartEnd"></span>
        </div>
      </div>
    </section>

    <section class="activity-card card">
      <div class="card-head">
        <h2>Recent Deposits &amp; Withdrawals</h2>
      </div>
      <div class="activity-filters">
        <label class="filter-group">
          <span class="filter-label">Min amount</span>
          <select id="filterAmount">
            <option value="0">All</option>
            <option value="1000" selected>≥ $1K</option>
            <option value="10000">≥ $10K</option>
            <option value="100000">≥ $100K</option>
          </select>
        </label>
        <label class="filter-group">
          <span class="filter-label">Type</span>
          <select id="filterType">
            <option value="">All</option>
            <option value="deposit">Deposits</option>
            <option value="withdraw">Withdrawals</option>
          </select>
        </label>
        <label class="filter-group">
          <span class="filter-label">Product</span>
          <select id="filterProduct">
            <option value="">All products</option>
          </select>
        </label>
        <label class="filter-group">
          <span class="filter-label">Chain</span>
          <select id="filterChain">
            <option value="">All chains</option>
          </select>
        </label>
        <label class="filter-group" title="Vaults whose underlying is a tokenised stock (Apple, Nvidia, Meta, Google, Microsoft, Coinbase...).">
          <span class="filter-label">Stocks
            <span class="info-tip" tabindex="0" data-tip="Vaults backed by tokenised equities. Detected from the underlying token address, which uses the 0xb2 vanity prefix, rather than from the vault name — name matching on &quot;Carry Trade&quot; would wrongly pull in the cbXRP, USDC and WETH carry vaults. New stock vaults are picked up automatically.">&#9432;</span>
          </span>
          <select id="filterStocks">
            <option value="" selected>All vaults</option>
            <option value="only">Stocks only</option>
            <option value="exclude">Exclude stocks</option>
          </select>
        </label>
        <label class="filter-group" title="Atomic round-trips, flashloan-loops and recurring keepers are hidden by default. Enable to inspect synthetic flow.">
          <span class="filter-label">Synthetic
            <span class="info-tip" tabindex="0" data-tip="Detected automated/atomic flow that's not a genuine user deposit/withdrawal: same-tx D+W on the same vault, same-block round-trips, single events larger than 3× vault TVL, recurring keeper rotations, and recurring (depositor → withdrawer) address pairs. Toggle to inspect.">&#9432;</span>
          </span>
          <select id="filterSynthetic">
            <option value="hide" selected>Hide</option>
            <option value="show">Show</option>
            <option value="only">Only synthetic</option>
          </select>
        </label>
      </div>
      <div id="activityContent">
        <div class="loading-msg" id="loadingMsg">Fetching on-chain events...</div>
      </div>
    </section>

    <div id="errorContent" style="display:none"></div>
  </div>

  <script>
    // Theme
    const themeToggle = document.getElementById('themeToggle');
    const saved = localStorage.getItem('fusionstats_theme');
    if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');
      localStorage.setItem('fusionstats_theme', isDark ? '' : 'dark');
    });

    function formatAmount(n) {
      if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return n.toFixed(2);
      if (n >= 1) return n.toFixed(4);
      return n.toFixed(6);
    }

    function shortAddr(a) {
      return a.slice(0, 6) + '...' + a.slice(-4);
    }

    // Block explorer per chain, for the tx and wallet links. Events stored
    // before chains were tagged carry no chain; they are all Ethereum.
    const EXPLORERS = {
      ethereum: 'https://etherscan.io',
      arbitrum: 'https://arbiscan.io',
      base: 'https://basescan.org',
      unichain: 'https://uniscan.xyz',
      plasma: 'https://plasmascan.to',
      avalanche: 'https://snowtrace.io',
      tac: 'https://explorer.tac.build',
      ink: 'https://explorer.inkonchain.com',
      katana: 'https://explorer.katanarpc.com',
    };
    const explorerFor = (chain) => EXPLORERS[chain || 'ethereum'] || EXPLORERS.ethereum;

    function timeAgo(ts) {
      const diff = Math.floor((Date.now() / 1000) - ts);
      if (diff < 60) return diff + 's ago';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      return Math.floor(diff / 86400) + 'd ago';
    }

    // Filter state (persisted in localStorage)
    let allEvents = [];
    let lastUpdatedAt = null;
    let updatedLabelTimer = null;
    const FILTER_AMOUNT_KEY = 'fusionstats_filter_amount';
    const FILTER_PRODUCT_KEY = 'fusionstats_filter_product';
    const FILTER_STOCKS_KEY = 'fusionstats_filter_stocks';
    const FILTER_SYNTHETIC_KEY = 'fusionstats_filter_synthetic';

    // Per-symbol USD price taken from the MOST RECENT priced event of that
    // symbol (by timestamp). Used to value events the price API hasn't filled
    // yet (usdValue null). Picking by timestamp matters: activity-events.json
    // is in scan/append order, not time order, so "last in array" can grab a
    // months-old price (e.g. WETH at $4.4K from last September). One shared
    // lookup keeps the cards, the flow chart and the table consistent.
    let priceBySymbol = {};
    function buildPriceLookup(events) {
      const best = {}; // symbol -> { ts, price }
      for (const e of events) {
        if (e.usdValue == null || !(e.assets > 0) || !e.symbol) continue;
        const ts = e.timestamp || 0;
        if (!best[e.symbol] || ts > best[e.symbol].ts) best[e.symbol] = { ts, price: e.usdValue / e.assets };
      }
      priceBySymbol = {};
      for (const sym in best) priceBySymbol[sym] = best[sym].price;
    }
    // Best-effort USD for an event: exact when priced, else symbol fallback.
    function eventUsd(e) {
      if (e.usdValue != null) return e.usdValue;
      if (e.assets > 0 && e.symbol && priceBySymbol[e.symbol]) return e.assets * priceBySymbol[e.symbol];
      return null;
    }

    // Frontend fallback re-classifier — covers older JSON snapshots that pre-date
    // the backend tagger. Only applies the two cheapest heuristics; the full set
    // (recurring-keeper, address-pair, near-block-pair) lives in collect-activity.js
    // and is read from the JSON when present.
    function reclassifySyntheticFallback(events, vaultsByAddr) {
      const SYNTHETIC_TVL_MULT = 3;
      // Atomic same-tx D+W on the SAME vault
      const byTxVault = {};
      events.forEach(e => {
        if (e.synthetic !== undefined) return;
        const k = `${e.tx}|${e.vault}`;
        (byTxVault[k] ||= []).push(e);
      });
      for (const evs of Object.values(byTxVault)) {
        if (evs.some(e => e.type === 'deposit') && evs.some(e => e.type === 'withdraw')) {
          evs.forEach(e => { e.synthetic = true; e.syntheticReason = 'atomic'; });
        }
      }
      // TVL-ratio
      events.forEach(e => {
        if (e.synthetic) return;
        const v = vaultsByAddr[e.vault];
        const tvl = v?.tvl || 0;
        if (tvl <= 0) return;
        const usd = e.usdValue != null ? Math.abs(e.usdValue) : 0;
        if (usd > SYNTHETIC_TVL_MULT * tvl) {
          e.synthetic = true;
          e.syntheticReason = 'tvl-ratio';
        }
      });
    }

    // Tokenised-equity vaults. Keyed on the underlying token's 0xb2 vanity
    // prefix rather than the vault name: matching /carry trade/i would also
    // catch the cbXRP, USDC (Test) and WETH carry vaults, which are not
    // stocks. Any future stock vault is picked up with no code change.
    const STOCK_ASSET_RE = /^0xb20{20}/;
    function isStockEvent(e) {
      return STOCK_ASSET_RE.test((e.underlyingToken || '').toLowerCase());
    }

    function applyFilters() {
      const minAmount = parseFloat(document.getElementById('filterAmount').value) || 0;
      const product = document.getElementById('filterProduct').value;
      const type = document.getElementById('filterType').value;
      const chain = document.getElementById('filterChain').value;
      const syntheticMode = document.getElementById('filterSynthetic').value || 'hide';
      const stocksMode = document.getElementById('filterStocks').value || '';
      localStorage.setItem(FILTER_STOCKS_KEY, stocksMode);
      localStorage.setItem(FILTER_AMOUNT_KEY, String(minAmount));
      localStorage.setItem(FILTER_PRODUCT_KEY, product);
      localStorage.setItem(FILTER_SYNTHETIC_KEY, syntheticMode);

      const filtered = allEvents.filter(e => {
        if (stocksMode === 'only' && !isStockEvent(e)) return false;
        if (stocksMode === 'exclude' && isStockEvent(e)) return false;
        if (syntheticMode === 'hide' && e.synthetic) return false;
        if (syntheticMode === 'only' && !e.synthetic) return false;
        if (type && e.type !== type) return false;
        if (chain && (e.chain || 'ethereum') !== chain) return false;
        if (minAmount > 0) {
          const u = eventUsd(e);
          const usd = u != null ? Math.abs(u) : 0;
          if (usd < minAmount) return false;
        }
        if (product && e.vaultName !== product) return false;
        return true;
      });
      renderTable(filtered.slice(0, 500), lastUpdatedAt);
    }

    function populateProductFilter() {
      const select = document.getElementById('filterProduct');
      const current = select.value;
      const names = [...new Set(allEvents.map(e => e.vaultName).filter(Boolean))].sort();
      select.innerHTML = '<option value="">All products</option>'
        + names.map(n => `<option value="${n.replace(/"/g, '&quot;')}">${n}</option>`).join('');
      const stored = localStorage.getItem(FILTER_PRODUCT_KEY) || current;
      if (stored && names.includes(stored)) select.value = stored;
    }

    let trackedVaults = [];
    let chainsWithEvents = new Set();

    function populateChainFilter() {
      const select = document.getElementById('filterChain');
      // All chains from tracked vaults
      const allChains = [...new Set(trackedVaults.map(v => v.chain || 'ethereum'))].sort();
      chainsWithEvents = new Set(allEvents.map(e => e.chain || 'ethereum'));
      select.innerHTML = '<option value="">All chains</option>'
        + allChains.map(c => {
          const hasEvents = chainsWithEvents.has(c);
          const count = trackedVaults.filter(v => (v.chain || 'ethereum') === c).length;
          const label = hasEvents ? `${c} (${count})` : `${c} (${count}) — no events yet`;
          return `<option value="${c}">${label}</option>`;
        }).join('');
    }

    async function loadActivity() {
      const status = document.getElementById('loadingMsg');

      try {
        status.textContent = 'Loading activity data...';
        const res = await fetch('activity-events.json');
        if (!res.ok) throw new Error(`HTTP ${res.status} — run collect-activity.js first`);
        const data = await res.json();

        const events = data.events || [];

        // Always use vault lookup as source of truth for symbol/name
        trackedVaults = data.vaults || [];
        // Also pull full vault list from ipor-vaults.json for complete chain coverage
        // and to provide TVL for the synthetic-detection fallback heuristic.
        try {
          const iporRes = await fetch('ipor-vaults.json');
          if (iporRes.ok) {
            const ipor = await iporRes.json();
            const activityAddrs = new Set(trackedVaults.map(v => v.address));
            const iporByAddr = {};
            (ipor.vaults || []).forEach(v => { iporByAddr[v.address.toLowerCase()] = v; });
            // Backfill TVL onto the tracked-vault list (data.vaults entries may
            // not carry tvl on older snapshots — backend now writes it).
            trackedVaults.forEach(v => {
              if (v.tvl == null) {
                const i = iporByAddr[v.address];
                if (i) v.tvl = i.tvl || 0;
              }
            });
            (ipor.vaults || []).filter(v => v.tvl >= 1000 && !activityAddrs.has(v.address)).forEach(v => {
              trackedVaults.push({ address: v.address, name: v.name, symbol: v.token, chain: v.chain, tvl: v.tvl });
            });
          }
        } catch {}
        const vaultInfo = {};
        trackedVaults.forEach(v => { vaultInfo[v.address] = v; });
        events.forEach(e => {
          const v = vaultInfo[e.vault];
          if (v) { e.symbol = v.symbol; e.vaultName = v.name; }
        });

        // Tag synthetic events not flagged by the backend (handles older JSONs).
        reclassifySyntheticFallback(events, vaultInfo);

        // Build the shared most-recent-by-time price lookup before anything
        // that values events (cards, chart, table all read it).
        buildPriceLookup(events);

        // Net inflows (deposits - withdrawals) in USD — synthetic excluded so
        // a flashloan-loop bot can't make 24h flow look like a $50M inflow.
        // Flows are re-priced at the latest per-symbol price (priceBySymbol)
        // so the headline reflects today's USD value of the unit-asset flow
        // rather than USD-at-deposit-time. Without this re-pricing a 30% drop
        // in ETH leaves the 30d card showing inflows that USD-denominated
        // TVL never realized, and the headline diverges from the official
        // TVL series. If a symbol has no recent priced sample we fall back
        // to the event's stored usdValue.
        function netFlowUsd(evts, seconds) {
          const cutoff = Math.floor(Date.now() / 1000) - seconds;
          let net = 0;
          evts.forEach(e => {
            if (e.synthetic || (e.timestamp || 0) <= cutoff) return;
            let usd = null;
            if (e.assets > 0 && e.symbol && priceBySymbol[e.symbol]) {
              usd = e.assets * priceBySymbol[e.symbol];
            } else if (e.usdValue != null) {
              usd = e.usdValue;
            }
            if (usd == null) return;
            net += e.type === 'deposit' ? usd : -usd;
          });
          return net;
        }

        const net24h = netFlowUsd(events, 86400);
        const net7d = netFlowUsd(events, 7 * 86400);
        const net30d = netFlowUsd(events, 30 * 86400);

        // Show vault count badge
        const vaultCountEl = document.getElementById('vaultCount');
        const vaultCount = (data.vaults || []).length;
        if (vaultCount > 0) {
          const floor = data.minTvlUsd != null ? data.minTvlUsd : 50;
          const floorLabel = floor >= 1000 ? `$${floor / 1000}K` : `$${floor}`;
          vaultCountEl.innerHTML = `Vaults Tracked: ${vaultCount} <span class="info-tip" tabindex="0" data-tip="All Fusion vaults above ${floorLabel} TVL across all supported networks. /all-vaults applies no floor, so it lists more.">&#9432;</span>`;
          vaultCountEl.style.display = '';
        }

        allEvents = events.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        lastUpdatedAt = data.updatedAt;
        populateProductFilter();
        populateChainFilter();

        // Restore stored amount filter (default $1K = already selected in HTML)
        const storedAmount = localStorage.getItem(FILTER_AMOUNT_KEY);
        if (storedAmount !== null) {
          const amountSel = document.getElementById('filterAmount');
          if ([...amountSel.options].some(o => o.value === storedAmount)) {
            amountSel.value = storedAmount;
          }
        }

        // Restore synthetic-mode preference
        // /stocks lands here as ?stocks=only. An explicit URL beats whatever
        // was last stored, so a shared link always shows what it promises.
        const urlStocks = new URLSearchParams(location.search).get('stocks');
        const storedStocks = urlStocks || localStorage.getItem(FILTER_STOCKS_KEY);
        if (storedStocks) {
          const stockSel = document.getElementById('filterStocks');
          if ([...stockSel.options].some(o => o.value === storedStocks)) {
            stockSel.value = storedStocks;
          }
        }

        const storedSynthetic = localStorage.getItem(FILTER_SYNTHETIC_KEY);
        if (storedSynthetic) {
          const synthSel = document.getElementById('filterSynthetic');
          if ([...synthSel.options].some(o => o.value === storedSynthetic)) {
            synthSel.value = storedSynthetic;
          }
        }

        renderStats({ net24h, net7d, net30d });
        renderFlowChart(events, 30);
        applyFilters();
        checkForFireEvents(events);

      } catch (err) {
        console.error('Error:', err);
        status.style.display = 'none';
        const errDiv = document.getElementById('errorContent');
        errDiv.style.display = 'block';
        errDiv.innerHTML = `<div class="error-msg">Failed to load activity data: ${err.message}<br><small>The collector may not have run yet</small></div>`;
      }
    }

    function formatUsdCompact(n) {
      const abs = Math.abs(n);
      const sign = n >= 0 ? '+' : '-';
      if (abs >= 1e6) return sign + '$' + (abs / 1e6).toFixed(2) + 'M';
      if (abs >= 1e3) return sign + '$' + (abs / 1e3).toFixed(1) + 'K';
      return sign + '$' + abs.toFixed(2);
    }

    // Net inflow per window. The "Net inflow" heading and its explanation sit
    // once above the three values (see #overview).
    function renderStats(s) {
      const row = document.getElementById('statsRow');

      function flowCard(label, val) {
        const color = val >= 0 ? 'var(--green)' : 'var(--red)';
        return `<div class="stat-card">
          <div class="label">${label}</div>
          <div class="value num-bold" style="color:${color}">${formatUsdCompact(val)}</div>
        </div>`;
      }

      row.innerHTML = flowCard('24h', s.net24h)
        + flowCard('7d', s.net7d)
        + flowCard('30d', s.net30d);
      document.getElementById('overview').style.display = '';
    }

    function renderFlowChart(events, days = 30) {
      const chart = document.getElementById('flowChart');
      const bars = document.getElementById('flowChartBars');
      // Drop synthetic flow so flashloan-loop bars don't dwarf real activity.
      events = events.filter(e => !e.synthetic);
      if (!events.length) return;

      const now = Date.now();
      const today = Math.floor(now / 86400000);
      const buckets = new Array(days).fill(0);

      events.forEach(e => {
        if (!e.timestamp) return;
        const usd = eventUsd(e);   // shared most-recent-by-time fallback
        if (usd == null) return;
        const day = Math.floor(e.timestamp / 86400);
        const idx = days - 1 - (today - day);
        if (idx < 0 || idx >= days) return;
        buckets[idx] += e.type === 'deposit' ? usd : -usd;
      });

      // Find max absolute value for scaling
      const maxAbs = Math.max(...buckets.map(Math.abs), 1);

      // Format helpers
      const fmtDay = daysAgo => {
        const d = new Date(now - daysAgo * 86400000);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
      };
      const fmtUsd = v => {
        const abs = Math.abs(v);
        const sign = v >= 0 ? '+' : '-';
        if (abs >= 1e6) return sign + '$' + (abs / 1e6).toFixed(2) + 'M';
        if (abs >= 1e3) return sign + '$' + (abs / 1e3).toFixed(1) + 'K';
        if (abs === 0) return '$0';
        return sign + '$' + abs.toFixed(0);
      };

      let html = '';
      for (let i = 0; i < days; i++) {
        const val = buckets[i];
        const daysAgo = days - 1 - i;
        const heightPct = Math.abs(val) / maxAbs * 50; // max 50% (half the chart)
        const cls = val >= 0 ? 'positive' : 'negative';
        const label = daysAgo === 0 ? 'today' : fmtDay(daysAgo);
        html += `<div class="flow-bar-slot">
          <div class="flow-bar ${cls}" style="height:${heightPct}%"></div>
          <div class="flow-bar-tooltip">${label}<br><strong>${fmtUsd(val)}</strong></div>
        </div>`;
      }
      bars.innerHTML = html;

      document.getElementById('flowChartStart').textContent = fmtDay(days - 1);
      document.getElementById('flowChartEnd').textContent = 'today';
      document.getElementById('flowRangeLabel').textContent = days + 'd';
      chart.style.display = 'block';
    }

    function renderTable(events, updatedAt) {
      const content = document.getElementById('activityContent');
      if (!events.length) {
        const chainSel = document.getElementById('filterChain').value;
        const chainEvents = chainSel ? allEvents.filter(e => (e.chain || 'ethereum') === chainSel) : allEvents;
        const count = chainSel ? trackedVaults.filter(v => (v.chain || 'ethereum') === chainSel).length : 0;
        let msg;
        if (chainSel && chainEvents.length === 0) {
          msg = `No events tracked yet for <strong>${chainSel}</strong> — ${count} vault${count !== 1 ? 's' : ''} monitored, awaiting first activity`;
        } else if (allEvents.length > 0) {
          msg = chainSel
            ? `No events on <strong>${chainSel}</strong> match the current filters (${chainEvents.length} event${chainEvents.length !== 1 ? 's' : ''} exist — try lowering Min amount)`
            : 'No events match the current filters';
        } else {
          msg = 'No events yet — collector may not have run';
        }
        content.innerHTML = `<div class="loading-msg">${msg}</div>`;
        return;
      }

      let rows = '';
      let mobileRows = '';
      events.forEach(e => {
        const scan = explorerFor(e.chain);
        const time = e.timestamp ? timeAgo(e.timestamp) : `#${e.block}`;
        const badgeClass = e.type === 'deposit' ? 'badge-deposit' : 'badge-withdraw';
        const badgeText = e.type === 'deposit' ? 'DEPOSIT' : 'WITHDRAW';
        const sym = e.symbol || '?';
        const name = e.vaultName || shortAddr(e.vault);
        // Show exact USD when priced; otherwise an estimate (~) from the
        // latest same-symbol price, so rows whose price feed is lagging still
        // appear with a value (and match the net-flow cards/chart).
        const estUsd = e.usdValue != null ? e.usdValue : eventUsd(e);
        const fmtUsdAmt = v => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const estPrefix = e.usdValue == null ? '~' : '';
        const estTitle = e.usdValue == null ? ` title="estimated from latest ${sym} price — exact USD pending"` : '';
        const usd = estUsd != null ? `<span class="usd-value"${estTitle}>${estPrefix}${fmtUsdAmt(estUsd)}</span>` : '';
        const usdMobile = estUsd != null ? `${estPrefix}${fmtUsdAmt(estUsd)}` : '';
        const synthBadge = e.synthetic ? `<span class="synth-badge" title="Auto-detected as synthetic flow (${e.syntheticReason}) — not a genuine user deposit/withdraw">${e.syntheticReason}</span>` : '';
        const nameAttr = String(name).replace(/"/g, '&quot;');
        const amount = `${formatAmount(e.assets)} <span class="sym">${sym}</span>`;
        const debank = `<a href="https://debank.com/profile/${e.owner}" target="_blank" rel="noopener" title="View on DeBank" class="debank">B</a>`;
        rows += `<tr${e.synthetic ? ' class="row-synthetic"' : ''}>
          <td>${time}</td>
          <td><a href="${scan}/tx/${e.tx}" target="_blank" rel="noopener" class="${badgeClass}">${badgeText}</a>${synthBadge}</td>
          <td class="num-bold col-num">${amount}</td>
          <td class="col-num usd-cell">${usd || '—'}</td>
          <td class="vault-name"><a href="/address/?a=${e.vault}" class="product-link" title="${nameAttr}">${name}</a></td>
          <td><a href="${scan}/address/${e.owner}" target="_blank" rel="noopener" class="addr-link">${shortAddr(e.owner)}</a></td>
          <td>${debank}</td>
        </tr>`;
        mobileRows += `<div class="mobile-event${e.synthetic ? ' row-synthetic' : ''}">
          <div class="mobile-event-top">
            <span class="mobile-event-badges"><a href="${scan}/tx/${e.tx}" target="_blank" rel="noopener" class="${badgeClass}">${badgeText}</a> ${synthBadge}</span>
            <span class="mobile-event-when">${time}</span>
          </div>
          <div class="mobile-event-top">
            <span class="mobile-event-amount">${amount}</span>
            <span class="mobile-event-usd">${usdMobile}</span>
          </div>
          <div class="mobile-event-meta">
            <a href="/address/?a=${e.vault}" class="mobile-event-product product-link" title="${nameAttr}">${name}</a>
            <span class="mobile-event-who"><a href="${scan}/address/${e.owner}" target="_blank" rel="noopener" class="addr-link mobile-event-user">${shortAddr(e.owner)}</a>${debank}</span>
          </div>
        </div>`;
      });

      content.innerHTML = `
        <table>
          <thead><tr>
            <th>When</th>
            <th>Type</th>
            <th class="col-num">Amount</th>
            <th class="col-num">USD</th>
            <th>Product</th>
            <th>User</th>
            <th>Profile</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="mobile-events">${mobileRows}</div>
      `;

      // Show last updated in the header. This runs on every filter change and
      // every reload, so it keeps a single timer rather than adding one each time.
      if (updatedAt) {
        const el = document.getElementById('lastUpdated');
        const updatedMs = new Date(updatedAt).getTime();
        function refreshUpdatedLabel() {
          const agoMin = Math.floor((Date.now() - updatedMs) / 60000);
          const agoText = agoMin < 1 ? 'just now' : agoMin + ' min ago';
          const nextMin = Math.max(0, 20 - agoMin);
          const nextText = nextMin <= 0 ? 'any moment now' : `in ~${nextMin} min`;
          el.innerHTML = `updated <span class="ago">${agoText}</span>`
            + `<span class="next">next update ${nextText}</span>`;
        }
        refreshUpdatedLabel();
        clearInterval(updatedLabelTimer);
        updatedLabelTimer = setInterval(refreshUpdatedLabel, 60000);
      }
    }

    // --- Fire favicon: alert for significant new activity ---
    const FIRE_THRESHOLD_USD = 10000;
    const LAST_SEEN_KEY = 'fusionstats_last_seen';
    let fireActive = false;

    function setFavicon(emoji) {
      let link = document.querySelector("link[rel~='icon']");
      if (!link) {
        link = document.createElement('link');
        link.rel = 'icon';
        document.head.appendChild(link);
      }
      const canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.font = '56px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(emoji, 32, 36);
      link.href = canvas.toDataURL();
    }

    function clearFire() {
      if (!fireActive) return;
      fireActive = false;
      document.title = 'Activity \u2014 Fusion Stats';
      setFavicon('\u26d4'); // default: no-entry circle (neutral)
      // restore original favicon
      const link = document.querySelector("link[rel~='icon']");
      if (link) link.href = 'https://i.imgur.com/BAm4czb.png';
    }

    function checkForFireEvents(events) {
      const lastSeen = parseInt(localStorage.getItem(LAST_SEEN_KEY) || '0', 10);
      const now = Math.floor(Date.now() / 1000);

      // Find significant events since last visit. Synthetic flow excluded so a
      // flashloan-loop bot can't ring the favicon-fire alarm every block.
      const newBig = events.filter(e =>
        !e.synthetic &&
        (e.timestamp || 0) > lastSeen &&
        e.usdValue != null &&
        Math.abs(e.usdValue) >= FIRE_THRESHOLD_USD
      );

      if (newBig.length > 0 && !document.hasFocus()) {
        fireActive = true;
        const totalUsd = newBig.reduce((s, e) => s + Math.abs(e.usdValue), 0);
        const label = totalUsd >= 1e6
          ? '$' + (totalUsd / 1e6).toFixed(1) + 'M'
          : '$' + (totalUsd / 1e3).toFixed(0) + 'K';
        document.title = `\uD83D\uDD25 ${label} new \u2014 Fusion Stats`;
        setFavicon('\uD83D\uDD25');
      }
    }

    // Mark as seen on click
    document.addEventListener('click', () => {
      localStorage.setItem(LAST_SEEN_KEY, String(Math.floor(Date.now() / 1000)));
      clearFire();
    }, { once: false });

    // Also clear when tab gains focus + user clicks
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && fireActive) {
        // Don't clear immediately — wait for a click to confirm they saw it
      }
    });

    // On first load, set last_seen if never set
    if (!localStorage.getItem(LAST_SEEN_KEY)) {
      localStorage.setItem(LAST_SEEN_KEY, String(Math.floor(Date.now() / 1000)));
    }

    // One floating bubble serves every ⓘ. Positioned against the window, so a
    // card edge or the screen edge never cuts an explanation off.
    (function infoTips() {
      const bubble = document.createElement('div');
      bubble.className = 'tip-bubble';
      bubble.setAttribute('role', 'tooltip');
      document.body.appendChild(bubble);
      let current = null;
      function show(el) {
        current = el;
        bubble.textContent = el.getAttribute('data-tip');
        bubble.style.left = '0px';
        bubble.style.top = '0px';
        const r = el.getBoundingClientRect();
        const b = bubble.getBoundingClientRect();
        const vw = document.documentElement.clientWidth;
        const left = Math.min(Math.max(8, r.left + r.width / 2 - b.width / 2), vw - b.width - 8);
        const top = r.top - b.height - 8 >= 8 ? r.top - b.height - 8 : r.bottom + 8;
        bubble.style.left = left + 'px';
        bubble.style.top = top + 'px';
        bubble.classList.add('show');
      }
      function hide() {
        current = null;
        bubble.classList.remove('show');
      }
      const tipOf = (t) => (t && t.closest ? t.closest('.info-tip[data-tip]') : null);
      // Hover is for a mouse only: a lifted finger counts as leaving, which
      // would close the bubble the moment a tap opened it.
      document.addEventListener('pointerover', (e) => {
        if (e.pointerType !== 'mouse') return;
        const el = tipOf(e.target);
        if (el) { if (el !== current) show(el); } else if (current) hide();
      });
      document.addEventListener('focusin', (e) => { const el = tipOf(e.target); if (el) show(el); });
      document.addEventListener('focusout', (e) => { if (tipOf(e.target)) hide(); });
      // Tap on touch screens. Inside a filter label a tap would also open the
      // select; the tip is what was asked for.
      document.addEventListener('click', (e) => {
        const el = tipOf(e.target);
        if (el) { e.preventDefault(); show(el); } else if (current) hide();
      });
      window.addEventListener('scroll', () => { if (current) hide(); }, { passive: true });
    })();

    // A click anywhere on a filter pill opens its list, not only on the value.
    document.querySelectorAll('.filter-group').forEach((group) => {
      const select = group.querySelector('select');
      group.addEventListener('click', (e) => {
        if (e.target === select || e.target.closest('.info-tip')) return;
        e.preventDefault();
        select.focus();
        try { select.showPicker(); } catch {}
      });
    });

    // Filter change handlers
    document.getElementById('filterAmount').addEventListener('change', applyFilters);
    document.getElementById('filterType').addEventListener('change', applyFilters);
    document.getElementById('filterChain').addEventListener('change', applyFilters);
    document.getElementById('filterProduct').addEventListener('change', applyFilters);
    document.getElementById('filterSynthetic').addEventListener('change', applyFilters);
    document.getElementById('filterStocks').addEventListener('change', applyFilters);

    loadActivity();

    // Re-fetch every 5 minutes to detect new events while tab is open
    setInterval(loadActivity, 5 * 60 * 1000);
  </script>
</body>
</html>
