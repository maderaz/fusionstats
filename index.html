    // One floating bubble serves every ⓘ, and the Refresh button. Positioned
    // against the window, so a card edge or the screen edge never cuts an
    // explanation off.
    const tips = (function infoTips() {
      const bubble = document.createElement('div');
      bubble.className = 'tip-bubble';
      bubble.setAttribute('role', 'tooltip');
      document.body.appendChild(bubble);
      let current = null;
      function show(el) {
        current = el;
        bubble.textContent = el.getAttribute('data-tip');
        bubble.style.left = '0px';
        bubble.style.top = '0px';
        const r = el.getBoundingClientRect();
        const b = bubble.getBoundingClientRect();
        const vw = document.documentElement.clientWidth;
        const left = Math.min(Math.max(8, r.left + r.width / 2 - b.width / 2), vw - b.width - 8);
        const top = r.top - b.height - 8 >= 8 ? r.top - b.height - 8 : r.bottom + 8;
        bubble.style.left = left + 'px';
        bubble.style.top = top + 'px';
        bubble.classList.add('show');
      }
      function hide() {
        current = null;
        bubble.classList.remove('show');
      }
      const tipOf = (t) => (t && t.closest ? t.closest('.info-tip[data-tip], .refresh[data-tip]') : null);
      // Hover is for a mouse only: a lifted finger counts as leaving, which
      // would close the bubble the moment a tap opened it.
      document.addEventListener('pointerover', (e) => {
        if (e.pointerType !== 'mouse') return;
        const el = tipOf(e.target);
        if (el) { if (el !== current) show(el); } else if (current) hide();
      });
      // A button tapped or clicked takes focus too; its tip is for the keyboard.
      document.addEventListener('focusin', (e) => {
        const el = tipOf(e.target);
        if (el && (el.classList.contains('info-tip') || el.matches(':focus-visible'))) show(el);
      });
      document.addEventListener('focusout', (e) => { if (tipOf(e.target)) hide(); });
      // Tap on touch screens. Inside a filter label a tap would also open the
      // select; the tip is what was asked for. A button's tap is the button's.
      document.addEventListener('click', (e) => {
        const el = tipOf(e.target);
        if (el && el.classList.contains('info-tip')) { e.preventDefault(); show(el); }
        else if (current && el !== current) hide();
      });
      window.addEventListener('scroll', () => { if (current) hide(); }, { passive: true });
      // A tip whose text changed while it is open: show the new text.
      return { update(el) { if (current === el) show(el); } };
    })();

    // Type is a segmented control. The hidden select stays the one source of

    const MORE_DEFAULTS = { filterStocks: '', filterSynthetic: 'hide' };
    function paintMore() {

      if (!btn || !panel) return;

    (function moreFilters() {
      const btn = document.getElementById('moreBtn');
      const cell = btn.closest('.filter-more');
      const pop = document.getElementById('morePanel');
      const scrim = document.createElement('div');
      scrim.className = 'more-scrim';
      document.body.append(scrim, pop);
      const sheetMq = window.matchMedia('(max-width: 560px)');
      let isOpen = false, locked = false;

      // Under the button, right edges aligned, or above it when there is more
      // room there; follows the page as it scrolls, and closes once the
      // button has left the screen.
      function place() {
        if (!isOpen) return;
        if (pop.classList.contains('sheet')) { pop.style.left = pop.style.top = pop.style.bottom = ''; return; }
        const r = cell.getBoundingClientRect();
        const vw = document.documentElement.clientWidth, vh = window.innerHeight;
        if (r.bottom < 0 || r.top > vh) { close(false); return; }
        const w = pop.offsetWidth, h = pop.offsetHeight;
        const down = vh - r.bottom - 12 >= h || vh - r.bottom >= r.top;
        pop.style.left = Math.round(Math.max(8, Math.min(r.right - w, vw - w - 8))) + 'px';
        pop.style.top = down ? Math.round(r.bottom + 6) + 'px' : 'auto';
        pop.style.bottom = down ? 'auto' : Math.round(vh - r.top + 6) + 'px';
        pop.classList.toggle('up', !down);
      }
      let queued = false;
      const schedule = () => {
        if (!isOpen || queued) return;
        queued = true;
        requestAnimationFrame(() => { queued = false; place(); });
      };

      function open() {
        if (window.FusionSelect) FusionSelect.close();
        isOpen = true;
        const sheet = sheetMq.matches;
        pop.classList.toggle('sheet', sheet);
        paintMore();
        place();
        pop.classList.add('open');
        scrim.classList.toggle('open', sheet);
        if (sheet) { locked = true; document.documentElement.style.overflow = 'hidden'; }
        btn.setAttribute('aria-expanded', 'true');
        const first = pop.querySelector('.more-seg button.on') || pop.querySelector('.more-seg button');
        if (first) first.focus({ preventScroll: true });
      }

        if (!isOpen) return;
        isOpen = false;
        pop.classList.remove('open');
        scrim.classList.remove('open');

        btn.setAttribute('aria-expanded', 'false');
        if (refocus || pop.contains(document.activeElement)) btn.focus({ preventScroll: true });
      }

      btn.addEventListener('click', () => (isOpen ? close(true) : open()));
      pop.addEventListener('click', (e) => {
        const b = e.target.closest('.more-seg button[data-v]');
        if (b) {
          const sel = document.getElementById(b.closest('.more-seg').dataset.for);
          if (sel.value !== b.dataset.v) { sel.value = b.dataset.v; sel.dispatchEvent(new Event('change')); }
          paintMore();
          return;
        }
        if (e.target.closest('.more-reset')) {
          let changed = null;
          for (const [id, v] of Object.entries(MORE_DEFAULTS)) {
            const s = document.getElementById(id);
            if (s.value !== v) { s.value = v; changed = s; }
          }
          if (changed) changed.dispatchEvent(new Event('change'));
          paintMore();
          const first = pop.querySelector('.more-seg button.on');
          if (first) first.focus({ preventScroll: true });
          return;
        }
        if (e.target.closest('.more-close')) close(true);
      });
      // A click elsewhere closes the panel (the phone's sheet closes on its
      // scrim), as does Escape, or the keyboard leaving it.
      document.addEventListener('pointerdown', (e) => {
        if (!isOpen || pop.classList.contains('sheet')) return;
        if (pop.contains(e.target) || cell.contains(e.target)) return;
        if (e.target.closest && e.target.closest('.tip-bubble')) return;
        close(false);
      }, true);
      scrim.addEventListener('click', () => close(false));
      document.addEventListener('keydown', (e) => {
        if (isOpen && e.key === 'Escape') { e.preventDefault(); close(true); }
      });
      pop.addEventListener('focusout', (e) => {
        const to = e.relatedTarget;
        if (isOpen && to && !pop.contains(to) && !cell.contains(to)) close(false);
      });
      document.addEventListener('scroll', schedule, { capture: true, passive: true });
      window.addEventListener('resize', schedule);
      if (sheetMq.addEventListener) sheetMq.addEventListener('change', () => close(false));

      // The phone's sheet follows a finger down from its header, and goes if
      // let go far or fast enough.
      const head = pop.querySelector('.more-head');
      let y0 = null, dy = 0, t0 = 0;
      head.addEventListener('touchstart', (e) => {
        if (!isOpen || !pop.classList.contains('sheet') || e.touches.length !== 1) return;
        y0 = e.touches[0].clientY; dy = 0; t0 = Date.now();
      }, { passive: true });
      head.addEventListener('touchmove', (e) => {
        if (y0 == null) return;
        dy = Math.max(0, e.touches[0].clientY - y0);
        pop.classList.add('dragging');
        pop.style.transform = `translateY(${dy}px)`;
        if (e.cancelable) e.preventDefault();
      }, { passive: false });
      const end = () => {
        if (y0 == null) return;
        y0 = null;
        pop.classList.remove('dragging');
        if (dy > 70 || (dy > 24 && dy / Math.max(1, Date.now() - t0) > 0.5)) close(false);
        else pop.style.transform = '';
      };
      head.addEventListener('touchend', end);
      head.addEventListener('touchcancel', end);

      paintMore();
    })();

    // The filter bar sticks while the list scrolls; the column headings stick
    // right under it, at its measured height.
    (function stickyOffset() {
      const feed = document.querySelector('.feed');
      const tools = document.querySelector('.feed-tools');
      const set = () => feed.style.setProperty('--tools-h', tools.offsetHeight + 'px');
      set();
      if (window.ResizeObserver) new ResizeObserver(set).observe(tools);
    })();

    // Filter change handlers
    document.getElementById('filterAmount').addEventListener('change', () => applyFilters());
    document.getElementById('filterType').addEventListener('change', () => applyFilters());
    document.getElementById('filterChain').addEventListener('change', () => applyFilters());
    document.getElementById('filterProduct').addEventListener('change', () => applyFilters());
    document.getElementById('filterSynthetic').addEventListener('change', () => applyFilters());
    document.getElementById('filterStocks').addEventListener('change', () => applyFilters());

    // Pager and retry, delegated: the list is re-rendered on every change.
    document.getElementById('activityContent').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-page]');
      if (b && !b.disabled) { goToPage(Number(b.dataset.page)); return; }
      if (e.target.closest('.pg-retry')) { olderLoadFailed = false; applyFilters({ resetPage: false }); }
    });

    // --- Refresh now ---
    // GitHub starts the scheduled collector only every few hours, however often
    // collect.yml asks. /api/refresh starts a run on request (api/refresh.js):
    // the Refresh button asks it, and so does the page by itself when the data
    // it shows is over an hour old. The endpoint starts at most one run per
    // cooldown, whoever asks. Hidden until the endpoint answers that it is set
    // up, so a static host never shows it.
    const refreshNow = (function () {
      const AUTO_AFTER_MIN = 60;           // data older than this starts a run on its own
      const AUTO_EVERY_MIN = 30;           // ...at most this often from one open tab
      const POLL_MS = 20 * 1000;
      const RUN_TIMEOUT_MS = 15 * 60000;   // a run takes ~2 min; queued behind a backfill, hours
      const DATA_TIMEOUT_MS = 5 * 60000;   // the CDN serves a commit within ~2 min of it
      const btn = document.getElementById('refreshBtn');
      const text = btn.querySelector('.refresh-text');
      const TIPS = {
        idle: 'Collect the newest events now. Takes about 3 minutes.',
        busy: 'Collecting new events. The list updates by itself when they land.',
      };
      let enabled = false;
      let busy = false;
      let lastAutoAt = 0;

      function setState(state, label, tip) {
        btn.dataset.state = state;
        text.textContent = label;
        btn.setAttribute('data-tip', tip || TIPS[state] || label);
        btn.setAttribute('aria-busy', String(state === 'busy'));
        tips.update(btn);
      }
      const idle = () => setState('idle', 'Refresh');
      // A result shown for a few seconds, then back to Refresh.
      function settle(state, label, tip) {
        setState(state, label, tip);
        setTimeout(() => { if (!busy && btn.dataset.state === state) idle(); }, 5000);
      }

      async function api(method) {
        const res = await fetch('/api/refresh', { method, cache: 'no-store' });
        if (!(res.headers.get('content-type') || '').includes('application/json')) throw new Error('no endpoint');
        return res.json();
      }
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const ageMin = () => (lastUpdatedAt ? (Date.now() - Date.parse(lastUpdatedAt)) / 60000 : Infinity);

      // Wait for the run to finish, then for its data to reach the page.
      async function watch(sinceMs) {
        busy = true;
        setState('busy', 'Updating…');
        const before = lastUpdatedAt;
        const t0 = Date.now();
        let doneAt = 0;
        while (Date.now() - t0 < RUN_TIMEOUT_MS && lastUpdatedAt === before) {
          await sleep(POLL_MS);
          if (lastUpdatedAt !== before) break;      // the 5-minute reload got there first
          let running = false;
          try { running = !!(await api('GET')).running; } catch {}
          // A run started moments ago may not be listed yet.
          if (running || Date.now() - sinceMs < 45000) { doneAt = 0; continue; }
          doneAt = doneAt || Date.now();
          await loadActivity({ poll: true });
          if (Date.now() - doneAt > DATA_TIMEOUT_MS) break;   // the run left no new data
        }
        busy = false;
        if (lastUpdatedAt !== before) settle('done', 'Up to date');
        else idle();
      }

      async function start({ auto = false } = {}) {
        if (busy) return;
        busy = true;
        setState('busy', 'Updating…');
        let r = null;
        try { r = await api('POST'); } catch {}
        const state = r && r.state;
        if (state === 'started') return watch(Date.now());
        if (state === 'running') return watch(Date.parse(r.since) || Date.now());
        if (state === 'recent') {
          // A run started within the cooldown: wait for its data unless it is here.
          const ranAt = Date.parse(r.lastRunAt);
          if (!(lastUpdatedAt && Date.parse(lastUpdatedAt) >= ranAt)) return watch(ranAt || Date.now());
          busy = false;
          return settle('done', 'Up to date', `Just collected. Next refresh in ${r.retryInMin} min.`);
        }
        busy = false;
        if (auto) return idle();
        settle('fail', 'Try again later', `Couldn't start an update right now${r && r.error ? ` (${r.error})` : ''}.`);
      }

      // Old data starts a run on its own, but only in a tab someone is looking at.
      function maybeAuto() {
        if (!enabled || busy || document.visibilityState !== 'visible') return;
        if (ageMin() < AUTO_AFTER_MIN || Date.now() - lastAutoAt < AUTO_EVERY_MIN * 60000) return;
        lastAutoAt = Date.now();
        start({ auto: true });
      }

      async function init() {
        let status = null;
        try { status = await api('GET'); } catch {}
        if (!status || status.configured !== true) return;
        enabled = true;
        btn.hidden = false;
        btn.closest('.mast-meta').classList.add('can-refresh');
        idle();
        btn.addEventListener('click', () => start());
        document.addEventListener('visibilitychange', maybeAuto);
        if (status.running) watch(Date.parse(status.runningSince) || Date.now());
        else maybeAuto();
      }

      return { init, maybeAuto };
    })();

    // A return visit draws at once from what was kept last time, then checks
    // that against the fresh files; a first visit waits for those.
    (async function firstLoad() {
      const kept = await keptActivity();
      if (kept && await loadActivity({ kept })) await loadActivity({ revalidate: true });
      else await loadActivity();
    })().then(() => {
      // Prerendered ahead of a click (nav.js): nothing starts a refresh until
      // the page is actually on screen.
      if (document.prerendering) document.addEventListener('prerenderingchange', () => refreshNow.init(), { once: true });
      else refreshNow.init();
    });

    // Re-fetch every 5 minutes to detect new events while tab is open — the
    // full history only if this visit already needed it.
    setInterval(() => loadActivity().then(refreshNow.maybeAuto), 5 * 60 * 1000);
  </script>
</body>
</html>
