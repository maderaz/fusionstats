<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity — Fusion Stats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #F5F5FA;
      --bg-alt: #E9E9F3;
      --surface: #FFFFFF;
      --stroke: #E5E5E5;
      --text: #000000;
      --text-body: #70747A;
      --text-secondary: #9BA3AF;
      --accent: #8429FF;
      --accent-end: #6C00FF;
      --accent-light: #A37FFF;
      --accent-bg: rgba(132, 41, 255, 0.10);
      --green: #16a34a;
      --green-bg: rgba(22, 163, 74, 0.08);
      --red: #dc2626;
      --red-bg: rgba(220, 38, 38, 0.08);
    }

    [data-theme="dark"] {
      --bg: #0F0F14;
      --bg-alt: #1A1A24;
      --surface: #16161E;
      --stroke: #2A2A3A;
      --text: #E8E8F0;
      --text-body: #9A9AB0;
      --text-secondary: #6A6A80;
      --accent: #A37FFF;
      --accent-end: #8429FF;
      --accent-light: #B89AFF;
      --accent-bg: rgba(132, 41, 255, 0.15);
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.12);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.12);
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
      font-weight: 400;
      transition: background 0.3s, color 0.3s;
    }

    .num-bold {
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .container { max-width: 960px; margin: 0 auto; }

    .top-nav {
      display: flex;
      gap: 0.25rem;
      margin-bottom: 1.5rem;
    }

    .top-nav a {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-body);
      text-decoration: none;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: all 0.15s;
    }

    .top-nav a:hover {
      color: var(--accent);
      border-color: var(--stroke);
    }

    .top-nav a.active {
      color: var(--accent);
      background: var(--accent-bg);
      border-color: var(--accent);
    }

    .theme-toggle {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--stroke);
      background: var(--surface);
      color: var(--text-body);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      z-index: 100;
    }

    header { margin-bottom: 2rem; }
    header h1 {
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, var(--accent), var(--accent-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p { color: var(--text-body); font-size: 0.875rem; }

    /* Stats row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .stat-card .label {
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .stat-card .value {
      font-size: 1.5rem;
      letter-spacing: -0.02em;
    }

    .stat-card .sub {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    /* Activity table */
    .activity-card {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .activity-card h2 {
      font-size: 1rem;
      font-weight: 500;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--stroke);
    }

    table { width: 100%; border-collapse: collapse; }

    th {
      text-align: left;
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--stroke);
      font-weight: 500;
    }

    td {
      padding: 0.65rem 1rem;
      font-size: 0.8rem;
      border-bottom: 1px solid var(--stroke);
      color: var(--text-body);
    }

    tr:last-child td { border-bottom: none; }

    .badge-deposit, .badge-withdraw {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
    }

    .badge-deposit {
      color: var(--green);
      background: var(--green-bg);
    }
    .badge-deposit:hover { background: rgba(22, 163, 74, 0.18); }

    .badge-withdraw {
      color: var(--red);
      background: var(--red-bg);
    }
    .badge-withdraw:hover { background: rgba(220, 38, 38, 0.18); }

    .usd-value {
      font-size: 0.7rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .vault-name {
      font-size: 0.8rem;
      color: var(--text-secondary);
      max-width: 160px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .addr-link {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--accent);
      text-decoration: none;
    }
    .addr-link:hover { text-decoration: underline; }

    .tx-link {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-decoration: none;
    }
    .tx-link:hover { color: var(--accent); }

    .loading-msg {
      text-align: center;
      padding: 3rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    .error-msg {
      text-align: center;
      padding: 2rem;
      color: var(--red);
      font-size: 0.85rem;
    }

    .data-ts {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    @media (max-width: 640px) {
      body { padding: 1rem; }
      .stats-row { grid-template-columns: 1fr 1fr; }
      td, th { padding: 0.5rem 0.6rem; font-size: 0.75rem; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">&#9790;</button>
  <div class="container">
    <nav class="top-nav">
      <a href="/" class="active">Activity</a>
      <a href="/dominance">Dominance</a>
      <a href="/spark">Spark</a>
      <a href="/logs">Logs</a>
      <a href="/socials">Socials</a>
    </nav>

    <header>
      <h1>Vault Activity</h1>
      <p style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap">
        Deposit & withdrawal events across all Fusion vaults
        <span id="vaultCount" style="display:none;font-size:0.7rem;background:var(--surface);border:1px solid var(--stroke);border-radius:6px;padding:0.15rem 0.5rem;color:var(--text-secondary);white-space:nowrap"></span>
      </p>
    </header>

    <div id="statsRow" class="stats-row" style="display:none"></div>

    <div class="activity-card">
      <h2>Recent Deposits & Withdrawals <span id="lastUpdated" style="float:right;font-size:0.7rem;font-weight:400;color:var(--text-secondary);line-height:1.4;text-align:right;"></span></h2>
      <div id="activityContent">
        <div class="loading-msg" id="loadingMsg">Fetching on-chain events...</div>
      </div>
    </div>

    <div id="errorContent" style="display:none"></div>
  </div>

  <script>
    // Theme
    const themeToggle = document.getElementById('themeToggle');
    const saved = localStorage.getItem('fusionstats_theme');
    if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');
      localStorage.setItem('fusionstats_theme', isDark ? '' : 'dark');
    });

    function formatAmount(n) {
      if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return n.toFixed(2);
      if (n >= 1) return n.toFixed(4);
      return n.toFixed(6);
    }

    function shortAddr(a) {
      return a.slice(0, 6) + '...' + a.slice(-4);
    }

    function timeAgo(ts) {
      const diff = Math.floor((Date.now() / 1000) - ts);
      if (diff < 60) return diff + 's ago';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      return Math.floor(diff / 86400) + 'd ago';
    }

    async function loadActivity() {
      const status = document.getElementById('loadingMsg');

      try {
        status.textContent = 'Loading activity data...';
        const res = await fetch('activity-events.json');
        if (!res.ok) throw new Error(`HTTP ${res.status} — run collect-activity.js first`);
        const data = await res.json();

        const events = data.events || [];

        // Always use vault lookup as source of truth for symbol/name
        const vaultInfo = {};
        (data.vaults || []).forEach(v => { vaultInfo[v.address] = v; });
        events.forEach(e => {
          const v = vaultInfo[e.vault];
          if (v) { e.symbol = v.symbol; e.vaultName = v.name; }
        });

        // Net inflows (deposits - withdrawals) in USD
        function netFlowUsd(evts, seconds) {
          const cutoff = Math.floor(Date.now() / 1000) - seconds;
          const filtered = evts.filter(e => (e.timestamp || 0) > cutoff && e.usdValue != null);
          let net = 0;
          filtered.forEach(e => { net += e.type === 'deposit' ? e.usdValue : -e.usdValue; });
          return net;
        }

        const net24h = netFlowUsd(events, 86400);
        const net7d = netFlowUsd(events, 7 * 86400);
        const net30d = netFlowUsd(events, 30 * 86400);

        // Show vault count badge
        const vaultCountEl = document.getElementById('vaultCount');
        const vaultCount = (data.vaults || []).length;
        if (vaultCount > 0) {
          vaultCountEl.textContent = `Vaults Tracked: ${vaultCount}`;
          vaultCountEl.style.display = 'inline-block';
        }

        renderStats({ net24h, net7d, net30d });
        renderTable(events.slice(0, 500), data.updatedAt);
        checkForFireEvents(events);

      } catch (err) {
        console.error('Error:', err);
        status.style.display = 'none';
        const errDiv = document.getElementById('errorContent');
        errDiv.style.display = 'block';
        errDiv.innerHTML = `<div class="error-msg">Failed to load activity data: ${err.message}<br><small>The collector may not have run yet</small></div>`;
      }
    }

    function formatUsdCompact(n) {
      const abs = Math.abs(n);
      const sign = n >= 0 ? '+' : '-';
      if (abs >= 1e6) return sign + '$' + (abs / 1e6).toFixed(2) + 'M';
      if (abs >= 1e3) return sign + '$' + (abs / 1e3).toFixed(1) + 'K';
      return sign + '$' + abs.toFixed(2);
    }

    function renderStats(s) {
      const row = document.getElementById('statsRow');
      row.style.display = 'grid';

      function flowCard(label, val) {
        const color = val >= 0 ? 'var(--green)' : 'var(--red)';
        return `<div class="stat-card">
          <div class="label">${label}</div>
          <div class="value num-bold" style="color:${color}">${formatUsdCompact(val)}</div>
          <div class="sub">net inflow</div>
        </div>`;
      }

      row.innerHTML = flowCard('24h', s.net24h)
        + flowCard('7d', s.net7d)
        + flowCard('30d', s.net30d);
    }

    function renderTable(events, updatedAt) {
      const content = document.getElementById('activityContent');
      if (!events.length) {
        content.innerHTML = '<div class="loading-msg">No events yet — collector may not have run</div>';
        return;
      }

      let rows = '';
      events.forEach(e => {
        const time = e.timestamp ? timeAgo(e.timestamp) : `#${e.block}`;
        const badgeClass = e.type === 'deposit' ? 'badge-deposit' : 'badge-withdraw';
        const badgeText = e.type === 'deposit' ? 'DEPOSIT' : 'WITHDRAW';
        const sym = e.symbol || '?';
        const name = e.vaultName || shortAddr(e.vault);
        const usd = e.usdValue != null ? `<span class="usd-value">$${e.usdValue.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>` : '';
        rows += `<tr>
          <td>${time}</td>
          <td><a href="https://etherscan.io/tx/${e.tx}" target="_blank" rel="noopener" class="${badgeClass}">${badgeText}</a></td>
          <td class="num-bold">${formatAmount(e.assets)} ${sym}${usd ? '<br>' + usd : ''}</td>
          <td class="vault-name">${name}</td>
          <td><a href="https://etherscan.io/address/${e.owner}" target="_blank" rel="noopener" class="addr-link">${shortAddr(e.owner)}</a></td>
        </tr>`;
      });

      content.innerHTML = `
        <table>
          <thead><tr>
            <th>When</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Product</th>
            <th>User</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;

      // Show last updated in header
      if (updatedAt) {
        const el = document.getElementById('lastUpdated');
        const updatedMs = new Date(updatedAt).getTime();
        function refreshUpdatedLabel() {
          const agoMin = Math.floor((Date.now() - updatedMs) / 60000);
          const agoText = agoMin < 1 ? 'just now' : agoMin + ' min ago';
          const nextMin = Math.max(0, 20 - agoMin);
          const nextText = nextMin <= 0 ? 'any moment now' : `in ~${nextMin} min`;
          el.innerHTML = `updated <span style="color:var(--accent);font-weight:500;">${agoText}</span>`
            + `<br><span style="font-size:0.6rem;">next update ${nextText}</span>`;
        }
        refreshUpdatedLabel();
        setInterval(refreshUpdatedLabel, 60000);
      }
    }

    // --- Fire favicon: alert for significant new activity ---
    const FIRE_THRESHOLD_USD = 10000;
    const LAST_SEEN_KEY = 'fusionstats_last_seen';
    let fireActive = false;

    function setFavicon(emoji) {
      let link = document.querySelector("link[rel~='icon']");
      if (!link) {
        link = document.createElement('link');
        link.rel = 'icon';
        document.head.appendChild(link);
      }
      const canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.font = '56px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(emoji, 32, 36);
      link.href = canvas.toDataURL();
    }

    function clearFire() {
      if (!fireActive) return;
      fireActive = false;
      document.title = 'Activity \u2014 Fusion Stats';
      setFavicon('\u26d4'); // default: no-entry circle (neutral)
      // remove favicon entirely to revert to default
      const link = document.querySelector("link[rel~='icon']");
      if (link) link.remove();
    }

    function checkForFireEvents(events) {
      const lastSeen = parseInt(localStorage.getItem(LAST_SEEN_KEY) || '0', 10);
      const now = Math.floor(Date.now() / 1000);

      // Find significant events since last visit
      const newBig = events.filter(e =>
        (e.timestamp || 0) > lastSeen &&
        e.usdValue != null &&
        Math.abs(e.usdValue) >= FIRE_THRESHOLD_USD
      );

      if (newBig.length > 0 && !document.hasFocus()) {
        fireActive = true;
        const totalUsd = newBig.reduce((s, e) => s + Math.abs(e.usdValue), 0);
        const label = totalUsd >= 1e6
          ? '$' + (totalUsd / 1e6).toFixed(1) + 'M'
          : '$' + (totalUsd / 1e3).toFixed(0) + 'K';
        document.title = `\uD83D\uDD25 ${label} new \u2014 Fusion Stats`;
        setFavicon('\uD83D\uDD25');
      }
    }

    // Mark as seen on click
    document.addEventListener('click', () => {
      localStorage.setItem(LAST_SEEN_KEY, String(Math.floor(Date.now() / 1000)));
      clearFire();
    }, { once: false });

    // Also clear when tab gains focus + user clicks
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && fireActive) {
        // Don't clear immediately — wait for a click to confirm they saw it
      }
    });

    // On first load, set last_seen if never set
    if (!localStorage.getItem(LAST_SEEN_KEY)) {
      localStorage.setItem(LAST_SEEN_KEY, String(Math.floor(Date.now() / 1000)));
    }

    loadActivity();

    // Re-fetch every 5 minutes to detect new events while tab is open
    setInterval(loadActivity, 5 * 60 * 1000);
  </script>
</body>
</html>
