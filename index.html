<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fusion Stats — Morpho Mainnet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #F5F5FA;
      --bg-alt: #E9E9F3;
      --surface: #FFFFFF;
      --stroke: #E5E5E5;
      --text: #000000;
      --text-body: #70747A;
      --text-secondary: #9BA3AF;
      --accent: #8429FF;
      --accent-end: #6C00FF;
      --accent-light: #A37FFF;
      --accent-bg: rgba(132, 41, 255, 0.10);
      --green: #16a34a;
      --red: #dc2626;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
      font-weight: 400;
    }

    .num-bold {
      font-family: 'Source Sans 3', 'Source Sans Pro', sans-serif;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      position: relative;
      top: 1px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
      background: linear-gradient(90deg, var(--accent), var(--accent-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--text-body);
      font-size: 0.875rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .stat-card .label {
      font-size: 0.75rem;
      color: var(--text-body);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
      font-weight: 500;
    }

    .stat-card .value {
      font-size: 2rem;
      letter-spacing: -0.02em;
    }

    .stat-card .sub {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 0.35rem;
    }

    .error-msg {
      color: var(--red);
      font-size: 0.8rem;
    }

    @media (max-width: 640px) {
      body { padding: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Fusion Stats</h1>
      <p>Morpho Protocol — Ethereum Mainnet</p>
    </header>

    <div class="stat-card">
      <div class="label">Total Morpho Loans on Mainnet</div>
      <div class="value num-bold" id="totalLoans">—</div>
      <div class="sub" id="totalLoansSub">loading...</div>
    </div>
  </div>

  <script>
    const MORPHO_API = 'https://api.morpho.org/graphql';

    function formatUsd(value) {
      if (value >= 1e9) return `$${(value / 1e9).toFixed(2)}B`;
      if (value >= 1e6) return `$${(value / 1e6).toFixed(1)}M`;
      if (value >= 1e3) return `$${(value / 1e3).toFixed(1)}K`;
      return `$${value.toFixed(0)}`;
    }

    async function fetchTotalMainnetLoans() {
      const res = await fetch(MORPHO_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          query: `{
            markets(
              first: 1000
              orderBy: BorrowAssetsUsd
              orderDirection: Desc
              where: { chainId_in: [1], whitelisted: true }
            ) {
              items {
                uniqueKey
                loanAsset { symbol }
                state { borrowAssetsUsd }
              }
              pageInfo { count countTotal }
            }
          }`
        })
      });
      const json = await res.json();
      const { items, pageInfo } = json.data.markets;
      const total = items.reduce((sum, m) => sum + (m.state?.borrowAssetsUsd || 0), 0);
      console.log('Mainnet markets:', { fetched: items.length, countTotal: pageInfo.countTotal, totalUsd: total });
      return { total, fetched: items.length, countTotal: pageInfo.countTotal };
    }

    fetchTotalMainnetLoans().then(({ total, fetched, countTotal }) => {
      document.getElementById('totalLoans').textContent = formatUsd(total);
      document.getElementById('totalLoansSub').textContent =
        `${fetched}/${countTotal} markets · live`;
    }).catch(err => {
      console.error('Error:', err);
      document.getElementById('totalLoans').textContent = 'Error';
      document.getElementById('totalLoansSub').innerHTML = `<span class="error-msg">${err.message}</span>`;
    });
  </script>
</body>
</html>
