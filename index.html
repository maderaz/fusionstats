<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fusion Stats — Morpho Mainnet</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f8f9fb;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --text-dim: #6b7280;
      --accent: #6366f1;
      --accent-light: rgba(99, 102, 241, 0.08);
      --green: #16a34a;
      --red: #dc2626;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }

    header p {
      color: var(--text-dim);
      font-size: 0.875rem;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .stat-card .label {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
      font-weight: 500;
    }

    .stat-card .value {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .stat-card .sub {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 0.35rem;
    }

    .stat-card .change {
      font-size: 0.8rem;
      margin-top: 0.25rem;
      font-weight: 500;
    }

    .change.up { color: var(--green); }
    .change.down { color: var(--red); }

    .share-banner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .share-banner .share-label {
      font-size: 0.875rem;
      color: var(--text-dim);
    }

    .share-banner .share-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    .share-banner .share-bar-outer {
      flex: 1;
      margin: 0 1.5rem;
      height: 8px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
    }

    .share-banner .share-bar-inner {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .chart-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .chart-header h2 {
      font-size: 1rem;
      font-weight: 600;
    }

    .chart-container {
      position: relative;
      height: 300px;
    }

    .vault-table {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .vault-table h2 {
      font-size: 1rem;
      font-weight: 600;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      font-size: 0.7rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
    }

    td {
      padding: 0.875rem 1.5rem;
      font-size: 0.875rem;
      border-bottom: 1px solid var(--border);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: var(--accent-light);
    }

    .vault-name {
      font-weight: 500;
    }

    .vault-address {
      color: var(--text-dim);
      font-size: 0.75rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .bar-cell {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .bar-bg {
      flex: 1;
      height: 6px;
      background: var(--bg);
      border-radius: 3px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s;
    }

    .bar-value {
      font-weight: 600;
      min-width: 4rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .loading {
      color: var(--text-dim);
      font-size: 0.875rem;
      text-align: center;
      padding: 2rem;
    }

    .error-msg {
      color: var(--red);
      font-size: 0.8rem;
    }

    @media (max-width: 640px) {
      body { padding: 1rem; }
      .stats-row { grid-template-columns: 1fr; }
      .chart-container { height: 220px; }
      .share-banner { flex-direction: column; gap: 0.75rem; text-align: center; }
      .share-banner .share-bar-outer { margin: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Fusion Stats</h1>
      <p>Morpho Protocol — Ethereum Mainnet</p>
    </header>

    <div class="stats-row">
      <div class="stat-card">
        <div class="label">Total Morpho Loans on Mainnet</div>
        <div class="value" id="totalLoans">—</div>
        <div class="sub" id="totalLoansSub">loading...</div>
      </div>
      <div class="stat-card">
        <div class="label">Loan Demand Generated by Fusion</div>
        <div class="value" id="fusionLoans">—</div>
        <div class="sub" id="fusionLoansSub">loading...</div>
      </div>
    </div>

    <div class="share-banner">
      <span class="share-label">Fusion Share of Mainnet Demand</span>
      <div class="share-bar-outer">
        <div class="share-bar-inner" id="shareBar" style="width: 0%"></div>
      </div>
      <span class="share-value" id="shareValue">—</span>
    </div>

    <div class="vault-table">
      <h2>Fusion Vaults — Mainnet</h2>
      <table>
        <thead>
          <tr>
            <th>Vault</th>
            <th>Total Supply</th>
            <th style="width: 35%">Share of Fusion Demand</th>
          </tr>
        </thead>
        <tbody id="vaultTableBody">
          <tr><td colspan="3" class="loading">Loading vault data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const MORPHO_API = 'https://api.morpho.org/graphql';

    function formatUsd(value) {
      if (value >= 1e9) return `$${(value / 1e9).toFixed(2)}B`;
      if (value >= 1e6) return `$${(value / 1e6).toFixed(1)}M`;
      if (value >= 1e3) return `$${(value / 1e3).toFixed(1)}K`;
      return `$${value.toFixed(0)}`;
    }

    // Fetch all mainnet markets total borrow
    async function fetchTotalMainnetLoans() {
      const res = await fetch(MORPHO_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          query: `{
            markets(
              first: 1000
              orderBy: BorrowAssetsUsd
              orderDirection: Desc
              where: { chainId_in: [1] }
            ) {
              items {
                uniqueKey
                loanAsset { symbol }
                state { borrowAssetsUsd }
              }
              pageInfo { count countTotal }
            }
          }`
        })
      });
      const json = await res.json();
      const { items, pageInfo } = json.data.markets;
      const total = items.reduce((sum, m) => sum + (m.state?.borrowAssetsUsd || 0), 0);
      console.log('Mainnet markets:', { fetched: items.length, countTotal: pageInfo.countTotal, totalUsd: total });
      return { total, fetched: items.length, countTotal: pageInfo.countTotal };
    }

    // Fetch Fusion vaults on mainnet
    async function fetchFusionVaults() {
      // First, search for vaults with "Fusion" in name on mainnet
      const res = await fetch(MORPHO_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          query: `{
            vaults(
              first: 100
              where: { chainId_in: [1], search: "Fusion" }
            ) {
              items {
                address
                name
                symbol
                asset { symbol }
                state {
                  totalAssetsUsd
                  totalSupplyUsd
                  allocationUsd
                }
                allocators {
                  address
                }
              }
              pageInfo { count countTotal }
            }
          }`
        })
      });
      const json = await res.json();
      console.log('Fusion vaults raw:', json.data.vaults);
      return json.data.vaults.items || [];
    }

    // Also try searching by curator
    async function fetchVaultsByCurator() {
      // Try fetching vaults and inspecting metadata
      const res = await fetch(MORPHO_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          query: `{
            vaults(
              first: 200
              orderBy: TotalAssetsUsd
              orderDirection: Desc
              where: { chainId_in: [1] }
            ) {
              items {
                address
                name
                symbol
                asset { symbol }
                metadata { curators { name image } }
                state {
                  totalAssetsUsd
                  totalSupplyUsd
                }
              }
              pageInfo { count countTotal }
            }
          }`
        })
      });
      const json = await res.json();
      const allVaults = json.data.vaults.items || [];

      // Filter for Fusion-related vaults
      const fusionVaults = allVaults.filter(v => {
        const name = (v.name || '').toLowerCase();
        const curators = (v.metadata?.curators || []).map(c => (c.name || '').toLowerCase());
        return name.includes('fusion') || curators.some(c => c.includes('fusion'));
      });

      console.log('All mainnet vaults:', allVaults.length);
      console.log('Fusion vaults found:', fusionVaults);

      // Log all curator names for debugging
      const allCurators = new Set();
      allVaults.forEach(v => {
        (v.metadata?.curators || []).forEach(c => {
          if (c.name) allCurators.add(c.name);
        });
      });
      console.log('All curator names:', [...allCurators].sort());

      return { fusionVaults, allVaults };
    }

    async function init() {
      try {
        const [loansData, vaultData] = await Promise.all([
          fetchTotalMainnetLoans(),
          fetchVaultsByCurator()
        ]);

        // Total Morpho Loans
        document.getElementById('totalLoans').textContent = formatUsd(loansData.total);
        document.getElementById('totalLoansSub').textContent =
          `${loansData.fetched}/${loansData.countTotal} markets · live`;

        const { fusionVaults } = vaultData;

        // Fusion total
        const fusionTotal = fusionVaults.reduce((sum, v) => sum + (v.state?.totalAssetsUsd || 0), 0);
        document.getElementById('fusionLoans').textContent = formatUsd(fusionTotal);
        document.getElementById('fusionLoansSub').textContent =
          `${fusionVaults.length} vault${fusionVaults.length !== 1 ? 's' : ''} · live`;

        // Share
        const share = loansData.total > 0 ? (fusionTotal / loansData.total * 100) : 0;
        document.getElementById('shareValue').textContent = share.toFixed(1) + '%';
        document.getElementById('shareBar').style.width = Math.min(share, 100) + '%';

        // Vault table
        const tbody = document.getElementById('vaultTableBody');
        tbody.innerHTML = '';

        if (fusionVaults.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" class="loading">No Fusion vaults found on mainnet. Check console for available curator names.</td></tr>';
          return;
        }

        const sortedVaults = fusionVaults.sort((a, b) =>
          (b.state?.totalAssetsUsd || 0) - (a.state?.totalAssetsUsd || 0)
        );

        const maxShare = sortedVaults[0]?.state?.totalAssetsUsd || 1;

        sortedVaults.forEach(v => {
          const assets = v.state?.totalAssetsUsd || 0;
          const vaultShare = fusionTotal > 0 ? (assets / fusionTotal * 100) : 0;
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>
              <div class="vault-name">${v.name || v.symbol || 'Unknown'}</div>
              <div class="vault-address">${v.address.slice(0, 6)}...${v.address.slice(-4)} · ${v.asset?.symbol || '?'}</div>
            </td>
            <td>${formatUsd(assets)}</td>
            <td>
              <div class="bar-cell">
                <div class="bar-bg"><div class="bar-fill" style="width: ${(assets / maxShare) * 100}%"></div></div>
                <span class="bar-value">${vaultShare.toFixed(1)}%</span>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });

      } catch (err) {
        console.error('Init error:', err);
        document.getElementById('totalLoans').textContent = 'Error';
        document.getElementById('totalLoansSub').innerHTML = `<span class="error-msg">${err.message}</span>`;
      }
    }

    init();
  </script>
</body>
</html>
