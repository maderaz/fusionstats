<body>
  <div class="ui-page">
    <header class="ui-masthead">
      <div>
        <h1>Spark</h1>
        <p class="ui-lede">The IPOR stETH Ethereum vault loops on SparkLend: it supplies wstETH as collateral and borrows WETH against it. Its position, read live, and its rank among the market's wstETH suppliers.</p>
        <div class="ui-status"><span id="loadingMsg">Fetching on-chain data from SparkLend…</span></div>
      </div>
    </header>
    <div id="errorContent" style="display:none"></div>
    <div id="mainContent"></div>
  </div>

  <script src="/ui.js"></script>
  <script src="/ui-chart.js"></script>
  <script>
    // — Constants —
    // Multiple RPCs for resilience — tried sequentially on failure
    const RPCS = [
      'https://ethereum-rpc.publicnode.com',
      'https://rpc.ankr.com/eth',
      'https://eth.drpc.org',
      'https://eth.llamarpc.com',
    ];

    const WSTETH = '0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0';
    const WETH   = '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2';

    // SparkLend contracts (from spark-address-registry)
    const SPARK_POOL = '0xC13e21B648A5Ee794902342038FF3aDAB66BE987';
    const POOL_DATA_PROVIDER = '0xFc21d6d146E6086B8359705C8b28512a983db0cb';
    const POOL_ADDRESSES_PROVIDER = '0x02C3eA4e34C0cBd694D2adFa2c690EECbC1793eE';
    const AAVE_ORACLE = '0x8105f69D9C41644c6A0803fDA7D03Aa70996cFD9';

    // Spark aTokens & debt tokens
    const SP_WSTETH      = '0x12B54025C112Aa61fAce2CDB7118740875A566E9';
    const SP_WETH        = '0x59cD1C87501baa753d0B5B5Ab5D8416A45cD71DB';
    const WETH_DEBT      = '0x2e7576042566f8D6990e07A1B61Ad1efd86Ae70d';
    const WSTETH_DEBT    = '0xd5c3E3B566a42A6110513Ac7670C1a86D76E13E6';

    // IPOR stETH vault
    const VAULT_ADDRESS = '0xb8a451107a9f87fde481d4d686247d6e43ed715e';
    const VAULT_NAME = 'IPOR stETH Ethereum';

    // Known address labels (add labels as you discover them)
    const KNOWN_LABELS = {
      '0xb8a451107a9f87fde481d4d686247d6e43ed715e': 'IPOR stETH Ethereum',
    };

    // Fallback top holder addresses if spark-holders.json unavailable
    // (updated periodically by collect-spark-holders.js)
    const FALLBACK_HOLDERS = [
      '0xb8a451107a9f87fde481d4d686247d6e43ed715e', // IPOR — always include
    ];

    // — Helpers —
    function pad32(hex) {
      return hex.replace(/^0x/, '').toLowerCase().padStart(64, '0');
    }

    function formatUsd(n) {
      if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
      return '$' + n.toFixed(2);
    }

    function formatEth(n) {
      if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(2) + 'K';
      if (n >= 1) return n.toFixed(2);
      return n.toFixed(4);
    }

    function shortAddr(a) {
      return a.slice(0, 6) + '...' + a.slice(-4);
    }

    function rayToPercent(ray) {
      return (ray / 1e27) * 100;
    }

    // — RPC with fallback + retry —
    let activeRpc = 0;
    let callId = 0;

    // Generic JSON-RPC call with fallback across all RPCs
    async function rpcCall(method, params) {
      const order = [activeRpc, ...RPCS.map((_, i) => i).filter(i => i !== activeRpc)];
      for (const idx of order) {
        try {
          const res = await fetch(RPCS[idx], {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ jsonrpc: '2.0', id: ++callId, method, params })
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          if (json.error) throw new Error(json.error.message);
          activeRpc = idx;
          return json.result;
        } catch (e) {
          log(`RPC ${idx} (${method}) failed: ${e.message}`);
          continue;
        }
      }
      throw new Error(`All RPCs failed for ${method}`);
    }

    async function ethCall(to, data) {
      const result = await rpcCall('eth_call', [{ to, data }, 'latest']);
      if (!result || result === '0x') throw new Error('empty result');
      return result;
    }


    function decodeUint(hex, offset) {
      const start = 2 + offset * 64;
      const slice = hex.slice(start, start + 64);
      if (!slice || slice.length < 64) return 0n;
      return BigInt('0x' + slice);
    }

    // — Logging —
    const logLines = [];
    function log(msg) {
      const ts = new Date().toLocaleTimeString();
      logLines.push(`[${ts}] ${msg}`);
      console.log(`[spark] ${msg}`);
    }

    // — Simple on-chain reads (ERC-20 level — most reliable) —
    async function totalSupply(token) {
      const result = await ethCall(token, '0x18160ddd');
      return Number(decodeUint(result, 0)) / 1e18;
    }

    async function balanceOf(token, user) {
      const result = await ethCall(token, '0x70a08231' + pad32(user));
      return Number(decodeUint(result, 0)) / 1e18;
    }

    // Spark Oracle: getAssetPrice(address) → uint256 (8 decimals, USD)
    async function getAssetPrice(asset) {
      const result = await ethCall(AAVE_ORACLE, '0xb3596f07' + pad32(asset));
      return Number(decodeUint(result, 0)) / 1e8;
    }

    // Pool: getUserAccountData(address) → 6 uint256s
    async function getUserAccountData(user) {
      const result = await ethCall(SPARK_POOL, '0xbf92857c' + pad32(user));
      return {
        totalCollateralBase: Number(decodeUint(result, 0)) / 1e8,
        totalDebtBase: Number(decodeUint(result, 1)) / 1e8,
        availableBorrowsBase: Number(decodeUint(result, 2)) / 1e8,
        liquidationThreshold: Number(decodeUint(result, 3)) / 100,
        ltv: Number(decodeUint(result, 4)) / 100,
        healthFactor: Number(decodeUint(result, 5)) / 1e18,
      };
    }

    // PoolDataProvider: getReserveData(address) — try but don't fail hard
    async function getReserveData(asset) {
      try {
        const result = await ethCall(POOL_DATA_PROVIDER, '0x35ea6a75' + pad32(asset));
        return {
          liquidityRate: Number(decodeUint(result, 5)),
          variableBorrowRate: Number(decodeUint(result, 6)),
        };
      } catch (e) {
        log('getReserveData failed (non-critical): ' + e.message);
        return null;
      }
    }

    // — Main data loading — calls are SEQUENTIAL to avoid RPC rate-limits —
    async function loadAll() {
      const status = document.getElementById('loadingMsg');
      try {
        // Step 1: basic ERC-20 reads (bulletproof)
        status.textContent = 'Reading spWSTETH total supply...';
        const spWstethSupply = await totalSupply(SP_WSTETH);
        log(`spWSTETH totalSupply: ${spWstethSupply.toFixed(2)}`);

        status.textContent = 'Reading vault spWSTETH balance...';
        const vaultWstethBal = await balanceOf(SP_WSTETH, VAULT_ADDRESS);
        log(`Vault spWSTETH balance: ${vaultWstethBal.toFixed(2)}`);

        status.textContent = 'Reading vault WETH debt...';
        const vaultWethDebt = await balanceOf(WETH_DEBT, VAULT_ADDRESS);
        log(`Vault WETH debt: ${vaultWethDebt.toFixed(2)}`);

        // Step 2: prices from Spark oracle
        status.textContent = 'Fetching prices from Spark oracle...';
        const wstethPrice = await getAssetPrice(WSTETH);
        const ethPrice = await getAssetPrice(WETH);
        log(`wstETH price: $${wstethPrice.toFixed(2)}, ETH price: $${ethPrice.toFixed(2)}`);

        // Step 3: vault health factor from Pool
        status.textContent = 'Reading vault account data...';
        const account = await getUserAccountData(VAULT_ADDRESS);
        log(`Health factor: ${account.healthFactor.toFixed(2)}`);

        // Step 4: reserve rates (optional, may fail)
        status.textContent = 'Reading reserve rates...';
        const wstethRates = await getReserveData(WSTETH);
        const wethRates = await getReserveData(WETH);

        // Step 5: load holders from cached JSON + live balanceOf
        status.textContent = 'Loading holder rankings...';
        const { holders, updatedAt: holdersUpdatedAt } = await loadHolders(spWstethSupply);
        log(`Loaded ${holders.length} ranked holders`);

        // Compute derived values
        const vaultSupplyUsd = vaultWstethBal * wstethPrice;
        const vaultBorrowUsd = vaultWethDebt * ethPrice;
        const vaultSharePct = spWstethSupply > 0 ? (vaultWstethBal / spWstethSupply) * 100 : 0;
        const leverage = vaultSupplyUsd > 0 && vaultSupplyUsd > vaultBorrowUsd
          ? vaultSupplyUsd / (vaultSupplyUsd - vaultBorrowUsd) : 0;

        // Find vault rank
        const vaultRank = holders.findIndex(h =>
          h.addr.toLowerCase() === VAULT_ADDRESS.toLowerCase()) + 1;

        renderPage({
          spWstethSupply, wstethPrice, ethPrice,
          vaultWstethBal, vaultWethDebt, vaultSupplyUsd, vaultBorrowUsd,
          healthFactor: account.healthFactor,
          liquidationThreshold: account.liquidationThreshold,
          vaultSharePct, leverage, vaultRank,
          supplyApy: wstethRates ? rayToPercent(wstethRates.liquidityRate) : null,
          borrowApy: wethRates ? rayToPercent(wethRates.variableBorrowRate) : null,
          holders, holdersUpdatedAt,
        });

      } catch (err) {
        console.error('Error loading Spark data:', err);
        status.textContent = 'SparkLend could not be read';
        const errDiv = document.getElementById('errorContent');
        errDiv.style.display = 'block';
        errDiv.innerHTML = `<div class="error-msg">
          Failed to fetch on-chain data: ${err.message}
          <br><small>Try refreshing — public RPCs may be rate-limited</small>
          <br><small style="color:var(--text-secondary);margin-top:0.5rem;display:block">
            Log: ${logLines.slice(-5).join(' → ')}
          </small>
        </div>`;
      }
    }

    // — Load holder addresses from spark-holders.json (generated by cron) —
    async function getHolderAddresses() {
      try {
        const res = await fetch('../spark-holders.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        log(`Loaded ${data.holders.length} holders from spark-holders.json (updated ${data.updatedAt})`);
        // Merge any labels from the JSON
        for (const h of data.holders) {
          if (h.label && !KNOWN_LABELS[h.address.toLowerCase()]) {
            KNOWN_LABELS[h.address.toLowerCase()] = h.label;
          }
        }
        return {
          addresses: data.holders.map(h => h.address.toLowerCase()),
          updatedAt: data.updatedAt,
        };
      } catch (e) {
        log(`spark-holders.json unavailable (${e.message}), using fallback list`);
        return { addresses: FALLBACK_HOLDERS, updatedAt: null };
      }
    }

    async function loadHolders(spWstethSupply) {
      const { addresses, updatedAt } = await getHolderAddresses();

      // Always include the vault
      const addrSet = new Set(addresses.map(a => a.toLowerCase()));
      addrSet.add(VAULT_ADDRESS.toLowerCase());
      const addrArray = Array.from(addrSet);

      // Check current balances — fast! only ~20-50 balanceOf calls
      const results = [];
      const BATCH = 5;
      for (let i = 0; i < addrArray.length; i += BATCH) {
        const batch = addrArray.slice(i, i + BATCH);
        const balances = await Promise.all(
          batch.map(a => balanceOf(SP_WSTETH, a).catch(() => 0))
        );
        for (let j = 0; j < batch.length; j++) {
          if (balances[j] > 0.01) {
            results.push({
              addr: batch[j],
              label: KNOWN_LABELS[batch[j].toLowerCase()] || null,
              balance: balances[j],
              share: spWstethSupply > 0 ? (balances[j] / spWstethSupply) * 100 : 0,
            });
          }
        }
      }

      results.sort((a, b) => b.balance - a.balance);
      log(`Checked ${addrArray.length} addresses, ${results.length} have balance > 0.01`);
      return { holders: results.slice(0, 25), updatedAt };
    }

    // — Rendering —
    const esc = UI.esc;
    const figure = (k, v, sub, cls) => '<div class="ui-figure"><div class="k">' + k + '</div><div class="v' + (cls ? ' ' + cls : '') + '">' + v + '</div><div class="s">' + (sub || '&nbsp;') + '</div></div>';
    function renderPage(d) {
      const hf = d.healthFactor;
      const hfCls = hf > 2 ? 'pos' : hf > 1.5 ? 'watch' : 'neg';
      const rows = d.holders.map((h, i) => {
        const isVault = h.addr.toLowerCase() === VAULT_ADDRESS.toLowerCase();
        const name = h.label || shortAddr(h.addr);
        const who = isVault ? esc(name) : '<a href="https://etherscan.io/address/' + esc(h.addr) + '" target="_blank" rel="noopener" title="' + esc(h.addr) + '">' + esc(name) + '</a>';
        return '<div class="hrow' + (isVault ? ' is-vault' : '') + '">'
          + '<span class="rk">' + (i + 1) + '</span>'
          + '<span class="who">' + who + '</span>'
          + '<span class="r bal">' + formatEth(h.balance) + '</span>'
          + '<span class="r val">' + formatUsd(h.balance * d.wstethPrice) + '</span>'
          + '<span class="r shr">' + h.share.toFixed(2) + '%</span>'
          + '</div>';
      }).join('');
      document.getElementById('mainContent').innerHTML =
        '<div class="figs-k">The vault on Spark</div>'
        + '<div class="ui-figures first" style="--n:4">'
        + figure('Supplied', formatEth(d.vaultWstethBal) + ' wstETH', formatUsd(d.vaultSupplyUsd))
        + figure('Borrowed', formatEth(d.vaultWethDebt) + ' WETH', formatUsd(d.vaultBorrowUsd))
        + figure('Health factor', hf > 100 ? '> 100' : hf.toFixed(2), 'liquidation threshold ' + d.liquidationThreshold.toFixed(0) + '%', hfCls)
        + figure('Leverage', d.leverage.toFixed(2) + 'x', 'net equity ' + formatUsd(d.vaultSupplyUsd - d.vaultBorrowUsd))
        + '</div>'
        + '<div class="figs-k">The wstETH market</div>'
        + '<div class="ui-figures" style="--n:4">'
        + figure('Vault rank', '#' + (d.vaultRank || '?'), d.vaultSharePct.toFixed(2) + '% of wstETH supplied')
        + figure('wstETH supplied', formatEth(d.spWstethSupply), formatUsd(d.spWstethSupply * d.wstethPrice))
        + figure('Supply APY', d.supplyApy !== null ? d.supplyApy.toFixed(2) + '%' : '—', 'wstETH')
        + figure('Borrow APY', d.borrowApy != null ? d.borrowApy.toFixed(2) + '%' : '—', 'WETH')
        + '</div>'
        + '<section class="ui-section">'
        + '<div class="ui-head"><h2>Vault rank over time<span class="ui-count" id="rankChartSub"></span></h2></div>'
        + '<div class="ui-chart" id="rankChart"><div class="ui-empty">Loading the rank history…</div></div>'
        + '</section>'
        + (rows ? '<section class="ui-section">'
          + '<div class="ui-head"><h2>Top wstETH suppliers<span class="ui-count">balances live' + (d.holdersUpdatedAt ? ', list of ' + esc(new Date(d.holdersUpdatedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })) : '') + '</span></h2>'
          + '<a class="ui-btn" href="https://etherscan.io/token/' + SP_WSTETH + '#balances" target="_blank" rel="noopener">Etherscan ↗</a></div>'
          + '<div class="hlist"><div class="hhead"><span>#</span><span>Supplier</span><span class="r">wstETH</span><span class="r">Value</span><span class="r">Share</span></div>'
          + '<div id="holders">' + rows + '</div></div>'
          + '<p class="note">Read live from SparkLend\'s contracts through public RPCs · <a href="https://app.spark.fi/markets/1/' + WSTETH + '" target="_blank" rel="noopener">View on Spark ↗</a> · vault <a href="https://etherscan.io/address/' + VAULT_ADDRESS + '" target="_blank" rel="noopener">' + shortAddr(VAULT_ADDRESS) + ' ↗</a></p>'
          + '</section>' : '');
      document.getElementById('loadingMsg').innerHTML = '<b>Live</b> from SparkLend · ' + d.holders.length + ' largest suppliers checked';
    }

    // — Rank history: rank 1 at the top —
    const plotlyReady = new Promise((resolve, reject) => {
      const failed = () => reject(new Error('the chart library (cdn.plot.ly) did not load'));
      const settle = () => (window.Plotly ? resolve() : failed());
      const tag = document.getElementById('plotlyJs');
      // Its load or error fires once, perhaps before this runs: the tag keeps
      // the outcome (onload/onerror) for a late reader.
      if (window.Plotly || !tag || tag.dataset.state) return settle();
      tag.addEventListener('load', settle);
      tag.addEventListener('error', failed);
    });
    plotlyReady.catch(() => {});   // the chart says so when it asks (renderRankChart)
    let rankPoints = null;
    async function loadRankChart() {
      try {
        const res = await fetch('../spark-rank-history.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const history = await res.json();
        rankPoints = history.filter(e => e.rank != null).map(e => ({ time: new Date(e.t), rank: e.rank, balance: e.balance, share: e.share }));
        await renderRankChart();
      } catch (e) {
        const el = document.getElementById('rankChart');
        if (el) el.innerHTML = '<div class="ui-empty">No rank history yet — run collect-spark-holders.js to start tracking.</div>';
        log('Rank history unavailable: ' + e.message);
      }
    }
    async function renderRankChart() {
      const el = document.getElementById('rankChart');
      if (!el || !rankPoints) return;
      if (!rankPoints.length) { el.innerHTML = '<div class="ui-empty">No rank data available yet.</div>'; return; }
      try { await plotlyReady; }
      catch (e) { el.innerHTML = '<div class="ui-empty">The chart library (cdn.plot.ly) did not load. The figures and the list are unaffected.</div>'; return; }
      el.querySelectorAll(':scope > .ui-empty').forEach(n => n.remove());
      const pts = rankPoints, accent = FusionChart.cssVar('--accent', '#8429FF');
      const maxRank = Math.max(...pts.map(p => p.rank), 10);
      const span = pts[pts.length - 1].time - pts[0].time;
      const layout = {
        autosize: true, margin: { l: 48, r: 16, t: 12, b: 40 },
        plot_bgcolor: 'rgba(0,0,0,0)', paper_bgcolor: 'rgba(0,0,0,0)',
        font: { family: 'Geist, -apple-system, sans-serif', color: FusionChart.cssVar('--text-2', '#70747A'), size: 12 },
        xaxis: { type: 'date', showgrid: false, linecolor: FusionChart.cssVar('--line', '#E5E5E5'), tickfont: { size: 11 }, tickformat: span > 330 * 86400000 ? "%b '%y" : '%b %d', showspikes: false },
        // Rank 1 at the top, on a log scale: the vault sits around #10, and
        // the days it left Spark (#330) stay on the chart without flattening
        // the rest against its top.
        yaxis: { type: 'log', showgrid: false, linecolor: FusionChart.cssVar('--line', '#E5E5E5'), tickfont: { size: 11 }, showspikes: false,
                 range: [Math.log10(maxRank * 1.15), Math.log10(0.8)],
                 tickvals: [1, 2, 5, 10, 20, 50, 100, 200, 500].filter(v => v <= maxRank * 1.15),
                 ticktext: [1, 2, 5, 10, 20, 50, 100, 200, 500].filter(v => v <= maxRank * 1.15).map(v => '#' + v) },
        showlegend: false, hovermode: 'x unified', hoverdistance: -1, spikedistance: -1,
        dragmode: FusionChart.compact() ? false : 'zoom',
      };
      const trace = { type: 'scatter', mode: 'lines', x: pts.map(p => p.time), y: pts.map(p => p.rank), customdata: pts.map(p => p.balance),
        line: { color: accent, width: 2.5, shape: 'hv' } };
      await Plotly.react(el, FusionChart.quiet([trace]), FusionChart.fit(layout, [trace]), { responsive: true, displayModeBar: false, scrollZoom: false, doubleClick: 'reset', showTips: false });
      FusionChart.glide(el, (hp) => {
        const p = pts[hp[0].pointIndex != null ? hp[0].pointIndex : hp[0].pointNumber];
        if (!p) return '';
        // The stored share is not a percentage (the history was written with a
        // total supply of 0), so the hover gives the rank and the balance.
        return FusionChart.when(p.time.toISOString(), true) + '<div class="hv-big">Rank #' + p.rank + '</div>'
          + FusionChart.row(null, 'Supplied', formatEth(p.balance) + ' wstETH');
      });
      const hours = Math.round(span / 3600000);
      document.getElementById('rankChartSub').textContent = pts.length + ' readings over ' + (hours >= 24 ? Math.round(hours / 24) + ' days' : hours + ' hours') + ', about every 6h';
    }
    window.addEventListener('fusion:theme', () => { renderRankChart(); });
    FusionChart.onChange(() => { renderRankChart(); });

    // — Init —
    loadAll().then(() => loadRankChart());
  </script>
</body>
</html>
