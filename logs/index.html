<html lang="en">
<head>

  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9A%9B%EF%B8%8F</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ui.css">
  <script src="/nav.js"></script>
  <style>
    .ui-section .ui-toolbar { margin-bottom: 6px; }
    .ui-seg .n { margin-left: 5px; color: var(--text-3); font-weight: 400; font-variant-numeric: tabular-nums; }
    .ui-figure .v.warn { color: var(--amber); }
    .ui-figure .v.err { color: var(--neg); }

    /* A run: its level, when, how long; then what it read, or what went wrong. */
    .run { padding: 13px 0; border-bottom: 1px solid var(--line); }
    .run-head { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
    .lvl { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: 0.02em; }
    .lvl.info { color: var(--accent); background: var(--accent-bg); }
    .lvl.warn { color: var(--amber); background: var(--amber-soft); }
    .lvl.error { color: var(--neg); background: var(--neg-soft); }
    .run-when { color: var(--text); font-variant-numeric: tabular-nums; }
    .run-ago { color: var(--text-3); }
    .run-dur { margin-left: auto; color: var(--text-3); font: 12.5px var(--mono); }
    .run-body { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 6px; padding-left: 0; font-size: 13px; color: var(--text-2); }
    .run-body b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    .run-body .skip { color: var(--text-3); }
    .run-errors, .run-warnings { margin-top: 8px; padding: 8px 10px; border-radius: 8px; font: 12px/1.55 var(--mono); word-break: break-word; }
    .run-errors { color: var(--neg); background: var(--neg-soft); }
    .run-warnings { color: var(--amber); background: var(--amber-soft); }
    .empty { padding: 40px 12px; text-align: center; font-size: 13.5px; color: var(--text-3); }
    .empty code { font: 12.5px var(--mono); }
    @container (max-width: 700px) {
      .run-head { flex-wrap: wrap; row-gap: 2px; }
      .run-ago { display: none; }
    }
  </style>
  <script defer src="/track.js"></script>
</head>
<body>
  <div class="ui-page">
    <header class="ui-masthead">
      <div>
        <h1>Logs</h1>
        <p class="ui-lede">Each run of the collector: what it read from Morpho, how long it took, and what went wrong.</p>
        <div class="ui-status" id="status">Loading…</div>
      </div>
    </header>

    <div class="ui-figures" style="--n:4">
      <div class="ui-figure"><div class="k">Last run</div><div class="v" id="fLast"></div><div class="s" id="fLastSub">&nbsp;</div></div>
      <div class="ui-figure"><div class="k">Runs, 24h</div><div class="v" id="fRuns"></div><div class="s" id="fRunsSub">&nbsp;</div></div>
      <div class="ui-figure"><div class="k">Warnings</div><div class="v" id="fWarn"></div><div class="s" id="fWarnSub">&nbsp;</div></div>
      <div class="ui-figure"><div class="k">Errors</div><div class="v" id="fErr"></div><div class="s" id="fErrSub">&nbsp;</div></div>
    </div>

    <section class="ui-section">
      <div class="ui-toolbar">
        <div class="ui-seg" id="filter" role="group" aria-label="Level">
          <button type="button" data-filter="all" class="on">All</button>
          <button type="button" data-filter="info">Info</button>
          <button type="button" data-filter="warn">Warnings</button>
          <button type="button" data-filter="error">Errors</button>
        </div>
      </div>
      <div id="logContainer"><div class="empty">Loading logs…</div></div>
      <div id="pager"></div>
    </section>
  </div>

  <script src="/ui.js"></script>
  <script>
  (function () {
    'use strict';
    const PAGE = 20;
    const esc = UI.esc;
    function formatUsd(v) {
      if (v >= 1e9) return '$' + (v / 1e9).toFixed(2) + 'B';
      if (v >= 1e6) return '$' + (v / 1e6).toFixed(2) + 'M';
      if (v >= 1e3) return '$' + (v / 1e3).toFixed(1) + 'K';
      return '$' + v.toFixed(2);
    }
    function timeAgo(ts) {
      const mins = Math.floor((Date.now() - new Date(ts).getTime()) / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      return Math.floor(hrs / 24) + 'd ago';
    }

    let allLogs = [], currentFilter = 'all', page = 1;

    function renderFigures() {
      const last = allLogs[allLogs.length - 1];
      const day = Date.now() - 86400000;
      const recent = allLogs.filter(l => new Date(l.timestamp).getTime() >= day);
      const skipped = recent.filter(l => l.event === 'collect_skipped').length;
      const warns = allLogs.filter(l => l.level === 'warn').length, errs = allLogs.filter(l => l.level === 'error').length;
      document.getElementById('fLast').textContent = last ? timeAgo(last.timestamp) : '—';
      document.getElementById('fLastSub').textContent = last && last.durationMs ? 'took ' + (last.durationMs / 1000).toFixed(1) + 's' : ' ';
      document.getElementById('fRuns').textContent = String(recent.length);
      document.getElementById('fRunsSub').textContent = skipped ? skipped + ' skipped as repeats' : ' ';
      const w = document.getElementById('fWarn'), e = document.getElementById('fErr');
      w.textContent = String(warns); w.className = 'v' + (warns ? ' warn' : '');
      e.textContent = String(errs); e.className = 'v' + (errs ? ' err' : '');
      document.getElementById('fWarnSub').textContent = 'of the last ' + allLogs.length;
      document.getElementById('fErrSub').textContent = 'of the last ' + allLogs.length;
      document.querySelectorAll('#filter button').forEach(b => {
        const f = b.dataset.filter, n = f === 'all' ? allLogs.length : allLogs.filter(l => l.level === f).length;
        b.innerHTML = b.textContent.replace(/\s*\d+$/, '') + '<span class="n">' + n + '</span>';
      });
      document.getElementById('status').innerHTML = last
        ? 'Last run <b>' + esc(new Date(last.timestamp).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })) + '</b>'
        : '';
    }

    function entryHtml(entry) {
      const time = new Date(entry.timestamp).toLocaleString();
      const duration = entry.durationMs ? '<span class="run-dur">' + (entry.durationMs / 1000).toFixed(1) + 's</span>' : '';
      let body = '';
      if (entry.event === 'collect' && entry.totalLoans !== undefined) {
        body = '<div class="run-body">'
          + '<span>Loans <b>' + formatUsd(entry.totalLoans) + '</b></span>'
          + '<span>Fusion <b>' + formatUsd(entry.fusionBorrowed || 0) + '</b></span>'
          + '<span>Share <b>' + (entry.sharePercent || 0).toFixed(2) + '%</b></span>'
          + '<span>Vaults <b>' + (entry.activeVaults || 0) + '/' + (entry.totalVaults || '?') + '</b></span>'
          + (entry.vaultErrors > 0 ? '<span style="color:var(--amber)">Errors <b style="color:inherit">' + entry.vaultErrors + '</b></span>' : '')
          + '</div>';
      } else if (entry.event === 'collect_skipped') {
        body = '<div class="run-body"><span class="skip">Skipped: the last reading was under 45 minutes old</span></div>';
      } else if (entry.event === 'collect_crash') {
        body = '<div class="run-errors">' + esc(entry.message) + '</div>';
      }
      const errors = entry.errors && entry.errors.length
        ? '<div class="run-errors">' + entry.errors.map(e => esc(e.step + ': ' + e.message)).join('<br>') + '</div>' : '';
      const warnings = entry.warnings && entry.warnings.length
        ? '<div class="run-warnings">' + entry.warnings.map(w => esc((w.vault ? w.vault.slice(0, 10) + '...' : w.step) + ': ' + w.message)).join('<br>') + '</div>' : '';
      return '<div class="run"><div class="run-head"><span class="lvl ' + esc(entry.level) + '">' + esc(entry.level) + '</span>'
        + '<span class="run-when">' + esc(time) + '</span><span class="run-ago">' + timeAgo(entry.timestamp) + '</span>' + duration + '</div>'
        + body + errors + warnings + '</div>';
    }

    function renderLogs() {
      const container = document.getElementById('logContainer');
      const filtered = (currentFilter === 'all' ? allLogs : allLogs.filter(l => l.level === currentFilter)).slice().reverse();
      if (!filtered.length) {
        container.innerHTML = '<div class="empty">' + (allLogs.length ? 'No runs at this level.' : 'No logs yet. Run <code>node collect.js</code> to start logging.') + '</div>';
        document.getElementById('pager').innerHTML = '';
        return;
      }
      const last = Math.max(1, Math.ceil(filtered.length / PAGE));
      page = Math.min(Math.max(1, page), last);
      container.innerHTML = filtered.slice((page - 1) * PAGE, page * PAGE).map(entryHtml).join('');
      document.getElementById('pager').innerHTML = UI.pager({ total: filtered.length, page, size: PAGE, noun: 'runs' });
    }

    document.getElementById('filter').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-filter]'); if (!b) return;
      document.querySelectorAll('#filter button').forEach(x => x.classList.toggle('on', x === b));
      currentFilter = b.dataset.filter; page = 1;
      renderLogs();
    });
    UI.onPage(document.getElementById('pager'), (n) => {
      page = n; renderLogs();
      const top = document.getElementById('logContainer').getBoundingClientRect().top;
      if (top < 0) window.scrollBy({ top: top - 80 });
    });

    fetch('/logs.json')
      .then(r => (r.ok ? r.json() : []))
      .then(data => { allLogs = Array.isArray(data) ? data : []; renderFigures(); renderLogs(); })
      .catch(() => {
        document.getElementById('status').textContent = '';
        document.getElementById('logContainer').innerHTML = '<div class="empty">No logs file found. Run <code>node collect.js</code> to start logging.</div>';
      });
  })();
  </script>
</body>
</html>
