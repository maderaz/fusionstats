name: Deep Rebalance Backfill (One-off)

# Manual-only — meant for seeding deep historical data for a single vault.
# After seeding, the daily rebalances workflow keeps it incremental.

on:
  workflow_dispatch:
    inputs:
      vault:
        description: 'Vault address (0x...)'
        required: true
        default: '0xb8a451107a9f87fde481d4d686247d6e43ed715e'   # stETH looping ethereum
      chain:
        description: 'Chain (ethereum, base, arbitrum, plasma, avalanche, unichain)'
        required: true
        default: 'ethereum'
      from_block:
        description: 'Start block (optional, default = ~24 months back)'
        required: false
        default: ''
      throttle_ms:
        description: 'Min ms between RPC calls per endpoint (higher = safer, slower)'
        required: false
        default: '200'

permissions:
  contents: write

# Every workflow that writes activity-events.json or the rebalance files
# shares this group (the deep backfills write both). Without
# it a scheduled run and a backfill overlap — a backfill takes hours — and
# whichever pushes second replays its own copy of the file over the other's,
# silently discarding the events the first one found. Queued, never cancelled
# mid-run: a run that is writing must finish.
concurrency:
  group: event-data-writers
  cancel-in-progress: false

jobs:
  deep-backfill:
    runs-on: ubuntu-latest
    # Optional keyed endpoints, tried before the public ones (rpc-endpoints.js).
    # Unset secrets are empty and change nothing.
    env:
      RPC_URL_ETHEREUM: ${{ secrets.RPC_URL_ETHEREUM }}
      RPC_URL_BASE: ${{ secrets.RPC_URL_BASE }}
      RPC_URL_ARBITRUM: ${{ secrets.RPC_URL_ARBITRUM }}
    timeout-minutes: 350         # under GHA's 6h hard cap, with margin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # the branch as it is now, never a re-run's stale commit (see collect.yml)

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Refresh activity events (used to filter user txs)
        continue-on-error: true
        timeout-minutes: 8
        run: node collect-activity.js

      - name: Deep historical scan
        env:
          RPC_MIN_INTERVAL_MS: ${{ inputs.throttle_ms }}
        run: |
          if [ -n "${{ inputs.from_block }}" ]; then
            node collect-rebalances.js --deepest ${{ inputs.vault }} ${{ inputs.chain }} ${{ inputs.from_block }}
          else
            node collect-rebalances.js --deepest ${{ inputs.vault }} ${{ inputs.chain }}
          fi

      # The pages' files cut from the events (tools/build-event-caches.js),
      # rebuilt from what this run found: the pages read them instead of the
      # whole history, so they must not lag it.
      - name: Rebuild the pages' event files
        continue-on-error: true
        run: node tools/build-event-caches.js

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f rebalance-events-*.json activity-events.json 2>/dev/null || true
          for f in $(node tools/build-event-caches.js --list); do [ -f "$f" ] && git add -f "$f"; done
          # Same rule as the collectors: generated output supersedes the remote,
          # so a rejected push resets onto origin and replays our files rather
          # than rebasing into a conflict that `|| true` would then hide.
          FILES=$(git diff --cached --name-only)
          if [ -z "$FILES" ]; then echo "No changes"; exit 0; fi
          git commit -m "Deep backfill: ${{ inputs.vault }} on ${{ inputs.chain }} [skip ci]"

          BRANCH="${{ github.ref_name }}"
          KEEP=$(mktemp -d)
          for f in $FILES; do mkdir -p "$KEEP/$(dirname "$f")"; cp "$f" "$KEEP/$f"; done

          for i in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git merge  --abort 2>/dev/null || true
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            for f in $FILES; do cp "$KEEP/$f" "$f"; done
            # The page files again, from these events and the remote's other inputs.
            node tools/build-event-caches.js || true
            for f in $(node tools/build-event-caches.js --list); do [ -f "$f" ] && git add -f "$f"; done
            git add -f $FILES
            if git diff --cached --quiet; then echo "Remote already current"; exit 0; fi
            git commit -m "Deep backfill: ${{ inputs.vault }} on ${{ inputs.chain }} [skip ci]"
            sleep $((2**i))
          done
          echo "::error::push still failing after retries"
          exit 1
