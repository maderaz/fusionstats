name: Collect Spark Holders

on:
  schedule:
    - cron: '15 */6 * * *'  # every 6 hours at :15
  workflow_dispatch:         # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Scan spWSTETH holders
        run: node collect-spark-holders.js

      - name: Commit & push data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add spark-holders.json spark-rank-history.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update spark-holders.json [skip ci]"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          # Retry with backoff — transient GitHub "commit_refs" rejections / races.
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push failed (attempt $i) — re-syncing, retrying in $((2**i))s"
            sleep $((2**i))
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
          done
          echo "::error::push still failing after retries"
          exit 1
