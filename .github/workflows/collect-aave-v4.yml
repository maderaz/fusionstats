name: Collect Aave V4

# What Fusion's stock vaults supply to Aave V4 on Base, for /stocks/aave-v4
# (collect-aave-v4.js). Each run reads the market now and fills in up to 45
# missing days of history, so the first few runs build the chart back to the
# spoke's first day. Old days need an endpoint that keeps old state: the
# RPC_URL_BASE secret.

on:
  schedule:
    - cron: '35 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RPC_URL_BASE: ${{ secrets.RPC_URL_BASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # the branch as it is now, never a re-run's stale commit (see collect.yml)

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read Aave V4
        run: node collect-aave-v4.js

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aave-v4.json
          FILES=$(git diff --cached --name-only)
          if [ -z "$FILES" ]; then echo "No changes"; exit 0; fi
          git commit -m "Update aave-v4.json [skip ci]"

          # Generated data: on rejection, reset onto origin and replay this
          # run's file rather than rebase (see collect-zyfai.yml).
          BRANCH="${{ github.ref_name }}"
          KEEP=$(mktemp -d)
          for f in $FILES; do mkdir -p "$KEEP/$(dirname "$f")"; cp "$f" "$KEEP/$f"; done
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            echo "push rejected (attempt $i) — replaying generated files onto origin"
            git rebase --abort 2>/dev/null || true
            git merge  --abort 2>/dev/null || true
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            for f in $FILES; do cp "$KEEP/$f" "$f"; done
            git add -f $FILES
            if git diff --cached --quiet; then echo "Remote already current"; exit 0; fi
            git commit -m "Update aave-v4.json [skip ci]"
            sleep $((2**i))
          done
          echo "::error::push still failing after retries"
          exit 1
