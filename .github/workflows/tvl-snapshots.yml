name: TVL Snapshots — Build Historical Series

# Snapshots vault.totalAssets() at ~one sample per day from deployment to
# current, multiplies by historical underlying price (DeFi Llama). Output:
# tvl-snapshots.json. The /address chart prefers these snapshots over the
# deposit-walk approximation when available — fixes leveraged-yield vaults
# whose chart wraps to zero too early.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scope — "all" snapshots every vault (~2-3h); "single" only the vault(s) below'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - single
      vault:
        description: 'Vault address(es), space-separated — ONLY used when mode = single'
        required: false
        default: '0xb8a451107a9f87fde481d4d686247d6e43ed715e'
      chain:
        description: 'Chain (leave blank to read from deployments cache, or filter when mode=all)'
        required: false
        default: ''
      throttle_ms:
        description: 'Min ms between RPC calls per endpoint'
        required: false
        default: '200'

permissions:
  contents: write

jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Refresh IPOR vault list
        continue-on-error: true
        run: node collect-ipor-vaults.js

      - name: Snapshot TVL (single vault)
        if: ${{ inputs.mode == 'single' }}
        env:
          RPC_MIN_INTERVAL_MS: ${{ inputs.throttle_ms }}
        run: node collect-activity.js --tvl-snapshots ${{ inputs.vault }} ${{ inputs.chain }}

      - name: Find deployment blocks (so no vault is skipped)
        if: ${{ inputs.mode == 'all' }}
        continue-on-error: true
        env:
          RPC_MIN_INTERVAL_MS: ${{ inputs.throttle_ms }}
        run: node collect-activity.js --find-deployments ${{ inputs.chain }}

      - name: Snapshot TVL (all tracked vaults)
        if: ${{ inputs.mode == 'all' }}
        env:
          RPC_MIN_INTERVAL_MS: ${{ inputs.throttle_ms }}
        run: node collect-activity.js --tvl-snapshots-all ${{ inputs.chain }}

      - name: Commit & push results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f tvl-snapshots.json vault-deployments.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "TVL snapshots: ${{ inputs.mode }} ${{ inputs.vault || '' }} [skip ci]"

          BACKUP="tvl-snapshots/${{ github.run_id }}"
          git push origin "HEAD:refs/heads/$BACKUP"
          echo "Backup branch pushed: $BACKUP"

          git fetch origin ${{ github.ref_name }}
          if ! git -c rebase.autoStash=true rebase -X theirs origin/${{ github.ref_name }}; then
            git rebase --abort || true
            echo "::warning::Rebase failed; result preserved on branch $BACKUP — merge manually."
            exit 1
          fi
          for i in 1 2 3 4; do
            if git push; then break; fi
            sleep $((2**i))
          done
