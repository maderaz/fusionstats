name: TVL Snapshots — Build Historical Series

# Snapshots vault.totalAssets() at ~one sample per day from deployment to
# current, multiplies by historical underlying price (DeFi Llama). Output:
# tvl-snapshots.json. The /address chart prefers these snapshots over the
# deposit-walk approximation when available — fixes leveraged-yield vaults
# whose chart wraps to zero too early.

on:
  schedule:
    # Daily incremental refresh. Snapshots are daily-granularity, and the
    # per-vault scan only fetches blocks it doesn't already have, so a
    # scheduled run just appends the new day(s) per vault — fast, unlike the
    # initial full backfill. Keeps the /address TVL + share-price charts current.
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scope — "all" snapshots every vault (~2-3h); "single" only the vault(s) below; "repair" only backfills missing USD (fast, no RPC)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - single
          - repair
      vault:
        description: 'Vault address(es), space-separated — ONLY used when mode = single'
        required: false
        default: '0xb8a451107a9f87fde481d4d686247d6e43ed715e'
      chain:
        description: 'Chain (leave blank to read from deployments cache, or filter when mode=all)'
        required: false
        default: ''
      throttle_ms:
        description: 'Min ms between RPC calls per endpoint'
        required: false
        default: '200'

permissions:
  contents: write

jobs:
  snapshots:
    runs-on: ubuntu-latest
    # Optional keyed endpoints, tried before the public ones (rpc-endpoints.js).
    # Unset secrets are empty and change nothing.
    env:
      RPC_URL_ETHEREUM: ${{ secrets.RPC_URL_ETHEREUM }}
      RPC_URL_BASE: ${{ secrets.RPC_URL_BASE }}
      RPC_URL_ARBITRUM: ${{ secrets.RPC_URL_ARBITRUM }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # the branch as it is now, never a re-run's stale commit (see collect.yml)

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Refresh IPOR vault list
        continue-on-error: true
        run: node collect-ipor-vaults.js

      - name: Snapshot TVL (single vault)
        if: ${{ inputs.mode == 'single' }}
        env:
          RPC_MIN_INTERVAL_MS: ${{ inputs.throttle_ms || '200' }}
        run: node collect-activity.js --tvl-snapshots ${{ inputs.vault }} ${{ inputs.chain }}

      # Scheduled runs have no inputs ⇒ inputs.mode is empty; treat that as "all".
      - name: Find deployment blocks (so no vault is skipped)
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'all' }}
        continue-on-error: true
        env:
          RPC_MIN_INTERVAL_MS: ${{ inputs.throttle_ms || '200' }}
        run: node collect-activity.js --find-deployments ${{ inputs.chain }}

      - name: Snapshot TVL (all tracked vaults)
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'all' }}
        env:
          RPC_MIN_INTERVAL_MS: ${{ inputs.throttle_ms || '200' }}
        run: node collect-activity.js --tvl-snapshots-all ${{ inputs.chain }}

      - name: Repair missing USD prices (no RPC)
        if: ${{ inputs.mode == 'repair' }}
        run: node collect-activity.js --repair-prices ${{ inputs.chain }}

      # The Stocks page reads its TVL from stocks-data.json, cut from the
      # snapshots above (tools/build-stocks-data.js).
      - name: Build the Stocks page's data file
        if: always()
        continue-on-error: true
        run: node tools/build-stocks-data.js

      # Each vault's latest snapshot TVL, for the All Vaults page, which read
      # the whole 11 MB history for one number a vault (tools/build-tvl-latest.js).
      - name: Build the latest-TVL file
        if: always()
        continue-on-error: true
        run: node tools/build-tvl-latest.js

      # TVL per network per day for the TVL page (tools/build-tvl-daily.js).
      - name: Build the TVL page's daily file
        if: always()
        continue-on-error: true
        run: node tools/build-tvl-daily.js

      # The Share-Price Monitor's rows for each window, worked out with the
      # page's own code (share-price.js), ~70 KB over the wire instead of the
      # whole snapshot history (tools/build-share-prices.js).
      - name: Build the Monitor's share prices
        if: always()
        continue-on-error: true
        run: node tools/build-share-prices.js

      - name: Commit & push results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # One at a time: a single missing file makes `git add a b c` add none
          # of them, and the snapshots would go uncommitted with it.
          for f in tvl-snapshots.json vault-deployments.json stocks-data.json tvl-latest.json tvl-daily.json share-prices.json; do
            [ -f "$f" ] && git add -f "$f"
          done
          FILES=$(git diff --cached --name-only)
          if [ -z "$FILES" ]; then echo "No changes"; exit 0; fi
          MODE="${{ inputs.mode || 'scheduled' }}"
          MSG="TVL snapshots: $MODE ${{ inputs.vault || '' }} [skip ci]"
          git commit -m "$MSG"

          # Backup branch only for manual runs (the expensive full backfills worth
          # protecting). Daily scheduled runs are cheap + idempotent, so skip the
          # ref clutter and just rebase+push with retry like the other crons.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            BACKUP="tvl-snapshots/${{ github.run_id }}"
            git push origin "HEAD:refs/heads/$BACKUP" && echo "Backup branch pushed: $BACKUP"
          fi

          # Same rule as the other collectors: rebasing generated JSON lands in a
          # conflict, and aborting it leaves the local commit behind origin, so
          # every retry repeats the identical failure and the run drops its
          # snapshot entirely. Reset onto origin and replay our own files.
          BRANCH="${{ github.ref_name }}"
          KEEP=$(mktemp -d)
          for f in $FILES; do mkdir -p "$KEEP/$(dirname "$f")"; cp "$f" "$KEEP/$f"; done

          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            echo "push rejected (attempt $i) — replaying generated files onto origin"
            git rebase --abort 2>/dev/null || true
            git merge  --abort 2>/dev/null || true
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            for f in $FILES; do cp "$KEEP/$f" "$f"; done
            # The Stocks file is cut from these snapshots and whatever events
            # just landed (collect.yml): cut it again from both.
            node tools/build-stocks-data.js && git add -f stocks-data.json || true
            node tools/build-tvl-daily.js && git add -f tvl-daily.json || true
            git add -f $FILES
            if git diff --cached --quiet; then echo "Remote already current"; exit 0; fi
            git commit -m "$MSG"
            sleep $((2**i))
          done
          echo "::error::push still failing after retries"
          exit 1
