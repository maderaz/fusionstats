name: Collect DAO Fees

# Each vault's fee rates and the IPOR DAO's share of them, read on-chain
# (collect-dao-fees.js), for Key Metrics' earnings and the Finances pages,
# whose day-by-day file is rebuilt from them here (tools/build-earnings.js).
# Fee terms change rarely: twice a day is plenty. Keyed endpoints (RPC_URL_*)
# go first.

on:
  schedule:
    - cron: '50 */12 * * *'   # every 12 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RPC_URL_ETHEREUM: ${{ secrets.RPC_URL_ETHEREUM }}
      RPC_URL_BASE: ${{ secrets.RPC_URL_BASE }}
      RPC_URL_ARBITRUM: ${{ secrets.RPC_URL_ARBITRUM }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # the branch as it is now, never a re-run's stale commit (see collect.yml)

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read the fee terms
        run: node collect-dao-fees.js

      # The Finances pages' earnings, day by day, with the terms just read.
      - name: Build the Finances pages' earnings
        continue-on-error: true
        run: node tools/build-earnings.js

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in dao-fees.json earnings-daily.json; do
            [ -f "$f" ] && git add -f "$f"
          done
          FILES=$(git diff --cached --name-only)
          if [ -z "$FILES" ]; then echo "No changes"; exit 0; fi
          git commit -m "Update dao-fees.json [skip ci]"

          # Generated data: on rejection, reset onto origin and replay this
          # run's file rather than rebase (see collect-zyfai.yml).
          BRANCH="${{ github.ref_name }}"
          KEEP=$(mktemp -d)
          for f in $FILES; do mkdir -p "$KEEP/$(dirname "$f")"; cp "$f" "$KEEP/$f"; done
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            echo "push rejected (attempt $i) — replaying generated files onto origin"
            git rebase --abort 2>/dev/null || true
            git merge  --abort 2>/dev/null || true
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            for f in $FILES; do cp "$KEEP/$f" "$f"; done
            git add -f $FILES
            if git diff --cached --quiet; then echo "Remote already current"; exit 0; fi
            git commit -m "Update dao-fees.json [skip ci]"
            sleep $((2**i))
          done
          echo "::error::push still failing after retries"
          exit 1
