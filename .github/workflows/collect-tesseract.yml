name: Collect Tesseract Vaults

on:
  schedule:
    - cron: '35 */6 * * *'
  workflow_dispatch:
  push:
    branches: [claude/add-admin-panel-UJ9ZH]
    paths:
      - 'collect-tesseract-*.js'
      - 'lib/keccak.js'
      - '.github/workflows/collect-tesseract.yml'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify keccak vectors
        run: node lib/keccak.test.js

      - name: Discover Tesseract vaults
        run: node collect-tesseract-discover.js

      - name: Commit & push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tesseract-vaults.json tesseract-series.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update Tesseract vault data [skip ci]"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push failed (attempt $i) — re-syncing, retrying in $((2**i))s"
            sleep $((2**i))
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
          done
          exit 1
