name: Collect Rebalances (Daily)

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC
  workflow_dispatch:        # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  rebalances:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # 1h cap; well under GHA's 6h hard limit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Refresh IPOR vault list (for new vaults)
        continue-on-error: true
        run: node collect-ipor-vaults.js

      - name: Scan rebalances across all >$1K vaults
        continue-on-error: true
        run: node collect-rebalances.js --all

      - name: Commit & push rebalance data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f rebalance-events-*.json rebalances-summary.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update rebalance data [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
