name: Collect Rebalances (Daily)

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC
  workflow_dispatch:        # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  rebalances:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # 1h cap; well under GHA's 6h hard limit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Refresh IPOR vault list (for new vaults)
        continue-on-error: true
        run: node collect-ipor-vaults.js

      - name: Scan rebalances across all >$1K vaults
        continue-on-error: true
        run: node collect-rebalances.js --all

      - name: Commit & push rebalance data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f rebalance-events-*.json rebalances-summary.json 2>/dev/null || true
          # Generated data never merges cleanly and never should: the freshest
          # generation supersedes whatever is on the remote. Rebasing it lands
          # in a conflict, and `|| true` then hides that, leaving the repo mid-
          # rebase on a detached HEAD where every later pull and push fails.
          # So on rejection we reset onto origin and replay our own files.
          FILES=$(git diff --cached --name-only)
          if [ -z "$FILES" ]; then echo "No changes"; exit 0; fi
          git commit -m "Update rebalance data [skip ci]"

          BRANCH="${{ github.ref_name }}"
          KEEP=$(mktemp -d)
          for f in $FILES; do mkdir -p "$KEEP/$(dirname "$f")"; cp "$f" "$KEEP/$f"; done

          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            echo "push rejected (attempt $i) — replaying generated files onto origin"
            git rebase --abort 2>/dev/null || true
            git merge  --abort 2>/dev/null || true
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            for f in $FILES; do cp "$KEEP/$f" "$f"; done
            git add -f $FILES
            if git diff --cached --quiet; then echo "Remote already current"; exit 0; fi
            git commit -m "Update rebalance data [skip ci]"
            sleep $((2**i))
          done
          echo "::error::push still failing after retries"
          exit 1
