name: Collect ZyfAI Wallets

on:
  schedule:
    - cron: '20 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch ZyfAI wallets
        run: node collect-zyfai.js

      - name: Commit & push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zyfai-wallets.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update zyfai-wallets.json [skip ci]"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push failed (attempt $i) — re-syncing, retrying in $((2**i))s"
            sleep $((2**i))
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
          done
          exit 1
