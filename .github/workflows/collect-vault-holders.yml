name: Collect Vault Holders

on:
  schedule:
    # Twice daily — incremental scans + mid-scan checkpoints make
    # post-backfill runs seconds per vault, so a second cron is essentially
    # free and gives the chart a fresh right edge by midday.
    - cron: '45 1,13 * * *'
  workflow_dispatch:
    inputs:
      vault:
        description: 'Single vault address (optional)'
        required: false
      chain:
        description: 'Chain filter (optional, e.g. base, arbitrum)'
        required: false
      min-tvl:
        description: 'Override minimum TVL floor in USD (default 1000)'
        required: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # Generous outer cap — per-vault budget inside the collector keeps any
    # single chain from running away. Full fleet sweep currently ~30-90 min.
    timeout-minutes: 290
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Scan vault holders
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.vault }}" ]; then ARGS="$ARGS --vault=${{ github.event.inputs.vault }}"; fi
          if [ -n "${{ github.event.inputs.chain }}" ]; then ARGS="$ARGS --chain=${{ github.event.inputs.chain }}"; fi
          if [ -n "${{ github.event.inputs['min-tvl'] }}" ]; then ARGS="$ARGS --min-tvl=${{ github.event.inputs['min-tvl'] }}"; fi
          node collect-vault-holders.js $ARGS

      - name: Commit & push data files
        # Always run, even if the scan step times out — the collector writes
        # after each vault, so partial progress is worth committing.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vault-holders.json vault-holders-state.json
          # Generated data never merges cleanly and never should: the freshest
          # generation supersedes whatever is on the remote. Rebasing it lands
          # in a conflict, and `|| true` then hides that, leaving the repo mid-
          # rebase on a detached HEAD where every later pull and push fails.
          # So on rejection we reset onto origin and replay our own files.
          FILES=$(git diff --cached --name-only)
          if [ -z "$FILES" ]; then echo "No changes"; exit 0; fi
          git commit -m "Update vault-holders.json [skip ci]"

          BRANCH="${{ github.ref_name }}"
          KEEP=$(mktemp -d)
          for f in $FILES; do mkdir -p "$KEEP/$(dirname "$f")"; cp "$f" "$KEEP/$f"; done

          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            echo "push rejected (attempt $i) — replaying generated files onto origin"
            git rebase --abort 2>/dev/null || true
            git merge  --abort 2>/dev/null || true
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            for f in $FILES; do cp "$KEEP/$f" "$f"; done
            git add -f $FILES
            if git diff --cached --quiet; then echo "Remote already current"; exit 0; fi
            git commit -m "Update vault-holders.json [skip ci]"
            sleep $((2**i))
          done
          echo "::error::push still failing after retries"
          exit 1
