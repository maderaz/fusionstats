# TEMPORARY — verifies the cursor fix against live chains. Does NOT push.
name: TMP verify activity fix

on:
  push:
    branches: [claude/fix-activity-cursor]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Unit tests
        run: node collect-activity.test.js
      - name: Cursor state BEFORE
        run: |
          node -e "
          const ev=require('./activity-events.json'), iv=require('./ipor-vaults.json');
          const c={}; (iv.vaults||[]).forEach(v=>c[(v.address||'').toLowerCase()]=v.chain);
          const g={}; Object.entries(ev.lastBlock).forEach(([k,b])=>{if(k.includes(':'))return;
            const ch=c[k]||'?'; g[ch]=g[ch]||{}; g[ch][b]=(g[ch][b]||0)+1;});
          Object.keys(g).sort().forEach(ch=>console.log(ch.padEnd(10), JSON.stringify(g[ch])));
          console.log('undated events:', (ev.events||[]).filter(e=>!e.timestamp).length);
          "
      - name: Run collector (writes locally only, never pushed)
        # Same cap as prod's collect.yml step — a pass here must mean a pass there.
        timeout-minutes: 8
        run: node collect-activity.js
      - name: Cursor state AFTER
        run: |
          node -e "
          const ev=require('./activity-events.json'), iv=require('./ipor-vaults.json');
          const c={}; (iv.vaults||[]).forEach(v=>c[(v.address||'').toLowerCase()]=v.chain);
          const g={}; Object.entries(ev.lastBlock).forEach(([k,b])=>{if(k.includes(':'))return;
            const ch=c[k]||'?'; g[ch]=g[ch]||{}; g[ch][b]=(g[ch][b]||0)+1;});
          Object.keys(g).sort().forEach(ch=>console.log(ch.padEnd(10), JSON.stringify(g[ch])));
          console.log('undated events:', (ev.events||[]).filter(e=>!e.timestamp).length);
          const V='0x31744e44d6af88225c1dbefbe5df8308faea641b';
          const m=(ev.events||[]).filter(e=>(e.vault||'').toLowerCase()===V&&e.timestamp).sort((a,b)=>b.timestamp-a.timestamp);
          console.log('\nAAPL vault newest dated events:');
          m.slice(0,6).forEach(e=>console.log('  ', new Date(e.timestamp*1000).toISOString().slice(0,16), e.type, 'blk', e.block, 'usd', e.usdValue));
          "
