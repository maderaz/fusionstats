name: Deep Activity Backfill (One-off)

# Manual-only — seeds deep historical user deposit/withdraw events for a
# single vault into activity-events.json. After seeding, the regular 20-min
# Collect Fusion Stats workflow keeps it incremental.

on:
  workflow_dispatch:
    inputs:
      vault:
        description: 'Vault address (0x...)'
        required: true
        default: '0xb8a451107a9f87fde481d4d686247d6e43ed715e'   # stETH looping ethereum
      chain:
        description: 'Chain (ethereum, base, arbitrum, plasma, avalanche, unichain)'
        required: true
        default: 'ethereum'
      from_block:
        description: 'Start block (optional, default = ~24 months back)'
        required: false
        default: ''
      throttle_ms:
        description: 'Min ms between RPC calls per endpoint (higher = safer, slower)'
        required: false
        default: '200'

permissions:
  contents: write

jobs:
  deep-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 350         # under GHA's 6h hard cap, with margin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Refresh IPOR vault list
        continue-on-error: true
        run: node collect-ipor-vaults.js

      - name: Deep historical activity scan
        env:
          RPC_MIN_INTERVAL_MS: ${{ inputs.throttle_ms }}
        run: |
          if [ -n "${{ inputs.from_block }}" ]; then
            node collect-activity.js --deepest ${{ inputs.vault }} ${{ inputs.chain }} ${{ inputs.from_block }}
          else
            node collect-activity.js --deepest ${{ inputs.vault }} ${{ inputs.chain }}
          fi

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f activity-events.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Deep activity backfill: ${{ inputs.vault }} on ${{ inputs.chain }} [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
