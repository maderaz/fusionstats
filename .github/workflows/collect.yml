name: Collect Fusion Stats

on:
  schedule:
    # Every 5 minutes. GitHub Actions silently drops a large fraction of
    # scheduled fires under load (we observed ~70% drop on the prior
    # `0,20,40 * * * *` schedule, leading to 3-5h gaps between successful
    # runs and 160-200 min "min ago" staleness on the frontend). Each run
    # is ~45-90s and idempotent — scheduling more often shrinks the worst
    # tail without piling up concurrent work.
    #
    # Even so, GitHub starts it only 6-7 times a day (late Sep - early Oct
    # 2026: one fire in ~45, every 3-4 hours). Runs started on request are
    # not dropped, so fresher data comes from there: api/refresh.js starts
    # one when the Activity page's Refresh button is pressed, or when the
    # page is opened on data over an hour old.
    - cron: '*/5 * * * *'
  workflow_dispatch:       # manual trigger from GitHub UI, and api/refresh.js

permissions:
  contents: write

# Every workflow that writes activity-events.json or the rebalance files
# shares this group (the deep backfills write both). Without
# it a scheduled run and a backfill overlap — a backfill takes hours — and
# whichever pushes second replays its own copy of the file over the other's,
# silently discarding the events the first one found. Queued, never cancelled
# mid-run: a run that is writing must finish.
concurrency:
  group: event-data-writers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Optional keyed endpoints, tried before the public ones (rpc-endpoints.js).
    # Unset secrets are empty and change nothing.
    env:
      RPC_URL_ETHEREUM: ${{ secrets.RPC_URL_ETHEREUM }}
      RPC_URL_BASE: ${{ secrets.RPC_URL_BASE }}
      RPC_URL_ARBITRUM: ${{ secrets.RPC_URL_ARBITRUM }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch as it is now, not the commit this run was created on.
          # A re-run keeps its run's original commit, so it started from that
          # commit's data files and pushed its result over everything collected
          # since: on Oct 5 a re-run of #3077 put Base back from 12:27 to 09:52.
          # Every workflow that commits data checks out the same way.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Discover vaults from factory
        continue-on-error: true
        run: node collect-vaults.js

      - name: Fetch IPOR canonical vault list
        continue-on-error: true
        run: node collect-ipor-vaults.js

      - name: Run collector
        timeout-minutes: 5
        continue-on-error: true
        run: node collect.js

      - name: Collect vault activity
        timeout-minutes: 8
        continue-on-error: true
        run: node collect-activity.js

      # Where each new stock-vault deposit's tokens came from: a swap through
      # LI.FI (and which app sent it: Jumper), a bridge, another vault, or
      # elsewhere (collect-stock-funding.js), for the Stocks page's routes. A
      # bounded slice a run (90s), newest first; the older ones fill in over runs.
      - name: Read where stock deposits were funded
        timeout-minutes: 3
        continue-on-error: true
        run: node collect-stock-funding.js

      # What the Activity page opens with: the last five weeks of events plus
      # what it needs from all history (tools/build-activity-recent.js), so a
      # visit no longer downloads every event ever collected — and their
      # transaction hashes beside it (activity-recent-tx.json), loaded after
      # the page has drawn. Rebuilt from whatever activity-events.json now
      # holds and committed with it.
      - name: Build the Activity page's recent cache
        continue-on-error: true
        run: node tools/build-activity-recent.js

      # What the Stocks page reads: the stock vaults' share of the vault list,
      # the TVL snapshots, the events and the router names, ~80 KB over the
      # wire instead of the 4.7 MB of the four whole files
      # (tools/build-stocks-data.js).
      - name: Build the Stocks page's data file
        continue-on-error: true
        run: node tools/build-stocks-data.js

      # What the TVL page draws — TVL per network per day — from the vault list
      # just refreshed and the snapshots (tools/build-tvl-daily.js), so it no
      # longer downloads every snapshot of every vault.
      - name: Build the TVL page's daily file
        continue-on-error: true
        run: node tools/build-tvl-daily.js

      # What the Switchers page matches: the events of the wallets that have
      # both deposited and withdrawn, in two vaults or more, ~150 KB over the
      # wire instead of every event (tools/build-switch-events.js), and their
      # transaction hashes in a file of their own, fetched after it draws.
      - name: Build the Switchers page's events
        continue-on-error: true
        run: node tools/build-switch-events.js

      # What the Dust Tracker counts: every deposit under $20K, already marked
      # ZyfAI's or not from zyfai-wallets.json, ~290 KB over the wire instead
      # of every event and ZyfAI's 1.7 MB list (tools/build-dust-events.js);
      # the hashes beside it, fetched when its transaction list opens.
      - name: Build the Dust Tracker's deposits
        continue-on-error: true
        run: node tools/build-dust-events.js

      # The Explorer's Activity tab: each vault's deposits and withdrawals in
      # a file of its own (tools/build-explorer.js --activity), so a vault's
      # page reads its own and not every vault's.
      - name: Build the Explorer's activity files
        continue-on-error: true
        run: node tools/build-explorer.js --activity

      - name: Commit & push data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f history.json logs.json activity-events.json
          [ -f activity-recent.json ] && git add -f activity-recent.json || true
          [ -f activity-recent-tx.json ] && git add -f activity-recent-tx.json || true
          [ -f stocks-data.json ] && git add -f stocks-data.json || true
          [ -f stock-funding.json ] && git add -f stock-funding.json || true
          [ -f tvl-daily.json ] && git add -f tvl-daily.json || true
          [ -f switch-events.json ] && git add -f switch-events.json || true
          [ -f switch-events-tx.json ] && git add -f switch-events-tx.json || true
          [ -f dust-events.json ] && git add -f dust-events.json || true
          [ -f dust-events-tx.json ] && git add -f dust-events-tx.json || true
          [ -d explorer/activity ] && git add -f explorer/activity || true
          [ -f vaults.json ] && git add vaults.json || true
          [ -f ipor-vaults.json ] && git add ipor-vaults.json || true
          # Generated data never merges cleanly and never should: the freshest
          # generation supersedes whatever is on the remote. Rebasing it lands
          # in a conflict, and `|| true` then hides that, leaving the repo mid-
          # rebase on a detached HEAD where every later pull and push fails.
          # So on rejection we reset onto origin and replay our own files.
          FILES=$(git diff --cached --name-only)
          if [ -z "$FILES" ]; then echo "No changes"; exit 0; fi
          git commit -m "Update data files [skip ci]"

          BRANCH="${{ github.ref_name }}"
          KEEP=$(mktemp -d)
          for f in $FILES; do mkdir -p "$KEEP/$(dirname "$f")"; cp "$f" "$KEEP/$f"; done

          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            echo "push rejected (attempt $i) — replaying generated files onto origin"
            git rebase --abort 2>/dev/null || true
            git merge  --abort 2>/dev/null || true
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            for f in $FILES; do cp "$KEEP/$f" "$f"; done
            # The Stocks file is cut from this run's events and whatever TVL
            # snapshots just landed (tvl-snapshots.yml): cut it again from both.
            node tools/build-stocks-data.js && git add -f stocks-data.json || true
            node tools/build-tvl-daily.js && git add -f tvl-daily.json || true
            # The Dust Tracker's deposits are marked from ZyfAI's list, which
            # collect-zyfai.yml may have just updated: mark them again.
            node tools/build-dust-events.js || true
            for f in dust-events.json dust-events-tx.json; do [ -f "$f" ] && git add -f "$f"; done
            git add -f $FILES
            if git diff --cached --quiet; then echo "Remote already current"; exit 0; fi
            git commit -m "Update data files [skip ci]"
            sleep $((2**i))
          done
          echo "::error::push still failing after retries"
          exit 1

      # The activity step cannot fail the run — one chain's bad day must not cost
      # every other chain its data — so until now nothing ever did: Base stalled
      # for five days and Ethereum for three weeks with every run green. This
      # runs after the commit, and fails the job when a chain holding real money
      # is stalled, unreachable or days behind, so GitHub sends its failure
      # notice. The run summary shows each chain and any vault whose events no
      # longer explain its supply.
      - name: Check collection health
        run: node tools/check-collection-health.js
