name: Collect Fusion Stats

on:
  schedule:
    - cron: '0,30 * * * *'  # every 30 minutes
  workflow_dispatch:       # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run collector
        run: node collect.js

      - name: Collect vault activity
        run: node collect-activity.js

      - name: Commit & push data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json logs.json activity-events.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update history.json + logs.json [skip ci]"
          git push
