name: Collect Fusion Stats

on:
  schedule:
    - cron: '0,20,40 * * * *'  # every 20 minutes
  workflow_dispatch:       # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Discover vaults from factory
        continue-on-error: true
        run: node collect-vaults.js

      - name: Fetch IPOR canonical vault list
        continue-on-error: true
        run: node collect-ipor-vaults.js

      - name: Run collector
        timeout-minutes: 5
        continue-on-error: true
        run: node collect.js

      - name: Collect vault activity
        timeout-minutes: 8
        continue-on-error: true
        run: node collect-activity.js

      - name: Collect rebalances (stETH playground)
        timeout-minutes: 5
        continue-on-error: true
        run: node collect-rebalances.js 0xb8a451107a9f87fde481d4d686247d6e43ed715e ethereum 50000

      - name: Commit & push data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f history.json logs.json activity-events.json
          git add -f rebalance-events-*.json 2>/dev/null || true
          [ -f vaults.json ] && git add vaults.json || true
          [ -f ipor-vaults.json ] && git add ipor-vaults.json || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update data files [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
