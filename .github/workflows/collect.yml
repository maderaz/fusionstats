name: Collect Fusion Stats

on:
  schedule:
    # Every 5 minutes. GitHub Actions silently drops a large fraction of
    # scheduled fires under load (we observed ~70% drop on the prior
    # `0,20,40 * * * *` schedule, leading to 3-5h gaps between successful
    # runs and 160-200 min "min ago" staleness on the frontend). Each run
    # is ~45-90s and idempotent — scheduling more often shrinks the worst
    # tail without piling up concurrent work.
    - cron: '*/5 * * * *'
  workflow_dispatch:       # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Discover vaults from factory
        continue-on-error: true
        run: node collect-vaults.js

      - name: Fetch IPOR canonical vault list
        continue-on-error: true
        run: node collect-ipor-vaults.js

      - name: Run collector
        timeout-minutes: 5
        continue-on-error: true
        run: node collect.js

      - name: Collect vault activity
        timeout-minutes: 8
        continue-on-error: true
        run: node collect-activity.js

      - name: Commit & push data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f history.json logs.json activity-events.json
          [ -f vaults.json ] && git add vaults.json || true
          [ -f ipor-vaults.json ] && git add ipor-vaults.json || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update data files [skip ci]"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          # Retry with backoff: GitHub occasionally rejects a ref update with a
          # transient "fatal error in commit_refs"; a re-pull + retry clears it
          # (and also resolves a race with another cron pushing meanwhile).
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push failed (attempt $i) — re-syncing, retrying in $((2**i))s"
            sleep $((2**i))
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
          done
          echo "::error::push still failing after retries"
          exit 1
