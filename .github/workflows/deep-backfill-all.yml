name: Deep Backfill ALL Vaults (One-off)

# Manual-only — sequentially seeds deep historical data for every >$1K
# Fusion vault. After the seed, the daily/incremental crons keep things
# fresh.
#
# Recommended sequence:
#   1. Run with mode = "rebalances" (~2-3h)
#   2. After it finishes, run with mode = "activity" (~2-3h)
#   3. (Or run "both" if you want one button press, ~4-5h, watch the timeout)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to scan'
        required: true
        default: 'rebalances'
        type: choice
        options:
          - rebalances
          - activity
          - both
      chain:
        description: 'Limit to one chain (leave blank for all chains)'
        required: false
        default: ''
      throttle_ms:
        description: 'Min ms between RPC calls per endpoint (higher = safer, slower)'
        required: false
        default: '250'

permissions:
  contents: write

jobs:
  deep-all:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # safely under GHA's 6h hard cap
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Refresh IPOR vault list
        continue-on-error: true
        run: node collect-ipor-vaults.js

      - name: Refresh recent activity (used to filter rebalance flows)
        if: ${{ inputs.mode == 'rebalances' || inputs.mode == 'both' }}
        continue-on-error: true
        timeout-minutes: 10
        run: node collect-activity.js

      - name: Deep activity scan — all vaults
        if: ${{ inputs.mode == 'activity' || inputs.mode == 'both' }}
        continue-on-error: true
        env:
          RPC_MIN_INTERVAL_MS: ${{ inputs.throttle_ms }}
        run: node collect-activity.js --deepest-all ${{ inputs.chain }}

      - name: Deep rebalance scan — all vaults
        if: ${{ inputs.mode == 'rebalances' || inputs.mode == 'both' }}
        continue-on-error: true
        env:
          RPC_MIN_INTERVAL_MS: ${{ inputs.throttle_ms }}
        run: node collect-rebalances.js --deepest-all ${{ inputs.chain }}

      - name: Commit & push results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f activity-events.json rebalance-events-*.json rebalances-summary.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Deep backfill ALL vaults [mode=${{ inputs.mode }}, chain=${{ inputs.chain || 'all' }}] [skip ci]"

          # Preserve the result on the remote BEFORE rebasing, so a conflict can never
          # discard 3-4h of work the way run #1 did.
          BACKUP="deep-backfill/${{ github.run_id }}"
          git push origin "HEAD:refs/heads/$BACKUP"
          echo "Backup branch pushed: $BACKUP"

          # Now try to land on the working branch. -X theirs favors the just-computed
          # backfill data on conflict (it's a strict superset of recent cron output
          # for the windows it scanned).
          git fetch origin ${{ github.ref_name }}
          if ! git -c rebase.autoStash=true rebase -X theirs origin/${{ github.ref_name }}; then
            git rebase --abort || true
            echo "::warning::Rebase failed; result preserved on branch $BACKUP — merge manually."
            exit 1
          fi
          # A push that never lands must not report success: the backfill would be
          # silently lost while the run went green. The backup branch above still
          # holds the result either way.
          PUSHED=no
          for i in 1 2 3 4; do
            if git push; then PUSHED=yes; break; fi
            git fetch origin ${{ github.ref_name }} || true
            sleep $((2**i))
          done
          if [ "$PUSHED" != "yes" ]; then
            echo "::error::push never landed — result is preserved on branch $BACKUP"
            exit 1
          fi
