# TEMPORARY — replays production's failing eth_getLogs requests from Actions,
# where the endpoints are reachable. Read-only, pushes nothing. Delete when done.
name: TMP getLogs probe

on:
  push:
    branches: [claude/eth-getlogs-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Replay production's Ethereum requests, and check Plasma endpoints
        run: node tools/getlogs-probe.js
