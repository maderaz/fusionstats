name: Collect FE APY

on:
  schedule:
    # Hourly is plenty — the APR moves with markets but the fee adjustment
    # rarely changes, and the front end cache-busts to a 2-minute bucket, so
    # an hourly refresh keeps the column fresh without burning runners.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      apr-scale:
        description: 'Force APR interpretation: fraction | percent (optional, auto-detected by default)'
        required: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Collect FE APY
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs['apr-scale'] }}" ]; then ARGS="$ARGS --apr-scale=${{ github.event.inputs['apr-scale'] }}"; fi
          node collect-fe-apy.js $ARGS

      - name: Commit & push data files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fe-apy.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update fe-apy.json [skip ci]"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push failed (attempt $i) — re-syncing, retrying in $((2**i))s"
            sleep $((2**i))
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
          done
          echo "::error::push still failing after retries"
          exit 1
