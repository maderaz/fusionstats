name: Collect FE APY

on:
  schedule:
    # Hourly is plenty — the APR moves with markets but the fee adjustment
    # rarely changes, and the front end cache-busts to a 2-minute bucket, so
    # an hourly refresh keeps the column fresh without burning runners.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      apr-scale:
        description: 'Force APR interpretation: fraction | percent (optional, auto-detected by default)'
        required: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Collect FE APY
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs['apr-scale'] }}" ]; then ARGS="$ARGS --apr-scale=${{ github.event.inputs['apr-scale'] }}"; fi
          node collect-fe-apy.js $ARGS

      - name: Commit & push data files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fe-apy.json
          # Generated data never merges cleanly and never should: the freshest
          # generation supersedes whatever is on the remote. Rebasing it lands
          # in a conflict, and `|| true` then hides that, leaving the repo mid-
          # rebase on a detached HEAD where every later pull and push fails.
          # So on rejection we reset onto origin and replay our own files.
          FILES=$(git diff --cached --name-only)
          if [ -z "$FILES" ]; then echo "No changes"; exit 0; fi
          git commit -m "Update fe-apy.json [skip ci]"

          BRANCH="${{ github.ref_name }}"
          KEEP=$(mktemp -d)
          for f in $FILES; do mkdir -p "$KEEP/$(dirname "$f")"; cp "$f" "$KEEP/$f"; done

          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            echo "push rejected (attempt $i) — replaying generated files onto origin"
            git rebase --abort 2>/dev/null || true
            git merge  --abort 2>/dev/null || true
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            for f in $FILES; do cp "$KEEP/$f" "$f"; done
            git add -f $FILES
            if git diff --cached --quiet; then echo "Remote already current"; exit 0; fi
            git commit -m "Update fe-apy.json [skip ci]"
            sleep $((2**i))
          done
          echo "::error::push still failing after retries"
          exit 1
