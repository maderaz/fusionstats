<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
  <script src="/data-source.js"></script>
  <script>window.FusionData && FusionData.preload(['ipor-vaults.json', 'vaults.json', 'tvl-latest.json']);</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Vaults — Fusion Stats</title>
  <meta name="description" content="Every Fusion vault discovered across all chains: TVL, network, asset, deployment date.">
  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9A%9B%EF%B8%8F</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ui.css">
  <script src="/nav.js"></script>
  <style>
    /* ---------- The list: one grid, a table on a desktop, two lines on a phone ---------- */
    .vlist { --cols: minmax(0, 2.5fr) minmax(0, 1.1fr) minmax(0, 0.9fr) minmax(0, 1fr) minmax(0, 1.15fr) 96px; }
    .vhead, .vrow {
      display: grid;
      grid-template-columns: var(--cols);
      align-items: center;
      column-gap: 16px;
    }
    .vhead {
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 12px; font-weight: 500; color: var(--text-3);
    }
    .vhead button {
      justify-self: start;
      padding: 0; border: 0; background: none;
      font: inherit; color: inherit;
      cursor: pointer;
      transition: color 0.15s;
    }
    .vhead button:hover, .vhead button.sorted { color: var(--text); }
    .vhead .num, .vrow .tvl { justify-self: end; text-align: right; }
    .vhead .arrow { margin-left: 3px; font-size: 10px; }
    .vrow {
      position: relative;
      min-height: 60px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .vrow:hover { background: linear-gradient(90deg, transparent, var(--bg-subtle) 4%, var(--bg-subtle) 96%, transparent); }
    .vname { min-width: 0; }
    .vname b {
      display: block;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-weight: 500; color: var(--text);
    }
    .vname .ui-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vrow .tvl { font-weight: 600; font-variant-numeric: tabular-nums; }
    .vrow .tvl.none, .vrow .date.none { color: var(--text-3); font-weight: 400; }
    .vrow .date { font-size: 13.5px; color: var(--text-2); white-space: nowrap; }
    .vrow .addr { color: var(--text-2); }
    .vrow .addr a { color: inherit; text-decoration: none; }
    .vrow .addr a:hover { color: var(--accent); }
    .vlinks { display: flex; justify-content: flex-end; gap: 6px; }
    .vlinks a {
      display: inline-flex; align-items: center; height: 28px; padding: 0 9px;
      border: 1px solid var(--line); border-radius: 8px;
      font-size: 12.5px; font-weight: 500; color: var(--text-2); text-decoration: none;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .vlinks a:hover { color: var(--accent); border-color: var(--line-strong); background: var(--bg); }
    .vtag { color: var(--text-2); }

    /* Phone: name and TVL, then network · asset · date, then the links. */
    @container (max-width: 700px) {
      .vhead { display: none; }
      .vrow {
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas: "name tvl" "meta links";
        row-gap: 6px;
        min-height: 0;
        padding: 12px 0;
      }
      .vrow:hover { background: none; }
      .vname { grid-area: name; }
      .vrow .tvl { grid-area: tvl; align-self: start; font-size: 15px; }
      .vrow .vchain, .vrow .date, .vrow .addr { display: none; }
      .vmeta { grid-area: meta; display: flex !important; align-items: center; gap: 8px; min-width: 0; font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; }
      .vlinks { grid-area: links; align-self: center; }
      .vlinks a { height: 26px; padding: 0 8px; font-size: 12px; }
      .vname .ui-sub { display: none; }
    }
    .vmeta { display: none; }
    .vmeta .dot { color: var(--line-strong); }
  </style>
  <script defer src="/track.js"></script>
</head>
<body>
  <div class="ui-page">
    <header class="ui-masthead">
      <div>
        <h1>All Vaults</h1>
        <p class="ui-lede">Every Fusion vault discovered across all chains.</p>
        <div class="ui-status" id="status"></div>
      </div>
    </header>

    <div class="ui-figures" style="--n:4">
      <div class="ui-figure"><div class="k">Vaults</div><div class="v" id="fVaults"></div><div class="s" id="fVaultsSub">&nbsp;</div></div>
      <div class="ui-figure"><div class="k">Holding capital</div><div class="v" id="fFunded"></div><div class="s">TVL of $1K or more</div></div>
      <div class="ui-figure"><div class="k">Total TVL <span class="ui-tip" tabindex="0" data-tip="Every vault's TVL added up: its latest on-chain snapshot (totalAssets × price), or IPOR's figure for a vault not snapshotted yet.">ⓘ</span></div><div class="v" id="fTvl"></div><div class="s">all vaults</div></div>
      <div class="ui-figure"><div class="k">Networks</div><div class="v" id="fChains"></div><div class="s" id="fChainsSub">&nbsp;</div></div>
    </div>

    <section class="ui-section">
      <div class="ui-toolbar">
        <div class="ui-filters" style="--cols: 3">
          <label class="ui-filter wide full">
            <span class="ui-filter-label">Search</span>
            <input type="search" id="q" placeholder="Name, asset or address" autocomplete="off" spellcheck="false">
          </label>
          <label class="ui-filter">
            <span class="ui-filter-label">Network</span>
            <select id="chain" data-fs><option value="" data-glyph="all" data-short="All">All networks</option></select>
          </label>
          <label class="ui-filter">
            <span class="ui-filter-label">TVL</span>
            <select id="minTvl" data-fs>
              <option value="0">Any</option>
              <option value="1000">≥ $1K</option>
              <option value="100000">≥ $100K</option>
              <option value="1000000">≥ $1M</option>
            </select>
          </label>
          <label class="ui-filter">
            <span class="ui-filter-label">Sort</span>
            <select id="sort" data-fs>
              <option value="tvl:desc" data-short="TVL">TVL, highest first</option>
              <option value="name:asc" data-short="Name">Name, A–Z</option>
              <option value="deployedAt:desc" data-short="Newest">Newest first</option>
              <option value="deployedAt:asc" data-short="Oldest">Oldest first</option>
              <option value="chain:asc" data-short="Network">Network, A–Z</option>
              <option value="ticker:asc" data-short="Asset">Asset, A–Z</option>
            </select>
          </label>
        </div>
      </div>
      <div class="vlist" id="list"><div class="ui-empty">Loading vaults…</div></div>
      <div id="pager"></div>
    </section>
  </div>

  <script src="/fusion-select.js"></script>
  <script src="/ui.js"></script>
  <script>
  (function () {
    const PAGE = 25;
    // Block explorers per network.
    const EXPLORERS = {
      ethereum: 'https://etherscan.io/address/',
      arbitrum: 'https://arbiscan.io/address/',
      base: 'https://basescan.org/address/',
      unichain: 'https://uniscan.xyz/address/',
      plasma: 'https://plasmascan.to/address/',
      avalanche: 'https://snowtrace.io/address/',
      tac: 'https://explorer.tac.build/address/',
      ink: 'https://explorer.inkonchain.com/address/',
      katana: 'https://explorer.katanarpc.com/address/',
    };
    // Mainnet block time, for a deployment date from a block number where
    // the factory file stores no date (Ethereum vaults only).
    const ETH_AVG_BLOCK_TIME_S = 12;
    // No Fusion vault is near $2B: a snapshot above it is a decimals error.
    const MAX_SANE_TVL = 2e9;
    const esc = UI.esc;

    function formatDate(iso) {
      if (!iso) return null;
      try { return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }); }
      catch { return null; }
    }
    function formatTvl(v) {
      if (v == null || v === 0) return null;
      if (v >= 1e9) return '$' + (v / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
      if (v >= 1e6) return '$' + (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
      if (v >= 1e3) return '$' + Math.round(v / 1e3) + 'K';
      return '$' + Math.round(v);
    }
    const explorerUrl = (chain, addr) => (EXPLORERS[chain] ? EXPLORERS[chain] + addr : null);

    let all = [], page = 1;
    const S = { q: '', chain: '', minTvl: 0, sortKey: 'tvl', sortDir: 'desc' };

    const getJson = (f) => fetch(f).then(r => (r.ok ? r.json() : null)).catch(() => null);

    // Each vault's latest on-chain TVL. tvl-latest.json carries it ready
    // (tools/build-tvl-latest.js); before that file exists, the same rule is
    // run over the whole snapshot history.
    async function latestTvl() {
      const small = await getJson('tvl-latest.json');
      if (small && small.vaults) return small.vaults;
      const snap = await getJson('tvl-snapshots.json');
      const out = {};
      for (const [addr, v] of Object.entries((snap && snap.vaults) || {})) {
        const series = (v.snapshots || []).filter(s => typeof s.tvlUsd === 'number' && s.tvlUsd >= 0 && s.tvlUsd < MAX_SANE_TVL);
        if (series.length) out[addr.toLowerCase()] = series[series.length - 1].tvlUsd;
      }
      return out;
    }

    async function loadData() {
      const [ipor, factory, snapTvl] = await Promise.all([getJson('ipor-vaults.json'), getJson('vaults.json'), latestTvl()]);
      // The latest snapshot beats IPOR's figure, which can be stale.
      const bestTvl = (addr, apiTvl) => {
        const s = snapTvl[(addr || '').toLowerCase()];
        return typeof s === 'number' ? s : (apiTvl || 0);
      };
      // Deployment dates from the factory file (Ethereum).
      const deployed = {};
      if (factory && Array.isArray(factory.vaults)) {
        const refBlock = factory.lastBlock;
        const refTimeMs = factory.updatedAt ? new Date(factory.updatedAt).getTime() : Date.now();
        for (const v of factory.vaults) {
          if (!v.address) continue;
          let d = v.deployedAt || null;
          if (!d && v.block && refBlock) d = new Date(refTimeMs - (refBlock - v.block) * ETH_AVG_BLOCK_TIME_S * 1000).toISOString();
          if (d) deployed[v.address.toLowerCase()] = d;
        }
      }
      let vaults = [];
      if (ipor && Array.isArray(ipor.vaults)) {
        vaults = ipor.vaults.map(v => ({
          chain: v.chain || 'unknown',
          name: v.name || '(unnamed)',
          ticker: v.token || v.symbol || '?',
          address: (v.address || '').toLowerCase(),
          tvl: bestTvl(v.address, v.tvl),
          deployedAt: deployed[(v.address || '').toLowerCase()] || null,
        }));
      } else if (factory && Array.isArray(factory.vaults)) {
        vaults = factory.vaults.map(v => ({
          chain: 'ethereum', name: v.name || '(unnamed)', ticker: v.symbol || '?',
          address: (v.address || '').toLowerCase(), tvl: 0,
          deployedAt: deployed[(v.address || '').toLowerCase()] || null,
        }));
      }
      return { vaults, updatedAt: ipor && ipor.updatedAt };
    }

    function filtered() {
      const q = S.q.trim().toLowerCase();
      return all.filter(v => {
        if (S.chain && v.chain !== S.chain) return false;
        if (S.minTvl && !(v.tvl >= S.minTvl)) return false;
        if (q && !(v.name + ' ' + v.ticker + ' ' + v.address).toLowerCase().includes(q)) return false;
        return true;
      });
    }
    function sorted(vaults) {
      const key = S.sortKey, dir = S.sortDir === 'asc' ? 1 : -1;
      return vaults.slice().sort((a, b) => {
        let av = a[key], bv = b[key];
        // A missing value (no date, no TVL) always sinks to the bottom.
        if (key === 'deployedAt' || key === 'tvl') {
          const am = key === 'tvl' ? !(av > 0) : !av, bm = key === 'tvl' ? !(bv > 0) : !bv;
          if (am && bm) return 0;
          if (am) return 1;
          if (bm) return -1;
        }
        if (av == null) av = '';
        if (bv == null) bv = '';
        if (typeof av === 'string') av = av.toLowerCase();
        if (typeof bv === 'string') bv = bv.toLowerCase();
        return av < bv ? -dir : av > bv ? dir : 0;
      });
    }

    function renderFigures() {
      const chains = [...new Set(all.map(v => v.chain))];
      const funded = all.filter(v => v.tvl >= 1000).length;
      const tvl = all.reduce((a, v) => a + (v.tvl > 0 ? v.tvl : 0), 0);
      document.getElementById('fVaults').textContent = all.length.toLocaleString('en-US');
      document.getElementById('fVaultsSub').textContent = all.filter(v => v.tvl > 0).length + ' with any TVL';
      document.getElementById('fFunded').textContent = funded.toLocaleString('en-US');
      document.getElementById('fTvl').textContent = UI.usd(tvl);
      document.getElementById('fChains').textContent = chains.length;
      const top = chains.map(c => [c, all.filter(v => v.chain === c).reduce((a, v) => a + (v.tvl > 0 ? v.tvl : 0), 0)])
        .sort((a, b) => b[1] - a[1]).slice(0, 2).map(([c]) => FusionSelect.chainName(c));
      document.getElementById('fChainsSub').textContent = top.length ? 'most in ' + top.join(' and ') : '';
    }

    const HEADS = [['name', 'Vault', ''], ['chain', 'Network', ''], ['tvl', 'TVL', 'num'], ['deployedAt', 'Deployed', ''], [null, 'Address', ''], [null, '', 'num']];
    function render() {
      const list = sorted(filtered());
      const last = Math.max(1, Math.ceil(list.length / PAGE));
      page = Math.min(Math.max(1, page), last);
      const shown = list.slice((page - 1) * PAGE, page * PAGE);
      const el = document.getElementById('list');
      if (!list.length) {
        el.innerHTML = '<div class="ui-empty">No vaults match these filters.</div>';
        document.getElementById('pager').innerHTML = '';
        return;
      }
      const head = '<div class="vhead" role="row">' + HEADS.map(([k, label, cls]) => {
        if (!k) return `<span class="${cls}">${label}</span>`;
        const on = S.sortKey === k;
        const arrow = on ? `<span class="arrow" aria-hidden="true">${S.sortDir === 'asc' ? '▲' : '▼'}</span>` : '';
        return `<button type="button" class="${cls}${on ? ' sorted' : ''}" data-sort="${k}" aria-sort="${on ? (S.sortDir === 'asc' ? 'ascending' : 'descending') : 'none'}">${label}${arrow}</button>`;
      }).join('') + '</div>';
      const rows = shown.map(v => {
        const ex = explorerUrl(v.chain, v.address);
        const addr = ex ? `<a href="${ex}" target="_blank" rel="noopener">${UI.short(v.address)}</a>` : UI.short(v.address);
        const date = formatDate(v.deployedAt);
        const tvl = formatTvl(v.tvl);
        const app = `https://app.ipor.io/fusion/${v.chain}/${v.address}`;
        return `<div class="vrow" data-address="${v.address}">
          <div class="vname"><b title="${esc(v.name)}">${esc(v.name)}</b><span class="ui-sub"><span class="vtag">${esc(v.ticker)}</span></span></div>
          <div class="vchain">${UI.chain(v.chain)}</div>
          <div class="tvl${tvl ? '' : ' none'}">${tvl || '—'}</div>
          <div class="date${date ? '' : ' none'}">${date || '—'}</div>
          <div class="addr ui-mono">${addr}</div>
          <div class="vmeta">${UI.chain(v.chain)}<span class="dot">·</span><span class="vtag">${esc(v.ticker)}</span>${date ? `<span class="dot">·</span><span>${date}</span>` : ''}</div>
          <div class="vlinks"><a href="/address/?a=${v.address}" title="This vault's stats">Stats</a><a href="${app}" target="_blank" rel="noopener" title="Open in the IPOR app">App ↗</a></div>
        </div>`;
      }).join('');
      el.innerHTML = head + rows;
      document.getElementById('pager').innerHTML = UI.pager({ total: list.length, page, size: PAGE, noun: list.length === 1 ? 'vault' : 'vaults' });
    }

    function populateChains() {
      const sel = document.getElementById('chain');
      const counts = {};
      all.forEach(v => { counts[v.chain] = (counts[v.chain] || 0) + 1; });
      const chains = Object.keys(counts).sort((a, b) => FusionSelect.chainName(a).localeCompare(FusionSelect.chainName(b)));
      sel.innerHTML = '<option value="" data-glyph="all" data-short="All">All networks</option>' + chains.map(c => {
        const name = FusionSelect.chainName(c);
        return `<option value="${esc(c)}" data-chain="${esc(c)}" data-label="${esc(name)}" data-note="${counts[c]}">${esc(name)} (${counts[c]})</option>`;
      }).join('');
    }

    // Controls.
    let typing;
    document.getElementById('q').addEventListener('input', (e) => {
      clearTimeout(typing);
      typing = setTimeout(() => { S.q = e.target.value; page = 1; render(); }, 120);
    });
    document.getElementById('chain').addEventListener('change', (e) => { S.chain = e.target.value; page = 1; render(); });
    document.getElementById('minTvl').addEventListener('change', (e) => { S.minTvl = +e.target.value || 0; page = 1; render(); });
    const sortSel = document.getElementById('sort');
    sortSel.addEventListener('change', () => {
      const [k, d] = sortSel.value.split(':'); S.sortKey = k; S.sortDir = d; page = 1; render();
    });
    // A column heading sorts by it; a second click turns it round.
    document.getElementById('list').addEventListener('click', (e) => {
      const b = e.target.closest('.vhead button[data-sort]');
      if (!b) return;
      const k = b.dataset.sort;
      if (S.sortKey === k) S.sortDir = S.sortDir === 'asc' ? 'desc' : 'asc';
      else { S.sortKey = k; S.sortDir = (k === 'deployedAt' || k === 'tvl') ? 'desc' : 'asc'; }
      const v = S.sortKey + ':' + S.sortDir;
      if ([...sortSel.options].some(o => o.value === v)) sortSel.value = v;
      page = 1; render();
    });
    UI.onPage(document.getElementById('pager'), (n) => {
      page = n; render();
      const top = document.getElementById('list').getBoundingClientRect().top;
      if (top < 0) document.getElementById('list').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    loadData().then(({ vaults, updatedAt }) => {
      all = vaults;
      if (!all.length) throw new Error('no vault list');
      populateChains();
      renderFigures();
      render();
      if (updatedAt) document.getElementById('status').innerHTML = 'Vault list updated <b>'
        + esc(new Date(updatedAt).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })) + '</b>';
    }).catch(err => {
      console.error(err);
      document.getElementById('list').innerHTML = '<div class="ui-error">Could not load the vault list: ' + esc(err.message) + '</div>';
    });
  })();
  </script>
</body>
</html>
