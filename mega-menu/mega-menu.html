<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Mega menu demo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- Optional: the font the design was made with. Remove to use the system font. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* =============================================================================
   MEGA MENU — a top bar whose items open white panels ("bubbles") of icon
   links on hover, tap or Enter, and fold into a sheet on phones.
   Everything you might want to change is in these variables.
   ============================================================================= */
:root {
  --mm-bar-bg: #2C0C55;          /* the top bar */
  --mm-bar-line: #4C247F;        /* its bottom hairline */
  --mm-bar-text: #E2CDFE;        /* menu labels */
  --mm-bar-hover: #351363;       /* a label's hover / open background */
  --mm-accent: #8429FF;          /* icons, highlights */
  --mm-accent-soft: #F3EDFF;     /* tag background */
  --mm-panel-bg: #FFFFFF;        /* the bubble */
  --mm-panel-line: #E8E1F3;      /* its border and the icon boxes */
  --mm-panel-hover: #FAF7FF;     /* a link's hover */
  --mm-ink: #160A2B;             /* titles in the bubble */
  --mm-ink-soft: #7A6F8C;        /* descriptions */
  --mm-feature-bg: #2C0C55;      /* the optional feature card */
  --mm-feature-k: #B794E6;
  --mm-font: Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mm-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --mm-height: 68px;             /* bar height */
  --mm-max: 1200px;              /* content width */
  --mm-collapse: 980px;          /* below this the menus fold into the sheet (also change the @media below) */
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--mm-font); background: #F7F5FB; }

.mm { position: sticky; top: 0; z-index: 50; background: var(--mm-bar-bg); color: #FFFFFF; border-bottom: 1px solid var(--mm-bar-line); }
.mm-in { display: flex; align-items: center; gap: 24px; height: var(--mm-height); max-width: var(--mm-max); margin: 0 auto; padding: 0 32px; }
.mm-brand { display: inline-flex; align-items: center; gap: 10px; color: #FFFFFF; font-size: 18px; font-weight: 600; letter-spacing: -0.03em; text-decoration: none; white-space: nowrap; }
.mm-brand svg { width: 28px; height: 28px; }

/* The top-level items. */
.mm-menu { display: flex; align-items: stretch; gap: 4px; height: 100%; margin: 0 0 0 16px; padding: 0; list-style: none; }
.mm-item { position: relative; display: flex; align-items: center; }
.mm-item > button {
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border: 0; border-radius: 8px;
  background: transparent; color: var(--mm-bar-text); font: 500 14.5px/1 var(--mm-font); white-space: nowrap; cursor: pointer;
  transition: background .15s ease, color .15s ease;
}
.mm-item > button svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s ease; }
.mm-item:hover > button, .mm-item.open > button, .mm-item > button:focus-visible { background: var(--mm-bar-hover); color: #FFFFFF; outline: none; }
.mm-item:hover > button svg, .mm-item.open > button svg { transform: rotate(180deg); }

/* The bubble hangs from the bar. Its top padding is an invisible bridge, so
   the pointer can travel down into it without the menu closing. */
.mm-panel { position: absolute; top: 100%; left: -12px; padding-top: 14px; opacity: 0; visibility: hidden; transform: translateY(6px);
  transition: opacity .18s ease, transform .18s ease, visibility 0s linear .18s; }
.mm-item:hover > .mm-panel, .mm-item.open > .mm-panel, .mm-item:focus-within > .mm-panel {
  opacity: 1; visibility: visible; transform: none; transition: opacity .18s ease, transform .18s ease; }
.mm-item.right > .mm-panel { left: auto; right: -12px; }   /* items near the right edge open leftwards */
.mm-box { display: flex; gap: 6px; padding: 10px; border: 1px solid var(--mm-panel-line); border-radius: 14px; background: var(--mm-panel-bg); color: var(--mm-ink);
  box-shadow: 0 24px 60px rgba(20, 4, 43, .35); }
.mm-group { grid-column: 1 / -1; padding: 10px 12px 2px; font: 500 11px/1 var(--mm-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mm-ink-soft); white-space: nowrap; }

.mm-links { display: grid; gap: 6px; align-content: start; }
.mm-feature { flex: none; width: 230px; }

/* A link: icon box, title (with an optional tag), one-line description. */
.mm-link { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-radius: 10px; color: inherit; text-decoration: none; transition: background .15s ease; }
.mm-link:hover, .mm-link:focus-visible { background: var(--mm-panel-hover); outline: none; }
.mm-ic { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--mm-panel-line); border-radius: 8px; background: #FFFFFF; color: var(--mm-accent); }
.mm-ic svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.mm-t { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; }
.mm-tag { display: inline-block; margin-left: 8px; padding: 2px 6px; border-radius: 5px; background: var(--mm-accent-soft); color: var(--mm-accent);
  font: 600 10px/1.3 var(--mm-mono); letter-spacing: .06em; vertical-align: 1px; }
.mm-d { display: block; margin-top: 3px; font-size: 12.5px; line-height: 1.45; color: var(--mm-ink-soft); }

/* The optional feature card, a column of its own at the right of a bubble. */
.mm-feature { display: flex; flex-direction: column; padding: 18px; border-radius: 10px; background: var(--mm-feature-bg); color: #FFFFFF; text-decoration: none; }
.mm-feature .k { margin-bottom: 14px; font: 500 11px/1 var(--mm-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mm-feature-k); }
.mm-feature b { font-size: 30px; font-weight: 600; letter-spacing: -0.05em; white-space: nowrap; }
.mm-feature p { flex: 1; margin: 8px 0 18px; font-size: 13px; line-height: 1.5; opacity: .85; }
.mm-feature em { font: 500 11px/1 var(--mm-mono); font-style: normal; letter-spacing: .08em; text-transform: uppercase; color: var(--mm-feature-k); }

.mm-end { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.mm-cta { display: inline-flex; align-items: center; height: 40px; padding: 0 18px; border-radius: 10px; font: 600 14px/1 var(--mm-font); text-decoration: none; white-space: nowrap; }
.mm-cta.solid { background: #FFFFFF; color: var(--mm-bar-bg); }
.mm-cta.ghost { color: var(--mm-bar-text); }
.mm-burger { display: none; place-items: center; width: 40px; height: 40px; padding: 0; border: 1px solid var(--mm-bar-line); border-radius: 10px; background: transparent; color: #FFFFFF; cursor: pointer; }
.mm-burger svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.mm-burger .x, .mm.sheet .mm-burger .b { display: none; }
.mm.sheet .mm-burger .x { display: block; }

/* The phone sheet: the same menus, each a fold. */
.mm-sheet { display: none; }
@media (max-width: 980px) {
  .mm-menu, .mm-cta.ghost { display: none; }
  .mm-burger { display: grid; }
  .mm-in { padding: 0 16px; }
  .mm.sheet .mm-sheet { display: block; }
  .mm-sheet { position: absolute; left: 0; right: 0; top: 100%; max-height: calc(100vh - var(--mm-height)); overflow-y: auto;
    padding: 4px 16px 24px; background: var(--mm-bar-bg); border-bottom: 1px solid var(--mm-bar-line); }
  .mm-sheet details { border-bottom: 1px solid var(--mm-bar-line); }
  .mm-sheet summary { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; list-style: none; font-size: 17px; font-weight: 600; cursor: pointer; }
  .mm-sheet summary::-webkit-details-marker { display: none; }
  .mm-sheet summary svg { width: 12px; height: 12px; fill: none; stroke: var(--mm-feature-k); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s ease; }
  .mm-sheet details[open] summary svg { transform: rotate(180deg); }
  .mm-sheet .mm-link { padding: 10px 0; }
  .mm-sheet .mm-link:hover { background: transparent; }
  .mm-sheet .mm-ic { background: rgba(255,255,255,.06); border-color: var(--mm-bar-line); color: #D7B8FF; }
  .mm-sheet .mm-t { color: #FFFFFF; }
  .mm-sheet .mm-d { color: var(--mm-feature-k); }
  .mm-sheet .mm-group { padding: 8px 0 0; color: var(--mm-feature-k); }
  .mm-sheet .mm-cta { width: 100%; justify-content: center; margin-top: 20px; border: 1px solid var(--mm-bar-line); }
}
@media (prefers-reduced-motion: reduce) { .mm-panel, .mm-item > button svg { transition: none; } }
</style>
</head>
<body>

<nav class="mm" id="mm" aria-label="Main"></nav>

<main style="max-width:1200px;margin:0 auto;padding:80px 32px;color:#4A3F5E;font:16px/1.6 var(--mm-font)">
  <h1 style="color:#160A2B">Mega menu demo</h1>
  <p>Hover a menu item (or tap it, or Tab to it and press Enter). Narrow the window below 980px for the phone sheet.</p>
</main>

<script>
/* =============================================================================
   CONFIG — the only part you need to edit. Each menu is a list of links, in
   one, two or three columns, optionally split into groups and optionally
   with a feature card. Icons are SVG path data on an 18 × 18 grid.
   ============================================================================= */
const MENU = {
  brand: { name: 'Fusion', href: '/' },
  menus: [
    {
      label: 'Products', columns: 2,
      feature: { kicker: 'Fusion today', value: '$81.0M', text: '87 vaults live across 6 networks.', cta: 'Open stats', href: '/stats' },
      links: [
        { title: 'Vault Factory', desc: 'Deploy permissionlessly', href: '/factory', icon: 'M2.5 15.5h13M4 15.5V8l3.5 2.5V8l3.5 2.5V4h3v11.5' },
        { title: 'Alpha', desc: 'Strategy off-chain, bounded onchain', href: '/alpha', icon: 'M10 2L4 10h4.5l-1 6L14 8H9.5z' },
        { title: 'Fuses', desc: 'Connectors to every protocol', href: '/fuses', icon: 'M2.5 2.5h5v5h-5zM10.5 2.5h5v5h-5zM2.5 10.5h5v5h-5zM13 11v4M11 13h4' },
        { title: 'Guardians', desc: 'Roles, limits, emergency controls', href: '/guardians', icon: 'M9 2.5l5.5 2.5v4c0 3.5-2.4 6-5.5 7-3.1-1-5.5-3.5-5.5-7V5z' },
      ],
    },
    {
      label: 'Solutions', columns: 1,
      links: [
        { title: 'Institutions', tag: 'MiCA', desc: 'MiCA-compliant solution, with a partner', href: '/institutions', icon: 'M2.5 15.5h13M3.5 7.5L9 3l5.5 4.5M5 8v6M9 8v6M13 8v6' },
        { title: 'Exchanges', desc: 'Onchain yield inside your product', href: '/exchanges', icon: 'M3 6.5h11l-3-3M15 11.5H4l3 3' },
        { title: 'Curators', desc: 'Launch vaults without Solidity', href: '/curators', icon: 'M9 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM3.5 15.5c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5' },
      ],
    },
    {
      label: 'Developers', columns: 2,
      groups: [
        { name: 'Build', links: [
          { title: 'Documentation', desc: 'Concepts, guides and contracts', href: '/docs', icon: 'M4 2.5h7l3 3v10H4zM11 2.5v3h3M6.5 9h5M6.5 12h5' },
          { title: 'Python SDK', desc: 'Strategies without Solidity', href: '/sdk', icon: 'M6 5.5L2.5 9 6 12.5M12 5.5L15.5 9 12 12.5M10.5 3.5l-3 11' },
        ] },
        { name: 'Trust', links: [
          { title: 'Audits', desc: 'Every report, by every auditor', href: '/audits', icon: 'M9 2.5l5.5 2.5v4c0 3.5-2.4 6-5.5 7-3.1-1-5.5-3.5-5.5-7V5z' },
          { title: 'Bug Bounty', desc: 'Rewards for responsible disclosure', href: '/bounty', icon: 'M9 5.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM9 5.5V3M4.5 10H2.5M15.5 10h-2' },
        ] },
      ],
    },
    {
      label: 'About', columns: 1, right: true,
      links: [
        { title: 'News', desc: 'Launches, partners and updates', href: '/news', icon: 'M2.5 3.5h13v11h-13zM5.5 7h7M5.5 10h4' },
        { title: 'Company', desc: 'The team behind it', href: '/company', icon: 'M2.5 15.5h13M4 15.5V4.5h6v11M10 8h4v7.5' },
        { title: 'Contact', desc: 'Talk to us', href: '/contact', icon: 'M2.5 4.5h13v9h-13zM2.5 4.5L9 10l6.5-5.5' },
      ],
    },
  ],
  ctas: [
    { label: 'Talk to Us', href: '/contact', style: 'ghost' },
    { label: 'Launch App', href: '/app', style: 'solid' },
  ],
};

/* =============================================================================
   RENDERING AND BEHAVIOUR — no need to edit below.
   ============================================================================= */
(function () {
  'use strict';
  const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  const CHEV = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.75l3 3 3-3"/></svg>';
  const MARK = '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#8429FF" stroke-width="2.5"/><ellipse cx="16" cy="16" rx="13" ry="5.5" fill="none" stroke="#8429FF" stroke-width="2.5"/></svg>';
  const ext = (h) => /^https?:/.test(h) ? ' target="_blank" rel="noopener"' : '';
  const link = (l) => `<a class="mm-link" href="${esc(l.href)}"${ext(l.href)}><span class="mm-ic"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="${esc(l.icon || '')}"/></svg></span>`
    + `<span><span class="mm-t">${esc(l.title)}${l.tag ? `<em class="mm-tag">${esc(l.tag)}</em>` : ''}</span>${l.desc ? `<span class="mm-d">${esc(l.desc)}</span>` : ''}</span></a>`;
  const body = (m) => (m.groups || [{ links: m.links }]).map(g => (g.name ? `<div class="mm-group">${esc(g.name)}</div>` : '') + g.links.map(link).join('')).join('');
  const feature = (f) => `<a class="mm-feature" href="${esc(f.href)}"${ext(f.href)}><span class="k">${esc(f.kicker)}</span><b>${esc(f.value)}</b><p>${esc(f.text)}</p><em>${esc(f.cta)} →</em></a>`;
  const cols = (m) => `repeat(${m.columns || 1}, minmax(250px, 1fr))`;

  const nav = document.getElementById('mm');
  nav.innerHTML = `<div class="mm-in">
      <a class="mm-brand" href="${esc(MENU.brand.href)}">${MARK}${esc(MENU.brand.name)}</a>
      <ul class="mm-menu">${MENU.menus.map((m, i) => `<li class="mm-item${m.right ? ' right' : ''}">
        <button type="button" aria-expanded="false" aria-controls="mm-p${i}">${esc(m.label)}${CHEV}</button>
        <div class="mm-panel" id="mm-p${i}"><div class="mm-box">
          <div class="mm-links" style="grid-template-columns:${cols(m)}">${body(m)}</div>${m.feature ? feature(m.feature) : ''}
        </div></div></li>`).join('')}</ul>
      <div class="mm-end">${MENU.ctas.map(c => `<a class="mm-cta ${c.style}" href="${esc(c.href)}"${ext(c.href)}>${esc(c.label)}</a>`).join('')}
        <button type="button" class="mm-burger" aria-expanded="false" aria-label="Menu"><svg class="b" viewBox="0 0 18 18"><path d="M3 6h12M3 12h12"/></svg><svg class="x" viewBox="0 0 18 18"><path d="M4.5 4.5l9 9M13.5 4.5l-9 9"/></svg></button>
      </div>
    </div>
    <div class="mm-sheet">${MENU.menus.map(m => `<details><summary>${esc(m.label)}${CHEV}</summary><div>${body(m)}</div></details>`).join('')}
      ${MENU.ctas.filter(c => c.style !== 'solid').map(c => `<a class="mm-cta" href="${esc(c.href)}" style="color:#fff">${esc(c.label)}</a>`).join('')}</div>`;

  // Hover opens on a desktop (CSS). A click or Enter toggles; Escape, or a
  // click anywhere else, closes. Leaving an item with the pointer closes it.
  const items = [...nav.querySelectorAll('.mm-item')];
  const shut = (except) => items.forEach(li => { if (li !== except) { li.classList.remove('open'); li.firstElementChild.setAttribute('aria-expanded', 'false'); } });
  items.forEach(li => {
    const b = li.firstElementChild;
    b.addEventListener('click', () => { const on = !li.classList.contains('open'); shut(li); li.classList.toggle('open', on); b.setAttribute('aria-expanded', String(on)); });
    li.addEventListener('mouseleave', () => { li.classList.remove('open'); b.setAttribute('aria-expanded', 'false'); });
  });
  const burger = nav.querySelector('.mm-burger');
  burger.addEventListener('click', () => burger.setAttribute('aria-expanded', String(nav.classList.toggle('sheet'))));
  document.addEventListener('click', (e) => { if (!nav.contains(e.target)) shut(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { shut(); nav.classList.remove('sheet'); burger.setAttribute('aria-expanded', 'false'); } });
})();
</script>
</body>
</html>
