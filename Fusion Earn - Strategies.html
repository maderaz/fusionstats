  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ormal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"2565a4be-e6d7-4d0a-b0b1-2181b0d70d67\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"c4914d23-63bb-49a0-8fa7-a2b779b8c6fc\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"a6d433dd-0789-4ba0-9dd9-0a1006476ae7\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"1fd4664d-207b-4865-895b-65fcdff92f05\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek-ext */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"b41b8853-5b75-46d7-9e54-3b7c10a1217d\") format('woff2');\n  unicode-range: U+1F00-1FFF;\n}\n/* greek */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"9d22058a-c373-46dc-b033-bae22cb9e273\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"2e46f2b7-2ed1-4f41-a107-d3561017c968\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"2565a4be-e6d7-4d0a-b0b1-2181b0d70d67\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c4914d23-63bb-49a0-8fa7-a2b779b8c6fc\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ---------------------------------------------------------------\n     PRIMARY BRAND — Fusion Purple\n     The single hero color. Used for the logo glyph, the primary\n     gradient button, link/active states, and the glow effects in\n     backgrounds. Use it sparingly — it is reserved for emphasis.\n     --------------------------------------------------------------- */\n  --fusion-purple:        #8429FF;      /* primary brand */\n  --fusion-purple-deep:   #6C00FF;      /* gradient end + pressed */\n  --fusion-purple-light:  #A37FFF;      /* lighter / hover tint */\n  --fusion-purple-tint:   #F3F0FF;      /* page tint background */\n  --fusion-purple-007:    rgba(132,41,255,0.07);  /* ambient glow */\n  --fusion-purple-006:    rgba(132,41,255,0.06);\n  --fusion-purple-004:    rgba(132,41,255,0.04);\n  --fusion-purple-003:    rgba(132,41,255,0.03);\n\n  /* Brand gradient — for primary CTAs and ambient highlights */\n  --fusion-gradient:      linear-gradient(180deg, #8429FF 0%, #6C00FF 100%); /* @kind color */\n  --fusion-gradient-h:    linear-gradient(90deg,  #8429FF 0%, #6C00FF 100%); /* @kind color */\n\n  /* ---------------------------------------------------------------\n     SECONDARY — Derivatives / DAO Blue\n     Reserved for IPOR DAO & IPOR Derivatives product surfaces.\n     Don't use on the Fusion website itself; available so designers\n     can pivot into the broader IPOR ecosystem when needed.\n     --------------------------------------------------------------- */\n  --ipor-blue:            #006EF2;\n  --ipor-blue-deep:       #0023E3;\n  --ipor-blue-light:      #3D88FF;\n  --ipor-blue-gradient:   linear-gradient(180deg, #006EF2 0%, #0023E3 100%); /* @kind color */\n\n  /* ---------------------------------------------------------------\n     LIGHT MODE — Neutrals\n     Backgrounds are off-white with a faint purple tint; the brand\n     page sits on #F3F0FF more than pure #FFFFFF.\n     --------------------------------------------------------------- */\n  --light-bg:             #F5F5FA;      /* canvas */\n  --light-bg-alt:         #E9E9F3;      /* alt sections (testimonials) */\n  --light-bg-tint:        #F3F0FF;      /* hero tint */\n  --light-surface:        #FFFFFF;      /* cards / containers */\n  --light-stroke:         #E5E5E5;      /* card border */\n  --light-stroke-soft:    #ECECEC;\n  --light-fg:             #000000;      /* headings, active, primary */\n  --light-fg-body:        #70747A;      /* paragraph / body */\n  --light-fg-muted:       #9BA3AF;      /* labels, \"not selected\" */\n  --light-fg-faint:       rgba(112,116,122,0.5);\n  --light-fg-fainter:     rgba(112,116,122,0.3);\n  --light-divider:        rgba(0,0,0,0.1);\n\n  /* ---------------------------------------------------------------\n     DARK MODE — Neutrals\n     Near-black with a slight cool cast. Container surface is two\n     stops lighter than the page so cards float.\n     --------------------------------------------------------------- */\n  --dark-bg:              #090E14;      /* canvas */\n  --dark-bg-alt:          #000000;      /* alt sections */\n  --dark-surface:         #161A20;      /* cards / containers */\n  --dark-stroke:          #2E3137;      /* container border */\n  --dark-fg:              #FFFFFF;      /* headings, primary */\n  --dark-fg-body:         #9BA3AF;      /* paragraph */\n  --dark-fg-muted:        #70747A;\n\n  /* ---------------------------------------------------------------\n     SEMANTIC TOKENS (default = light)\n     Use these in components so dark mode is a one-line theme swap.\n     --------------------------------------------------------------- */\n  --bg:                   var(--light-bg);\n  --bg-alt:               var(--light-bg-alt);\n  --bg-tint:              var(--light-bg-tint);\n  --surface:              var(--light-surface);\n  --stroke:               var(--light-stroke);\n  --fg:                   var(--light-fg);\n  --fg-body:              var(--light-fg-body);\n  --fg-muted:             var(--light-fg-muted);\n  --fg-faint:             var(--light-fg-faint);\n  --divider:              var(--light-divider);\n  --accent:               var(--fusion-purple);\n  --accent-deep:          var(--fusion-purple-deep);\n\n  /* ---------------------------------------------------------------\n     TYPOGRAPHY\n     Stack uses Poppins for everything except numerical stats which\n     escape into Source Sans 3 (Brand Guidelines explicitly calls\n     out \"Source Sans Pro\" — Source Sans 3 is the current name).\n     --------------------------------------------------------------- */\n  --font-sans:    'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-numeric: 'Source Sans 3', 'Source Sans Pro', 'Poppins', sans-serif;\n  --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n  --font-ui:      'Inter', 'Poppins', system-ui, sans-serif;  /* dashboard UI */\n\n  /* Type scale — measured from the Figma extract */\n  --fs-hero:        60px;   /* h1 — hero only */\n  --fs-display:     45px;   /* h2 — section openers */\n  --fs-h3:          24px;   /* card titles */\n  --fs-h4:          18px;   /* sub-headings */\n  --fs-body-lg:     18px;   /* hero subhead, intro paragraphs */\n  --fs-body:        15px;   /* default body */\n  --fs-body-sm:     14px;   /* buttons, navigation */\n  --fs-meta:        13px;   /* footer, fine print */\n  --fs-micro:       11px;   /* tag lines, AUM footnotes */\n  --fs-stat:        20px;   /* hero stats (TVM, Vaults) */\n  --fs-stat-lg:     40px;   /* big stat numbers */\n\n  --lh-tight:       1.1;       /* @kind font */\n  --lh-snug:        1.25;      /* @kind font */\n  --lh-normal:      1.5;       /* @kind font */\n  --lh-loose:       1.75;      /* @kind font */\n  --tracking-cta:   0.04em;    /* @kind font */ /* CTA buttons use 0.56px @ 14px = 0.04em */\n  --tracking-tight: -0.025em;  /* @kind font */ /* numerals get -0.5px @ 20px */\n}\n\n/* Dark theme override — drop on <html data-theme=\"dark\"> or .dark */\n[data-theme=\"dark\"], .dark {\n  --bg:        var(--dark-bg);\n  --bg-alt:    var(--dark-bg-alt);\n  --bg-tint:   var(--dark-bg);\n  --surface:   var(--dark-surface);\n  --stroke:    var(--dark-stroke);\n  --fg:        var(--dark-fg);\n  --fg-body:   var(--dark-fg-body);\n  --fg-muted:  var(--dark-fg-muted);\n  --divider:   rgba(255,255,255,0.1);\n}\n\n/* ---------- Semantic type roles ---------- */\n.h1 {\n  font-family: var(--font-sans);\n  font-weight: 500;\n  font-size: var(--fs-hero);\n  line-height: 1.25;        /* 75/60 from Figma */\n  color: var(--fg);\n  letter-spacing: -0.01em;\n}\n.h2 {\n  font-family: var(--font-sans);\n  font-weight: 500;\n  font-size: var(--fs-display);\n  line-height: 1.33;        /* 60/45 from Figma */\n  color: var(--fg);\n  letter-spacing: -0.01em;\n}\n.h3 {\n  font-family: var(--font-sans);\n  font-weight: 600;\n  font-size: var(--fs-h3);\n  line-height: 1.33;\n  color: var(--fg);\n}\n.h4 {\n  font-family: var(--font-sans);\n  font-weight: 600;\n  font-size: var(--fs-h4);\n  line-height: 1.4;\n  color: var(--fg);\n}\n.body, p {\n  font-family: var(--font-sans);\n  font-weight: 400;\n  font-size: var(--fs-body-lg);\n  line-height: 1.55;        /* 28/18 from Figma */\n  color: var(--fg-body);\n}\n.body-sm {\n  font-family: var(--font-sans);\n  font-size: var(--fs-body-sm);\n  line-height: 1.4;\n  color: var(--fg-body);\n}\n.meta {\n  font-family: var(--font-sans);\n  font-size: var(--fs-meta);\n  line-height: 1.5;\n  color: var(--fg-body);\n}\n.micro {\n  font-family: var(--font-sans);\n  font-size: var(--fs-micro);\n  line-height: 1.5;\n  color: var(--fg-faint);\n}\n.stat {\n  font-family: var(--font-numeric);\n  font-weight: 700;\n  font-size: var(--fs-stat);\n  line-height: 1.4;\n  letter-spacing: var(--tracking-tight);\n  color: var(--fg);\n}\n.stat-lg {\n  font-family: var(--font-numeric);\n  font-weight: 600;\n  font-size: var(--fs-stat-lg);\n  line-height: 1.1;\n  letter-spacing: var(--tracking-tight);\n  color: var(--fg);\n}\n.mono {\n  font-family: var(--font-mono);\n  font-size: 12.5px;        /* dashboard mono spec */\n  color: var(--fg-body);\n}\n.accent { color: var(--fusion-purple); }\n.muted  { color: var(--fg-muted); }\n\n/* ---------- Radii, shadows, motion ---------- */\n:root {\n  --r-sm:  8px;\n  --r-md:  12px;\n  --r-lg:  16px;     /* default for cards, screenshots */\n  --r-xl:  20px;\n  --r-pill: 9999px;  /* CTAs are pills */\n\n  /* Shadow system is restrained — Fusion uses BORDERS, not shadows,\n     for card separation. The only shadow in extract is 0.06 alpha. */\n  --shadow-card:  0 1px 2px rgba(0,0,0,0.06);\n  --shadow-lift:  0 8px 24px rgba(0,0,0,0.06);\n  --shadow-glow:  0 0 40px rgba(132,41,255,0.25);\n\n  /* Motion */\n  --ease-out:     cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --ease-in-out:  cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n  --dur-fast:     150ms; /* @kind other */\n  --dur-base:     220ms; /* @kind other */\n  --dur-slow:     360ms; /* @kind other */\n}\n<\u002Fstyle>\n<script src=\"07a23421-94cb-4582-8735-8c65fb1c4896\"><\u002Fscript>\n<style>\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{font-family:'Poppins',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#ffffff;}\n  ::selection{background:rgba(132,41,255,0.18);}\n  .num{font-family:'Source Sans 3','Source Sans Pro',sans-serif;font-feature-settings:'tnum' 1;letter-spacing:-0.02em;}\n  @keyframes fz-rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background-color:#ffffff;background-image:radial-gradient(1100px 460px at 78% -8%, rgba(132,41,255,0.07), transparent 62%),radial-gradient(rgba(17,24,39,0.055) 1.1px, transparent 1.2px);background-size:auto, 19px 19px;background-position:center top;\">\n\n  <nav style=\"position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:13px 32px;background:rgba(255,255,255,0.78);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-bottom:1px solid #ECECEC;\">\n    <div style=\"display:flex;align-items:center;gap:32px;\">\n      <img src=\"b04d8e56-d791-4ecf-b416-c6b0cf725838\" alt=\"Fusion by IPOR\" style=\"height:25px;display:block;\">\n      <div style=\"display:flex;align-items:center;gap:6px;\">\n        <span style=\"font-size:14px;font-weight:600;color:#000;padding:7px 12px;border-radius:9999px;background:#F3F0FF;\">Earn<\u002Fspan>\n        <span style=\"font-size:14px;font-weight:400;color:#70747A;padding:7px 12px;cursor:pointer;\">Vaults<\u002Fspan>\n        <span style=\"font-size:14px;font-weight:400;color:#70747A;padding:7px 12px;cursor:pointer;\">Build<\u002Fspan>\n        <span style=\"font-size:14px;font-weight:400;color:#70747A;padding:7px 12px;cursor:pointer;\">Docs<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:12px;\">\n      <div style=\"display:flex;align-items:center;gap:8px;padding:8px 13px;border:1px solid #E5E5E5;border-radius:9999px;cursor:pointer;background:#fff;\">\n        <span style=\"width:7px;height:7px;border-radius:50%;background:#1FB96B;box-shadow:0 0 0 3px rgba(31,185,107,0.16);\"><\u002Fspan>\n        <span style=\"font-size:13.5px;font-weight:500;color:#000;\">Ethereum<\u002Fspan>\n        <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#9BA3AF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <button style=\"display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:9999px;border:1px solid #8429FF;background:linear-gradient(180deg,#8429FF 0%,#6C00FF 100%);color:#fff;font-family:'Poppins',sans-serif;font-size:13.5px;font-weight:700;letter-spacing:0.04em;cursor:pointer;\" style-hover=\"filter:brightness(1.06);\">Connect Wallet<\u002Fbutton>\n      <img src=\"b1ad4602-46e6-4977-aea7-c83ec3c8f572\" alt=\"\" style=\"width:34px;height:34px;border-radius:50%;border:1px solid #E5E5E5;object-fit:cover;\">\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <main style=\"max-width:1152px;margin:0 auto;padding:48px 32px 80px;\">\n\n    <div style=\"display:flex;align-items:center;justify-content:flex-start;gap:32px;flex-wrap:wrap;margin-bottom:28px;\">\n      <div style=\"display:flex;align-items:stretch;border:1px solid #E5E5E5;border-radius:16px;background:rgba(255,255,255,0.7);overflow:hidden;\">\n        <div style=\"padding:18px 24px;\">\n          <div style=\"font-size:11.5px;font-weight:500;letter-spacing:0.06em;color:#9BA3AF;text-transform:uppercase;margin-bottom:7px;\">Value Managed<\u002Fdiv>\n          <div class=\"num\" style=\"font-size:26px;font-weight:700;color:#000;line-height:1;\">$128.0M<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width:1px;background:#ECECEC;\"><\u002Fdiv>\n        <div style=\"padding:18px 24px;\">\n          <div style=\"font-size:11.5px;font-weight:500;letter-spacing:0.06em;color:#9BA3AF;text-transform:uppercase;margin-bottom:7px;\">Vaults<\u002Fdiv>\n          <div class=\"num\" style=\"font-size:26px;font-weight:700;color:#000;line-height:1;\">81<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width:1px;background:#ECECEC;\"><\u002Fdiv>\n        <div style=\"padding:18px 24px;\">\n          <div style=\"font-size:11.5px;font-weight:500;letter-spacing:0.06em;color:#9BA3AF;text-transform:uppercase;margin-bottom:7px;\">Avg. Net APY<\u002Fdiv>\n          <div class=\"num\" style=\"font-size:26px;font-weight:700;color:#8429FF;line-height:1;\">14.2%<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px;\">\n      <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;\">\n        <sc-for list=\"{{ assetPills }}\" as=\"pill\" hint-placeholder-count=\"6\">\n          <button style=\"{{ pill.style }}\" onclick=\"{{ pill.onClick }}\">{{ pill.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;\">\n        <div style=\"display:flex;align-items:center;gap:9px;padding:0 14px;height:40px;border:1px solid #E5E5E5;border-radius:9999px;background:#fff;width:248px;\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#9BA3AF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M21 21l-4.3-4.3\"><\u002Fpath><\u002Fsvg>\n          <input value=\"{{ query }}\" oninput=\"{{ onSearch }}\" placeholder=\"Search asset or strategy\" style=\"border:none;outline:none;background:transparent;font-family:'Poppins',sans-serif;font-size:13.5px;color:#000;width:100%;\">\n        <\u002Fdiv>\n        <button onclick=\"{{ cycleSort }}\" style=\"display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:1px solid #E5E5E5;border-radius:9999px;background:#fff;font-family:'Poppins',sans-serif;font-size:13.5px;font-weight:500;color:#000;cursor:pointer;\" style-hover=\"border-color:#000;\">\n          <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#70747A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h13M3 12h9M3 18h5\"><\u002Fpath><path d=\"M19 8V20M19 20l3-3M19 20l-3-3\"><\u002Fpath><\u002Fsvg>\n          Sort: {{ sortLabel }}\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #E5E5E5;border-radius:16px;background:rgba(255,255,255,0.72);overflow:hidden;\">\n      <div style=\"display:grid;grid-template-columns:1.4fr 0.8fr 0.9fr 1.2fr 1.3fr auto;align-items:center;gap:18px;padding:14px 24px;border-bottom:1px solid #ECECEC;background:rgba(245,245,250,0.5);\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;color:#9BA3AF;text-transform:uppercase;\">Asset<\u002Fdiv>\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;color:#9BA3AF;text-transform:uppercase;\">Net APY<\u002Fdiv>\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;color:#9BA3AF;text-transform:uppercase;\">TVL<\u002Fdiv>\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;color:#9BA3AF;text-transform:uppercase;\">Curator<\u002Fdiv>\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;color:#9BA3AF;text-transform:uppercase;\">Strategy<\u002Fdiv>\n        <div style=\"width:120px;\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-for list=\"{{ rows }}\" as=\"row\" hint-placeholder-count=\"6\">\n        <div style=\"display:grid;grid-template-columns:1.4fr 0.8fr 0.9fr 1.2fr 1.3fr auto;align-items:center;gap:18px;padding:{{ rowPad }};border-bottom:1px solid #F1F1F4;transition:background 180ms;cursor:default;\" style-hover=\"background:rgba(132,41,255,0.035);\">\n          <div style=\"display:flex;align-items:center;gap:13px;min-width:0;\">\n            <div class=\"num\" style=\"{{ row.tokenStyle }}\">{{ row.glyph }}<\u002Fdiv>\n            <div style=\"font-size:15px;font-weight:600;color:#000;line-height:1.2;\">{{ row.symbol }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"num\" style=\"{{ row.apyStyle }}\">{{ row.apyText }}<\u002Fdiv>\n          <div class=\"num\" style=\"font-size:15px;font-weight:600;color:#000;\">{{ row.tvlText }}<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:500;color:#000;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ row.curator }}<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:500;color:#000;line-height:1.25;\">{{ row.strategy }}<\u002Fdiv>\n          <div style=\"justify-self:end;\">\n            <button onclick=\"{{ row.access }}\" style=\"display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9999px;border:1px solid #E0E0E6;background:#fff;font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;color:#000;cursor:pointer;transition:all 180ms;white-space:nowrap;\" style-hover=\"background:linear-gradient(180deg,#8429FF 0%,#6C00FF 100%);border-color:#8429FF;color:#fff;\">\n              Open Now\n              <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <sc-if value=\"{{ isEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:64px 24px;text-align:center;\">\n          <div style=\"font-size:15px;font-weight:600;color:#000;\">No strategies match your filters<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#9BA3AF;margin-top:6px;\">Try a different asset or clear your search.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:18px;flex-wrap:wrap;\">\n      <div style=\"font-size:12.5px;color:#9BA3AF;\">Showing <span class=\"num\" style=\"color:#70747A;font-weight:600;\">{{ count }}<\u002Fspan> of <span class=\"num\" style=\"color:#70747A;font-weight:600;\">{{ total }}<\u002Fspan> live strategies<\u002Fdiv>\n      <div style=\"font-size:11.5px;font-style:italic;color:rgba(112,116,122,0.65);max-width:560px;text-align:right;\">*Displayed APYs are net of fees and variable. Past performance does not guarantee future returns.<\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:860},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#8429FF&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { asset: 'All', query: '', sort: 'apy' };\n\n  allRows() {\n    const tok = (color) => ({\n      width: '40px', height: '40px', borderRadius: '50%', flexShrink: 0,\n      background: color, color: '#fff', display: 'flex', alignItems: 'center',\n      justifyContent: 'center', fontSize: '19px', fontWeight: 700, lineHeight: 1,\n    });\n    const data = [\n      { symbol: 'USDC', group: 'USDC', glyph: '$', color: '#2775CA', apy: 22.4, tvl: 1.04e6, curator: 'Clearstar', strategy: 'Leveraged Looping' },\n      { symbol: 'USDC', group: 'USDC', glyph: '$', color: '#2775CA', apy: 14.1, tvl: 8.2e6, curator: 'Steakhouse', strategy: 'Lending Optimizer' },\n      { symbol: 'USDe', group: 'USDC', glyph: '$', color: '#3F3F5A', apy: 31.2, tvl: 1.8e6, curator: 'Tau Labs', strategy: 'Carry Trade' },\n      { symbol: 'USDT', group: 'USDT', glyph: '$', color: '#26A17B', apy: 18.7, tvl: 3.6e6, curator: 'Gauntlet', strategy: 'Carry Trade' },\n      { symbol: 'wETH', group: 'ETH', glyph: 'Ξ', color: '#627EEA', apy: 9.3, tvl: 12.4e6, curator: 'Re7 Labs', strategy: 'Lending Optimizer' },\n      { symbol: 'DAI', group: 'DAI', glyph: '$', color: '#E0A93B', apy: 16.5, tvl: 2.1e6, curator: 'MEV Capital', strategy: 'Leveraged Looping' },\n      { symbol: 'USDC', group: 'USDC', glyph: '$', color: '#2775CA', apy: 27.9, tvl: 0.64e6, curator: 'Block Analitica', strategy: 'Leveraged Looping' },\n      { symbol: 'wBTC', group: 'BTC', glyph: '₿', color: '#E8902B', apy: 6.8, tvl: 5.9e6, curator: 'Apostro', strategy: 'Lending Optimizer' },\n    ];\n    const accent = this.props.accent || '#8429FF';\n    return data.map((d, i) => {\n      return {\n        ...d,\n        id: i,\n        tokenStyle: tok(d.color),\n        apyText: d.apy.toFixed(1) + '%',\n        apyStyle: { fontSize: '15px', fontWeight: 600, color: accent, lineHeight: 1.2 },\n        tvlText: d.tvl >= 1e6 ? '$' + (d.tvl / 1e6).toFixed(2) + 'M' : '$' + Math.round(d.tvl / 1e3) + 'K',\n        tvlNum: d.tvl,\n        access: () => {},\n      };\n    });\n  }\n\n  renderVals() {\n    const { asset, query, sort } = this.state;\n    const all = this.allRows();\n    let rows = all;\n    if (asset !== 'All') rows = rows.filter(r => r.group === asset);\n    const q = query.trim().toLowerCase();\n    if (q) rows = rows.filter(r => (r.symbol + ' ' + r.curator + ' ' + r.strategy).toLowerCase().includes(q));\n    rows = rows.slice().sort((a, b) => sort === 'apy' ? b.apy - a.apy : b.tvlNum - a.tvlNum);\n\n    const accent = this.props.accent || '#8429FF';\n    const pill = (active) => active\n      ? { padding: '8px 16px', borderRadius: '9999px', border: '1px solid ' + accent, background: '#F3F0FF', color: accent, fontFamily: 'Poppins,sans-serif', fontSize: '13.5px', fontWeight: 600, cursor: 'pointer' }\n      : { padding: '8px 16px', borderRadius: '9999px', border: '1px solid #E5E5E5', background: '#fff', color: '#70747A', fontFamily: 'Poppins,sans-serif', fontSize: '13.5px', fontWeight: 500, cursor: 'pointer' };\n    const assets = ['All', 'USDC', 'USDT', 'ETH', 'BTC', 'DAI'];\n    const assetPills = assets.map(a => ({\n      label: a === 'All' ? 'All assets' : a,\n      style: pill(asset === a),\n      onClick: () => this.setState({ asset: a }),\n    }));\n\n    const compact = !!this.props.compact;\n\n    return {\n      rows,\n      assetPills,\n      query,\n      onSearch: (e) => this.setState({ query: e.target.value }),\n      sortLabel: sort === 'apy' ? 'Net APY' : 'TVL',\n      cycleSort: () => this.setState(s => ({ sort: s.sort === 'apy' ? 'tvl' : 'apy' })),\n      isEmpty: rows.length === 0,\n      count: rows.length,\n      total: all.length,\n      rowPad: compact ? '13px 24px' : '18px 24px',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
