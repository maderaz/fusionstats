<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fusion Earn — Strategies · by IPOR</title>
<meta name="description" content="Fusion Earn — a curated ranking of onchain vault strategies. Filter by asset, sort by net APY or TVL, and open any strategy in the Fusion app." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* =====================================================================
   IPOR Fusion — Earn / Strategies
   Faithful build of the Figma frame (IPOR / Strategies, node 554-34):
   sticky nav with Earn/Vaults/Build/Docs + Ethereum selector + purple
   Connect Wallet pill, stats card, asset filter pills, search + sort,
   and a clean per-row strategies table wired to live ipor-vaults.json.
   Rows are intentionally single-line: token · symbol · APY · TVL ·
   strategy bucket — no curator column.
   ===================================================================== */
:root {
  --fusion-purple:      #8429FF;
  --fusion-purple-deep: #6C00FF;
  --fusion-purple-light:#A37FFF;
  --fusion-purple-tint: #F3F0FF;
  --fusion-gradient:    linear-gradient(180deg, #8429FF 0%, #6C00FF 100%);

  --bg-canvas:     #FFFFFF;
  --surface:       #FFFFFF;
  --stroke:        #E5E5E5;
  --stroke-soft:   #ECECEC;
  --row-line:      #F1F1F4;
  --fg:            #0A0B0D;
  --fg-body:       #70747A;
  --fg-muted:      #9BA3AF;

  --font-sans:    'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-numeric: 'Source Sans 3', 'Source Sans Pro', 'Poppins', sans-serif;
  --r-md: 12px; --r-lg: 16px; --r-pill: 9999px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: #fff;
  color: var(--fg);
  -webkit-font-smoothing: antialiased;
}
::selection { background: rgba(132,41,255,0.18); }
a { color: inherit; text-decoration: none; }
button, input { font-family: inherit; }
.num { font-family: var(--font-numeric); font-feature-settings: 'tnum' 1; letter-spacing: -0.01em; }
@keyframes fz-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* page canvas — white + purple glow + faint dot grid (per the Figma extract) */
.page {
  min-height: 100vh;
  background-color: #fff;
  background-image:
    radial-gradient(1100px 460px at 78% -8%, rgba(132,41,255,0.07), transparent 62%),
    radial-gradient(rgba(17,24,39,0.055) 1.1px, transparent 1.2px);
  background-size: auto, 19px 19px;
  background-position: center top;
}

/* ---------- NAV ---------- */
.nav {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
  padding: 13px 32px;
  background: rgba(255,255,255,0.78);
  backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  border-bottom: 1px solid var(--stroke-soft);
}
.nav-left { display: flex; align-items: center; gap: 32px; }
.nav-logo { height: 25px; display: block; }
.nav-tabs { display: flex; align-items: center; gap: 6px; }
.nav-tabs a {
  font-size: 14px; font-weight: 400; color: var(--fg-body);
  padding: 7px 12px; border-radius: var(--r-pill);
  transition: color .15s, background .15s;
}
.nav-tabs a:hover { color: var(--fg); }
.nav-tabs a.active { font-weight: 600; color: var(--fg); background: var(--fusion-purple-tint); }
.nav-right { display: flex; align-items: center; gap: 12px; }
.net-select {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 13px; border: 1px solid var(--stroke);
  border-radius: var(--r-pill); cursor: pointer; background: #fff;
}
.net-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #1FB96B; box-shadow: 0 0 0 3px rgba(31,185,107,0.16);
}
.net-select .lbl { font-size: 13.5px; font-weight: 500; color: var(--fg); }
.btn-connect {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 22px; border-radius: var(--r-pill);
  border: 1px solid var(--fusion-purple); background: var(--fusion-gradient);
  color: #fff; font-size: 14px; font-weight: 700; letter-spacing: 0.02em;
  cursor: pointer; transition: filter .15s;
}
.btn-connect:hover { filter: brightness(1.06); }
.avatar { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--stroke); object-fit: cover; }

/* ---------- MAIN ---------- */
.main { max-width: 1152px; margin: 0 auto; padding: 48px 32px 80px; animation: fz-rise .4s ease both; }

/* stats card */
.stats-wrap { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; margin-bottom: 28px; }
.stats {
  display: flex; align-items: stretch;
  border: 1px solid var(--stroke); border-radius: var(--r-lg);
  background: rgba(255,255,255,0.7); overflow: hidden;
}
.stats .cell { padding: 18px 28px; }
.stats .sep { width: 1px; background: var(--stroke-soft); }
.stats .k {
  font-size: 11.5px; font-weight: 500; letter-spacing: 0.08em;
  color: var(--fg-muted); text-transform: uppercase; margin-bottom: 7px;
}
.stats .v { font-size: 28px; font-weight: 700; color: var(--fg); line-height: 1; }
.stats .v.accent { color: var(--fusion-purple); }

/* controls */
.controls { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
.pills { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill {
  padding: 8px 16px; border-radius: var(--r-pill);
  border: 1px solid var(--stroke); background: #fff;
  color: var(--fg-body); font-size: 13.5px; font-weight: 500;
  cursor: pointer; transition: all .15s;
}
.pill:hover { border-color: var(--fusion-purple-light); color: var(--fusion-purple); }
.pill.active {
  border-color: var(--fusion-purple); background: var(--fusion-purple-tint);
  color: var(--fusion-purple); font-weight: 600;
}
.tools { display: flex; align-items: center; gap: 10px; }
.search {
  display: flex; align-items: center; gap: 9px;
  padding: 0 14px; height: 40px;
  border: 1px solid var(--stroke); border-radius: var(--r-pill);
  background: #fff; width: 280px;
}
.search input { border: none; outline: none; background: transparent; font-size: 13.5px; color: var(--fg); width: 100%; }
.search input::placeholder { color: var(--fg-muted); }
.sort-btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 16px;
  border: 1px solid var(--stroke); border-radius: var(--r-pill);
  background: #fff; font-size: 13.5px; font-weight: 500; color: var(--fg);
  cursor: pointer; transition: border-color .15s;
}
.sort-btn:hover { border-color: var(--fg); }

/* table */
.table { border: 1px solid var(--stroke); border-radius: var(--r-lg); background: rgba(255,255,255,0.72); overflow: hidden; }
.table-scroll { overflow-x: auto; }
.trow {
  display: grid;
  grid-template-columns: 1.4fr 0.9fr 1.0fr 1.3fr auto;
  align-items: center; gap: 18px;
  padding: 18px 24px; min-width: 760px;
}
.thead { padding: 14px 24px; border-bottom: 1px solid var(--stroke-soft); background: rgba(245,245,250,0.5); }
.thead > div {
  font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
  color: var(--fg-muted); text-transform: uppercase;
}
.thead .spacer { width: 120px; }
.tbody .trow { border-bottom: 1px solid var(--row-line); transition: background .18s; }
.tbody .trow:last-child { border-bottom: none; }
.tbody .trow:hover { background: rgba(132,41,255,0.035); }

.asset-cell { display: flex; align-items: center; gap: 13px; min-width: 0; }
.token {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 19px; font-weight: 700; line-height: 1;
}
.sym { font-size: 15px; font-weight: 600; color: var(--fg); line-height: 1.2; }
.apy { font-size: 15px; font-weight: 600; color: var(--fusion-purple); line-height: 1.2; }
.tvl { font-size: 15px; font-weight: 600; color: var(--fg); }
.strategy { font-size: 15px; font-weight: 500; color: var(--fg); line-height: 1.25; }

.open-cell { justify-self: end; }
.btn-open {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 16px; border-radius: var(--r-pill);
  border: 1px solid #E0E0E6; background: #fff;
  font-size: 13px; font-weight: 600; color: var(--fg);
  cursor: pointer; transition: all .18s; white-space: nowrap;
}
.btn-open:hover {
  background: var(--fusion-gradient);
  border-color: var(--fusion-purple); color: #fff;
}

.empty { padding: 64px 24px; text-align: center; }
.empty .t { font-size: 15px; font-weight: 600; color: var(--fg); }
.empty .s { font-size: 13.5px; color: var(--fg-muted); margin-top: 6px; }

/* footer row */
.foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 18px; flex-wrap: wrap; }
.foot .count { font-size: 12.5px; color: var(--fg-muted); }
.foot .count .num { color: var(--fg-body); font-weight: 600; }
.foot .disc { font-size: 11.5px; font-style: italic; color: rgba(112,116,122,0.65); max-width: 560px; text-align: right; }

/* ---------- responsive ---------- */
@media (max-width: 720px) {
  .nav { padding: 12px 16px; gap: 12px; }
  .nav-tabs { display: none; }
  .net-select .lbl { display: none; }
  .main { padding: 28px 16px 64px; }
  .stats { width: 100%; }
  .stats .cell { flex: 1; padding: 14px 16px; }
  .stats .v { font-size: 22px; }
  .tools { width: 100%; }
  .search { flex: 1; width: auto; }
  .foot .disc { text-align: left; }
}
</style>
</head>
<body>
<div class="page">

  <!-- ===== NAV ===== -->
  <nav class="nav">
    <div class="nav-left">
      <a href="/future"><img class="nav-logo" src="assets/fusion-logo.png" alt="Fusion by IPOR"></a>
      <div class="nav-tabs">
        <a href="/future" class="active">Earn</a>
        <a href="/all-vaults">Vaults</a>
        <a href="https://docs.ipor.io/" target="_blank" rel="noopener">Build</a>
        <a href="https://docs.ipor.io/" target="_blank" rel="noopener">Docs</a>
      </div>
    </div>
    <div class="nav-right">
      <div class="net-select" title="Network">
        <span class="net-dot"></span>
        <span class="lbl">Ethereum</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9BA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <a class="btn-connect" href="https://app.ipor.io/fusion" target="_blank" rel="noopener">Connect Wallet</a>
      <img class="avatar" src="assets/avatar.png" alt="">
    </div>
  </nav>

  <!-- ===== MAIN ===== -->
  <main class="main">

    <!-- stats card -->
    <div class="stats-wrap">
      <div class="stats">
        <div class="cell"><div class="k">Value Managed</div><div class="v num" id="statTvl">$—</div></div>
        <div class="sep"></div>
        <div class="cell"><div class="k">Vaults</div><div class="v num" id="statVaults">—</div></div>
        <div class="sep"></div>
        <div class="cell"><div class="k">Avg. Net APY</div><div class="v num accent" id="statApy">—</div></div>
      </div>
    </div>

    <!-- controls -->
    <div class="controls">
      <div class="pills" id="pills"></div>
      <div class="tools">
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9BA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="search" placeholder="Search asset or strategy" autocomplete="off" spellcheck="false">
        </div>
        <button class="sort-btn" id="sortBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#70747A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h13M3 12h9M3 18h5"/><path d="M19 8V20M19 20l3-3M19 20l-3-3"/></svg>
          <span>Sort: <span id="sortLabel">Net APY</span></span>
        </button>
      </div>
    </div>

    <!-- table -->
    <div class="table">
      <div class="table-scroll">
        <div class="trow thead">
          <div>Asset</div>
          <div>Net APY</div>
          <div>TVL</div>
          <div>Strategy</div>
          <div class="spacer"></div>
        </div>
        <div class="tbody" id="tbody"></div>
      </div>
    </div>

    <!-- footer row -->
    <div class="foot">
      <div class="count">Showing <span class="num" id="count">0</span> of <span class="num" id="total">0</span> live strategies</div>
      <div class="disc">*Displayed APYs are net of fees and variable. Past performance does not guarantee future returns.</div>
    </div>

  </main>
</div>

<script>
  // ---- token taxonomy (color + glyph + filter group) ----
  const TOKENS = {
    USDC:   { c: '#2775CA', g: '$', grp: 'USDC' },
    USDT:   { c: '#26A17B', g: '$', grp: 'USDT' },
    DAI:    { c: '#E0A93B', g: '$', grp: 'DAI'  },
    USDe:   { c: '#3F3F5A', g: '$', grp: 'USDC' },
    sUSDe:  { c: '#3F3F5A', g: '$', grp: 'USDC' },
    GHO:    { c: '#1B6A5B', g: '$', grp: 'USDC' },
    crvUSD: { c: '#1F6F45', g: '$', grp: 'USDC' },
    wsrUSD: { c: '#1F4F8F', g: '$', grp: 'USDC' },
    stcUSD: { c: '#445599', g: '$', grp: 'USDC' },
    syrupUSDT: { c: '#0A6E5C', g: '$', grp: 'USDT' },
    WETH:   { c: '#627EEA', g: 'Ξ', grp: 'ETH'  },
    ETH:    { c: '#627EEA', g: 'Ξ', grp: 'ETH'  },
    stETH:  { c: '#00A3FF', g: 'Ξ', grp: 'ETH'  },
    wstETH: { c: '#00A3FF', g: 'Ξ', grp: 'ETH'  },
    weETH:  { c: '#5A87C2', g: 'Ξ', grp: 'ETH'  },
    cbETH:  { c: '#3666FF', g: 'Ξ', grp: 'ETH'  },
    rETH:   { c: '#FF8062', g: 'Ξ', grp: 'ETH'  },
    osETH:  { c: '#A9C3FF', g: 'Ξ', grp: 'ETH'  },
    mHYPER: { c: '#7B61FF', g: 'Ξ', grp: 'ETH'  },
    WBTC:   { c: '#E8902B', g: '₿', grp: 'BTC'  },
    cbBTC:  { c: '#E8902B', g: '₿', grp: 'BTC'  },
    tBTC:   { c: '#E8902B', g: '₿', grp: 'BTC'  },
    LBTC:   { c: '#5B27D1', g: '₿', grp: 'BTC'  },
  };
  function tokenMeta(sym) {
    if (TOKENS[sym]) return TOKENS[sym];
    const s = (sym || '').toUpperCase();
    if (s.includes('BTC')) return { c: '#E8902B', g: '₿', grp: 'BTC' };
    if (s.includes('ETH')) return { c: '#627EEA', g: 'Ξ', grp: 'ETH' };
    if (s === 'USDT')      return { c: '#26A17B', g: '$', grp: 'USDT' };
    if (s === 'DAI')       return { c: '#E0A93B', g: '$', grp: 'DAI' };
    if (s.includes('USD')) return { c: '#2775CA', g: '$', grp: 'USDC' };
    return { c: '#8429FF', g: (sym || '◈').slice(0, 1).toUpperCase(), grp: 'Other' };
  }

  // ---- strategy bucket — only three labels per spec ----
  // Lending Optimizer · Carry Trade · Leveraged Looping
  // Anything we can't classify defaults to Lending Optimizer (the most common).
  function strategyOf(name) {
    const n = (name || '').toLowerCase();
    if (/loop|leverag/.test(n))                            return 'Leveraged Looping';
    if (/carry|ethena|aave?thena|sus[de]\b|usde\b/.test(n)) return 'Carry Trade';
    return 'Lending Optimizer';
  }

  // ---- formatters ----
  function fmtTvlRow(n) {
    if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3) return '$' + Math.round(n / 1e3) + 'K';
    return '$' + Math.round(n);
  }
  function fmtTvlBig(n) {
    if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return '$' + Math.round(n / 1e3) + 'K';
    return '$' + Math.round(n);
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

  // ---- fallback rows (the Figma sample, used only if the live fetch fails) ----
  const FALLBACK = [
    { symbol: 'USDe', apy: 31.2, tvl: 1.80e6, strategy: 'Carry Trade',       href: null },
    { symbol: 'USDC', apy: 27.9, tvl: 0.64e6, strategy: 'Leveraged Looping', href: null },
    { symbol: 'USDC', apy: 22.4, tvl: 1.04e6, strategy: 'Leveraged Looping', href: null },
    { symbol: 'USDT', apy: 18.7, tvl: 3.60e6, strategy: 'Carry Trade',       href: null },
    { symbol: 'DAI',  apy: 16.5, tvl: 2.10e6, strategy: 'Leveraged Looping', href: null },
    { symbol: 'USDC', apy: 14.1, tvl: 8.20e6, strategy: 'Lending Optimizer', href: null },
    { symbol: 'wETH', apy: 9.3,  tvl: 12.4e6, strategy: 'Lending Optimizer', href: null },
    { symbol: 'wBTC', apy: 6.8,  tvl: 5.90e6, strategy: 'Lending Optimizer', href: null },
  ].map(r => ({ ...r, grp: tokenMeta(r.symbol).grp }));

  // ---- state ----
  const state = { asset: 'All', query: '', sort: 'apy', all: FALLBACK };
  const GROUP_ORDER = ['USDC', 'USDT', 'ETH', 'BTC', 'DAI'];

  function renderPills() {
    const present = new Set(state.all.map(r => r.grp));
    const groups = ['All', ...GROUP_ORDER.filter(g => present.has(g))];
    document.getElementById('pills').innerHTML = groups.map(g => {
      const active = state.asset === g;
      const label = g === 'All' ? 'All assets' : g;
      return `<button class="pill${active ? ' active' : ''}" data-grp="${g}">${label}</button>`;
    }).join('');
    document.querySelectorAll('#pills .pill').forEach(b => {
      b.onclick = () => { state.asset = b.dataset.grp; render(); };
    });
  }

  function visibleRows() {
    let rows = state.all.slice();
    if (state.asset !== 'All') rows = rows.filter(r => r.grp === state.asset);
    const q = state.query.trim().toLowerCase();
    if (q) rows = rows.filter(r => (r.symbol + ' ' + r.strategy).toLowerCase().includes(q));
    rows.sort((a, b) => state.sort === 'apy' ? (b.apy || 0) - (a.apy || 0) : (b.tvl || 0) - (a.tvl || 0));
    return rows;
  }

  function rowHtml(r) {
    const m = tokenMeta(r.symbol);
    const open = r.href
      ? `<a class="btn-open" href="${esc(r.href)}" target="_blank" rel="noopener">Open Now <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></a>`
      : `<a class="btn-open" href="/all-vaults">Open Now <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></a>`;
    return `<div class="trow">
      <div class="asset-cell">
        <div class="token num" style="background:${m.c}">${esc(m.g)}</div>
        <div class="sym">${esc(r.symbol)}</div>
      </div>
      <div class="apy num">${r.apy != null ? r.apy.toFixed(1) + '%' : '—'}</div>
      <div class="tvl num">${esc(fmtTvlRow(r.tvl || 0))}</div>
      <div class="strategy">${esc(r.strategy)}</div>
      <div class="open-cell">${open}</div>
    </div>`;
  }

  function render() {
    renderPills();
    const rows = visibleRows();
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = rows.length
      ? rows.map(rowHtml).join('')
      : `<div class="empty"><div class="t">No strategies match your filters</div><div class="s">Try a different asset or clear your search.</div></div>`;
    document.getElementById('count').textContent = rows.length;
    document.getElementById('total').textContent = state.all.length;
    document.getElementById('sortLabel').textContent = state.sort === 'apy' ? 'Net APY' : 'TVL';
  }

  function renderStats() {
    const all = state.all;
    const totalTvl = all.reduce((s, r) => s + (r.tvl || 0), 0);
    // TVL-weighted average net APY (falls back to simple mean if no TVL).
    const wTvl = all.reduce((s, r) => s + (r.apy != null ? (r.tvl || 0) : 0), 0);
    const wApy = all.reduce((s, r) => s + (r.apy != null ? r.apy * (r.tvl || 0) : 0), 0);
    const avgApy = wTvl > 0 ? wApy / wTvl : (all.reduce((s, r) => s + (r.apy || 0), 0) / (all.length || 1));
    document.getElementById('statTvl').textContent = fmtTvlBig(totalTvl);
    document.getElementById('statVaults').textContent = all.length;
    document.getElementById('statApy').textContent = avgApy.toFixed(1) + '%';
  }

  // ---- wire controls ----
  document.getElementById('search').addEventListener('input', e => { state.query = e.target.value; render(); });
  document.getElementById('sortBtn').addEventListener('click', () => {
    state.sort = state.sort === 'apy' ? 'tvl' : 'apy';
    render();
  });

  // ---- initial paint (fallback), then live data ----
  renderStats();
  render();

  // Pull live strategies from the fusionstats catalog. Sub-$1K dust vaults
  // are skipped — they're test deployments and would crowd the ranking.
  fetch('../ipor-vaults.json')
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(data => {
      const live = (data.vaults || [])
        .filter(v => v.isPublic !== false && (v.tvl || 0) >= 1000)
        .map(v => {
          const symbol = v.token || v.symbol || '—';
          return {
            symbol,
            grp: tokenMeta(symbol).grp,
            apy: typeof v.apy === 'number' ? v.apy : null,
            tvl: v.tvl || 0,
            strategy: strategyOf(v.name || ''),
            href: v.address ? `https://app.ipor.io/fusion/${v.chain || 'ethereum'}/${v.address}` : null,
          };
        });
      if (live.length) {
        state.all = live;
        renderStats();
        render();
      }
    })
    .catch(() => { /* keep fallback rows + stats */ });
</script>
</body>
</html>
