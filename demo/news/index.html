<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Partnerships, integrations and milestones from the institutions, curators and custodians building institutional-grade onchain yield on Fusion.">
  <link rel="canonical" href="https://fusionecosystem.xyz/demo/news">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Fusion">
  <meta property="og:title" content="Newsroom • Fusion">
  <meta property="og:description" content="Partnerships, integrations and milestones from the institutions, curators and custodians building institutional-grade onchain yield on Fusion.">
  <meta property="og:url" content="https://fusionecosystem.xyz/demo/news">
  <meta property="og:image" content="https://raw.githubusercontent.com/maderaz/fusionstats/og-cards/demo-news.png">
  <meta property="og:image:width" content="1200">

  <meta property="og:image:alt" content="News: Partnerships, integrations and milestones from the institutions, curators and custodians building institutional-grade onchain yield on Fusion.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Newsroom • Fusion">
  <meta name="twitter:description" content="Partnerships, integrations and milestones from the institutions, curators and custodians building institutional-grade onchain yield on Fusion.">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/maderaz/fusionstats/og-cards/demo-news.png">
  <!-- /page-meta -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/demo/demo.css">
  <style>
    /* News: a short band on the purple ground, the latest story large, then
       the rest in a grid. Every cover is drawn here, from the story's own
       words and a motif that fits it, on the hero's purple. */
    .nw-body { padding-top: 48px; padding-bottom: 112px; }

    .nw-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 36px; }
    .nw-filters button {
      display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 1px solid var(--hair); border-radius: 999px;
      background: #FFFFFF; font: 500 13.5px/1 var(--sans); color: var(--ink-2); white-space: nowrap; cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }
    .nw-filters button:hover { border-color: var(--p300); color: var(--ink); }
    .nw-filters button[aria-pressed="true"] { border-color: var(--g); background: var(--g); color: #FFFFFF; }
    .nw-filters b { font: 500 11.5px/1 var(--mono); color: var(--ink-3); }
    .nw-filters button[aria-pressed="true"] b { color: var(--g-text-3); }

    .nw-meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); white-space: nowrap; }
    .nw-meta b { font-weight: 600; color: var(--p500); }
    .nw-meta i { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: 0.6; }
    .nw-card h3, .nw-feat h3 { margin: 14px 0 0; font-weight: 600; letter-spacing: -0.02em; text-transform: none; color: var(--ink); }
    .nw-card p, .nw-feat p { margin: 10px 0 0; color: var(--ink-2); line-height: 1.6; }
    .nw-card a, .nw-feat a { text-decoration: none; }
    .nw-card a:hover h3, .nw-feat a:hover h3 { color: var(--p500); }
    .nw-card a:hover .nw-cover svg, .nw-feat a:hover .nw-cover svg { transform: scale(1.02); }
    .nw-cover svg { transition: transform 0.4s ease; }

    .nw-feat a { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px; align-items: center; }
    .nw-feat h3 { font-size: clamp(24px, 3cqi, 34px); line-height: 1.15; }
    .nw-feat p { font-size: 16px; }
    .nw-feat .nw-tag { display: inline-block; margin-bottom: 14px; font: 500 11.5px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--p500); }
    .nw-more { display: inline-flex; align-items: center; gap: 6px; margin-top: 20px; font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; }
    .nw-more svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.15s ease; }
    .nw-feat a:hover .nw-more svg { transform: translateX(3px); }

    .nw-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 48px 28px; margin-top: 64px; }
    .nw-card h3 { font-size: 18.5px; line-height: 1.3; }
    .nw-card p { font-size: 14.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .nw-card .nw-meta { margin-top: 18px; }
    /* A story left alone on the grid's last row takes the row, laid out
       like the latest. */
    .nw-card.wide { grid-column: 1 / -1; }
    .nw-card.wide a { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 32px; align-items: center; }
    .nw-card.wide .nw-cover { grid-row: span 4; }
    .nw-card.wide .nw-meta { margin-top: 0; align-self: end; }
    .nw-card.wide p { -webkit-line-clamp: 4; align-self: start; }
    .nw-empty { padding: 40px 0; font-size: 15px; color: var(--ink-3); }

    @container (max-width: 980px) {
      .nw-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .nw-feat a { grid-template-columns: minmax(0, 1fr); gap: 22px; }
    }
    @container (max-width: 640px) {
      .nw-body { padding-top: 32px; }
      .nw-grid { grid-template-columns: minmax(0, 1fr); gap: 40px; margin-top: 48px; }
      .nw-card.wide a { display: block; }
      .nw-card.wide .nw-meta { margin-top: 18px; }
      .nw-cover { border-radius: 12px; }
    }
  </style>
</head>
<body>
<main class="hp" id="top" data-note="A concept for Fusion's newsroom. Covers are drawn on the page, in the hero's style." data-note-short="News concept">
  <h1 class="hp-sr">News</h1>

  <section class="hp-purple">
    <div class="hp-wrap hp-band">
      <span class="hp-k">Newsroom</span>
      <h2 class="hp-h">News from the<br><em>Fusion ecosystem.</em></h2>
      <p class="hp-lead">Partnerships, integrations and milestones from the institutions, curators and custodians building institutional-grade onchain yield on Fusion.</p>
    </div>
  </section>

  <section class="hp-wrap nw-body">
    <div class="nw-filters" id="nwFilters" role="group" aria-label="Category"></div>
    <article class="nw-feat" id="nwFeat"></article>
    <div class="nw-grid" id="nwGrid"></div>
  </section>
</main>
<script src="/demo/demo.js"></script>
<script src="/demo/news/stories.js"></script>
<script>
// The stories, newest first, and a cover drawn for each: the purple ground,
// a glow, the dotted grid, a motif for the kind of story, its key words, and
// the Fusion mark.
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const { S, cover, when, esc } = window.FusionNews;
  const meta = (s) => `<span class="nw-meta"><b>${s.cat}</b><i></i>${when(s.d)}<i></i>${s.min} min read</span>`;
  const arrow = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7h9M7.5 3l4 4-4 4"/></svg>';
  const to = (s) => s.href && s.href.startsWith('/') ? `href="${s.href}"` : `href="${s.href || 'https://www.ipor.io/news'}" target="_blank" rel="noopener"`;

  // Filters: All, then each category with its count.
  const cats = ['All'].concat([...new Set(S.map(s => s.cat))]);
  let pick = 'All';
  $('nwFilters').innerHTML = cats.map(c => `<button type="button" data-c="${c}" aria-pressed="${c === pick}">${c}<b>${c === 'All' ? S.length : S.filter(s => s.cat === c).length}</b></button>`).join('');
  $('nwFilters').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    pick = b.dataset.c;
    [...$('nwFilters').children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    draw();
  });

  function draw() {
    // A pinned story leads; the rest follow, newest first.
    const list = S.filter(s => pick === 'All' || s.cat === pick).sort((a, b) => (b.pin ? 1 : 0) - (a.pin ? 1 : 0));
    const [f, ...rest] = list;
    $('nwFeat').innerHTML = f ? `<a ${to(f)}><span class="nw-cover">${cover(f)}</span>`
      + `<div><span class="nw-tag">${f.pin ? 'Pinned' : 'Latest'}</span>${meta(f)}<h3>${esc(f.t)}</h3><p>${esc(f.x)}</p><span class="nw-more">Read the story${arrow}</span></div></a>` : '';
    // The grid's columns now (3, 2 or 1), so a lone last story can take its row.
    const cols = getComputedStyle($('nwGrid')).gridTemplateColumns.split(' ').length;
    $('nwGrid').innerHTML = rest.map((s, i) => `<article class="nw-card${cols > 1 && rest.length % cols === 1 && i === rest.length - 1 ? ' wide' : ''}"><a ${to(s)}><span class="nw-cover">${cover(s)}</span>`
      + `${meta(s).replace('nw-meta', 'nw-meta')}<h3>${esc(s.t)}</h3><p>${esc(s.x)}</p></a></article>`).join('')
      || (f ? '' : '<p class="nw-empty">No stories here yet.</p>');
    $('nwGrid').style.marginTop = rest.length ? '' : '0';
  }
  draw();
  let w = innerWidth;
  addEventListener('resize', () => { if (innerWidth !== w) { w = innerWidth; draw(); } });
})();
</script>
</body>
</html>
